<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#12333a; --ink-soft:#547079;
  --card:#ffffff;
  --line:#dcebe9;
  --ok:#1eb872; --ok-d:#159a5e;
  --no:#f2762e; --no-d:#d55f1c;
  --acc:#0e9488; --acc-d:#0a736a;
  --acc2:#ef6c3b; --acc2-d:#cf5324;
  --gold:#ffb703;
  --morje:#bfe3f5; --kopno:#e8dfc8; --meja:#9aa79b;
  --r:22px;
}
html,body{height:100%}
body{
  margin:0;
  font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:#eef7f5;
  background-image:
    radial-gradient(1100px 700px at 8% -10%, #d8f0ea 0%, transparent 60%),
    radial-gradient(900px 620px at 100% 0%, #ffe8d8 0%, transparent 55%),
    radial-gradient(900px 700px at 50% 115%, #dcefff 0%, transparent 60%);
  background-attachment:fixed;
  min-height:100dvh;
  overflow-x:hidden;
}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:2;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px))
          calc(34px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- splošni gumbi ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--card);border-radius:18px;padding:14px 20px;
  font-weight:900;font-size:19px;line-height:1;
  box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d)}
.btn-acc:active{box-shadow:0 1px 0 var(--acc-d)}
.btn-ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.btn-ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn-ghost{background:rgba(255,255,255,.8)}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- glava ---------- */
.top{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900}
.brand .glob{font-size:34px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;
  padding:9px 15px;font-weight:900;box-shadow:0 4px 0 var(--line);font-size:17px;white-space:nowrap}
.pill.gold{color:#a86b00}
.icon-btn{width:46px;height:46px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);
  display:grid;place-items:center;font-size:21px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- kartice ---------- */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(18,51,58,.10)}
h2.section{font-size:19px;margin:22px 4px 10px;font-weight:900;color:var(--ink-soft);letter-spacing:.2px}
.lead{margin:0 0 12px;font-weight:700;color:var(--ink-soft);font-size:15.5px;line-height:1.5}
.mini{font-size:13.5px;font-weight:700;color:var(--ink-soft);line-height:1.5;margin:0}

/* ---------- izbira področja ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.step{position:relative;text-align:left;background:#fff;border-radius:20px;padding:15px 16px;
  box-shadow:0 6px 0 var(--line);transition:transform .1s;overflow:hidden}
.step:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.step .emo{font-size:32px;display:block;margin-bottom:4px}
.step .nm{font-weight:900;font-size:18px;display:block}
.step .sub{font-size:13px;color:var(--ink-soft);font-weight:700;display:block;margin-top:3px;line-height:1.35}
.step::after{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c,var(--acc))}

/* ---------- izbira igre ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.mode{position:relative;background:#fff;border-radius:20px;padding:16px 12px 13px;text-align:center;
  box-shadow:0 6px 0 var(--line);transition:transform .1s;overflow:hidden}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.mode .emo{font-size:36px;display:block;margin-bottom:6px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.mode .nm{font-weight:900;font-size:16.5px;display:block}
.mode .sub{font-size:12.5px;color:var(--ink-soft);font-weight:700;display:block;margin-top:2px;line-height:1.35}
.mode::after{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c,var(--acc))}
.mode .lvl{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;
  font-size:12px;font-weight:900;color:var(--ink-soft)}
.mode .bar{flex:1;max-width:70px;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.mode .bar i{display:block;height:100%;background:var(--c,var(--acc))}

/* ---------- igra ---------- */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:999px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}.dot.now{background:var(--acc);transform:scale(1.25)}
.q{font-size:clamp(19px,4.4vw,25px);font-weight:900;line-height:1.3;margin:2px 0 14px;text-wrap:balance}
.q small{display:block;font-size:14.5px;font-weight:800;color:var(--ink-soft);margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opts.dva{grid-template-columns:repeat(2,1fr)}
.opt{background:#f6fbfa;border:2px solid var(--line);border-radius:18px;padding:15px 14px;font-weight:900;font-size:18px;
  box-shadow:0 5px 0 var(--line);transition:transform .08s;text-align:center;line-height:1.25;
  display:flex;flex-direction:column;align-items:center;gap:8px;min-height:60px;justify-content:center}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok-d);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.opt.no{background:var(--no);border-color:var(--no-d);color:#fff;box-shadow:0 5px 0 var(--no-d)}
.opt[disabled]{opacity:1;pointer-events:none}
.opt svg{border-radius:5px;box-shadow:0 2px 6px rgba(18,51,58,.25)}
.opt .veliki{font-size:44px;line-height:1}
.odziv{margin-top:14px;font-weight:900;font-size:17px;min-height:26px;line-height:1.45}
.odziv .zakaj{display:block;font-weight:800;font-size:14.5px;color:var(--ink-soft);margin-top:5px}

/* ---------- zemljevid ---------- */
.zem{position:relative;background:var(--morje);border-radius:18px;overflow:hidden;
  box-shadow:inset 0 0 0 2px var(--line);touch-action:manipulation}
.zem svg{display:block;width:100%;height:auto}
.zem path.dz{fill:var(--kopno);stroke:var(--meja);stroke-width:1;stroke-linejoin:round}
.zem path.dz.igra{cursor:pointer;fill:#f3d9a5}
.zem path.dz.igra:hover{fill:#ffe9bd}
.zem path.dz.zad{fill:#f2ede1;pointer-events:none}
.zem path.dz.tuja{fill:#efe9dc;pointer-events:none}
.zem path.dz.nas{fill:#dcecd2;stroke:#5b8c5a;stroke-width:2;pointer-events:none}
.zem path.dz.prav{fill:var(--ok)}
.zem path.dz.narobe{fill:var(--no)}
.zem .tocka{cursor:pointer}
.zem .tocka circle{fill:#fff;stroke:var(--acc-d);stroke-width:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.zem .tocka.prav circle{fill:var(--ok);stroke:#0a6b41}
.zem .tocka.narobe circle{fill:var(--no);stroke:#a34612}
.zem .oznaka{font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
.zem .kazalec{pointer-events:none}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.92);
  font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(18,51,58,.18);display:grid;place-items:center}

/* ---------- konec kroga ---------- */
.konec{text-align:center}
.konec .big{font-size:56px;line-height:1;margin-bottom:8px}
.konec h3{font-size:26px;margin:0 0 6px;font-weight:900}
.seznam{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;text-align:left}
.seznam li{background:#f7fbfa;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;line-height:1.4}
.seznam li b{color:var(--acc-d)}

/* ---------- pojavno okno ---------- */
.modal{position:fixed;inset:0;background:rgba(18,51,58,.45);display:grid;place-items:center;
  padding:18px;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:22px;padding:20px;max-width:520px;width:100%;
  box-shadow:0 18px 50px rgba(18,51,58,.35);max-height:86dvh;overflow:auto}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.level{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;font-weight:900;
  box-shadow:0 5px 0 var(--line)}
.level small{display:block;font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:3px}
.level[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d)}
.level[aria-pressed="true"] small{color:#d6f2ee}

.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:76px;
  pointer-events:none;animation:pop .85s ease-out forwards;z-index:30}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:430px){
  .opt{font-size:16.5px;padding:13px 10px}
  .modes{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>

/* ======================= ZASTAVE ==========================================
   Zastave niso slike, ampak jih sproti narišemo iz osnovnih likov – tako je
   igra še vedno ena sama datoteka in deluje brez interneta. Vse so v razmerju
   3:2 (90×60 enot), tudi tiste, ki so v resnici kvadratne ali daljše, grbi pa
   so poenostavljeni: prepoznavni, ne heraldično natančni. */

function zvezdaPot(cx, cy, r, kraki, zasuk){
  const k = kraki || 5, z = (zasuk || -90) * Math.PI / 180, n = r * (k === 6 ? 0.577 : 0.382);
  let d = '';
  for (let i = 0; i < k * 2; i++){
    const a = z + i * Math.PI / k, rr = (i % 2 ? n : r);
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(2) + ' ' + (cy + Math.sin(a) * rr).toFixed(2);
  }
  return d + 'Z';
}

function zastavaSvg(id, sir){
  const spec = ZASTAVE[id];
  const w = sir || 90, h = Math.round(w * 2 / 3);
  let s = '<svg viewBox="0 0 90 60" width="' + w + '" height="' + h + '" aria-hidden="true">';
  if (!spec) return s + '<rect width="90" height="60" fill="#dcebe9"/><text x="45" y="38" font-size="26" text-anchor="middle">?</text></svg>';
  s += '<rect width="90" height="60" fill="#fff"/>';
  for (const o of spec) s += lik(o);
  s += '<rect width="90" height="60" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/></svg>';
  return s;
}

function lik(o){
  const t = o[0];
  if (t === 'h' || t === 'v'){
    const b = o.slice(1), n = b.length, d = (t === 'h' ? 60 : 90) / n;
    return b.map((c, i) => t === 'h'
      ? '<rect y="' + (i*d) + '" width="90" height="' + (d+0.4) + '" fill="' + c + '"/>'
      : '<rect x="' + (i*d) + '" width="' + (d+0.4) + '" height="60" fill="' + c + '"/>').join('');
  }
  if (t === 'hw' || t === 'vw'){
    const p = o.slice(1), vsota = p.reduce((a, x) => a + x[0], 0);
    let k = 0, s = '';
    for (const [u, c] of p){
      const d = (t === 'hw' ? 60 : 90) * u / vsota;
      s += t === 'hw' ? '<rect y="' + k + '" width="90" height="' + (d+0.4) + '" fill="' + c + '"/>'
                      : '<rect x="' + k + '" width="' + (d+0.4) + '" height="60" fill="' + c + '"/>';
      k += d;
    }
    return s;
  }
  if (t === 'bg') return '<rect width="90" height="60" fill="' + o[1] + '"/>';
  if (t === 'pr') return '<rect x="' + o[1] + '" y="' + o[2] + '" width="' + o[3] + '" height="' + o[4] + '" fill="' + o[5] + '"/>';
  if (t === 'kr') return '<circle cx="' + o[1] + '" cy="' + o[2] + '" r="' + o[3] + '" fill="' + o[4] + '"/>';
  if (t === 'ko') return '<circle cx="' + o[1] + '" cy="' + o[2] + '" r="' + o[3] + '" fill="none" stroke="' + o[4] + '" stroke-width="' + (o[5]||2) + '"/>';
  if (t === 'zv') return '<path d="' + zvezdaPot(o[1], o[2], o[3], o[5], o[6]) + '" fill="' + o[4] + '"/>';
  if (t === 'pt') return '<path d="' + o[1] + '" fill="' + o[2] + '"' + (o[3] ? ' stroke="' + o[3] + '" stroke-width="' + (o[4]||1) + '"' : '') + '/>';
  if (t === 'nk'){                                     /* nordijski križ */
    const d = o[2] || 10, x = o[3] || 32;
    return '<rect x="' + (x-d/2) + '" width="' + d + '" height="60" fill="' + o[1] + '"/>' +
           '<rect y="' + (30-d/2) + '" width="90" height="' + d + '" fill="' + o[1] + '"/>';
  }
  if (t === 'kri'){                                    /* sredinski križ */
    const d = o[2] || 12;
    return '<rect x="' + (45-d/2) + '" y="8" width="' + d + '" height="44" fill="' + o[1] + '"/>' +
           '<rect x="23" y="' + (30-d/2) + '" width="44" height="' + d + '" fill="' + o[1] + '"/>';
  }
  if (t === 'pm'){                       /* polmesec: krog, iz katerega izreže drugi krog */
    const [_, cx, cy, r, c, ozadje] = o;
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + c + '"/>' +
           '<circle cx="' + (cx + r*0.3) + '" cy="' + cy + '" r="' + (r*0.82) + '" fill="' + ozadje + '"/>';
  }
  if (t === 'son'){                                    /* sonce z žarki */
    const [_, cx, cy, r, c, n] = o;
    let s = '';
    for (let i = 0; i < n; i++){
      const a = i * 2 * Math.PI / n;
      s += '<rect x="' + (cx-1.3) + '" y="' + (cy-r*2.2) + '" width="2.6" height="' + (r*2.2) +
           '" fill="' + c + '" transform="rotate(' + (i*360/n) + ' ' + cx + ' ' + cy + ')"/>';
    }
    return s + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + c + '"/>';
  }
  if (t === 'sah'){                                    /* šahovnica */
    const [_, x, y, w, h, c1, c2, n] = o;
    const dw = w / n, dh = h / n;
    let s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c1 + '"/>';
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
      if ((i + j) % 2) s += '<rect x="' + (x + i*dw) + '" y="' + (y + j*dh) + '" width="' + (dw+0.2) + '" height="' + (dh+0.2) + '" fill="' + c2 + '"/>';
    return s;
  }
  return '';
}

/* ======================= ZEMLJEVID ========================================
   Zemljevid je navaden SVG: vsaka država je ena pot, ki jo je mogoče tapniti.
   Premikanje in približevanje sta narejena s spreminjanjem viewBoxa.       */

const RAD = Math.PI / 180;
function stozec(lon, lat, p){
  const f1 = p.f1 * RAD, f2 = p.f2 * RAD, l0 = p.l0 * RAD;
  const n = Math.log(Math.cos(f1) / Math.cos(f2)) /
            Math.log(Math.tan(Math.PI/4 + f2/2) / Math.tan(Math.PI/4 + f1/2));
  const F = Math.cos(f1) * Math.pow(Math.tan(Math.PI/4 + f1/2), n) / n;
  const r0 = F / Math.pow(Math.tan(Math.PI/4 + p.f0 * RAD/2), n);
  const r  = F / Math.pow(Math.tan(Math.PI/4 + lat * RAD/2), n);
  const th = n * (lon * RAD - l0);
  return [r * Math.sin(th), r0 - r * Math.cos(th)];
}
const ROB_X = [1,0.9986,0.9954,0.99,0.9822,0.973,0.96,0.9427,0.9216,0.8962,
               0.8679,0.835,0.7986,0.7597,0.7186,0.6732,0.6213,0.5722,0.5322];
const ROB_Y = [0,0.062,0.124,0.186,0.248,0.31,0.372,0.434,0.4958,0.5571,
               0.6176,0.6769,0.7346,0.7903,0.8435,0.8936,0.9394,0.9761,1];
function robinson(lon, lat){
  const a = Math.min(Math.abs(lat), 89.999) / 5, i = Math.min(17, Math.floor(a)), t = a - i;
  const x = ROB_X[i] + (ROB_X[i+1] - ROB_X[i]) * t;
  const y = ROB_Y[i] + (ROB_Y[i+1] - ROB_Y[i]) * t;
  return [lon * RAD * x, (lat < 0 ? -y : y) * 1.3523];
}
/* iz zemljepisnih stopinj v enote zemljevida */
function vZemljevid(zem, lat, lon){
  const t = (zem.proj.vrsta === 'robinson') ? robinson(lon, lat) : stozec(lon, lat, zem.proj);
  return [t[0] * zem.k + zem.dx, -t[1] * zem.k + zem.dy];
}

const ZEMLJEVIDI = { svet: ZEM_SVET, evropa: ZEM_EVROPA, slovenija: ZEM_SLO };

/* okvir poti – da vemo, kje je država in kako velika je */
const _okviri = {};
function okvirPoti(d){
  if (_okviri[d]) return _okviri[d];
  const st = d.match(/-?\d+(\.\d+)?/g) || [];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i + 1 < st.length; i += 2){
    const x = +st[i], y = +st[i+1];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return (_okviri[d] = { x:x0, y:y0, w:x1-x0, h:y1-y0, cx:(x0+x1)/2, cy:(y0+y1)/2 });
}
function okvirDrzave(kljuc, id){
  const z = ZEMLJEVIDI[kljuc]; return z.d[id] ? okvirPoti(z.d[id]) : null;
}
/* Polmer pike na zemljevidu – isti izračun kot v novZemljevid().tocke(), da lahko že pri
   izbiri poskrbimo, da se pike ne prekrivajo. Zemljevid Slovenije igra pred risanjem pik
   približa na državo (pokazi(okvir, 1.12)), zato je tam pogled ožji in pika manjša. */
function polmerPike(kljuc){
  const z = ZEMLJEVIDI[kljuc];
  let sirina = z.w;
  if (kljuc === 'slovenija'){
    const o = okvirDrzave('slovenija', 'Slovenia');
    if (o) sirina = Math.max(z.w * 0.12, Math.min(z.w, Math.max(o.w, o.h * z.w / z.h) * 1.12));
  }
  return Math.max(4, sirina / 42);
}

/* države, ki so na zemljevidu dovolj velike, da jih otrok lahko tapne */
function tapljive(kljuc, najmanj){
  const z = ZEMLJEVIDI[kljuc], out = [];
  for (const id in z.d){ const o = okvirPoti(z.d[id]); if (o.w * o.h >= (najmanj || 60)) out.push(id); }
  return out;
}

function novZemljevid(vsebnik, kljuc, nast){
  const z = ZEMLJEVIDI[kljuc];
  nast = nast || {};
  const poti = Object.keys(z.d).map(id => {
    let r = 'dz';
    if (nast.zive) r += (nast.zive.indexOf(id) < 0 ? ' zad' : ' igra');
    if (nast.poudari) r += (id === nast.poudari ? ' nas' : ' tuja');
    return '<path class="' + r + '" data-id="' + id.replace(/"/g, '') + '" d="' + z.d[id] + '"/>';
  }).join('');
  vsebnik.innerHTML =
    '<div class="zem"><svg viewBox="0 0 ' + z.w + ' ' + z.h + '" preserveAspectRatio="xMidYMid meet">' +
      '<g class="karta">' + poti + '</g><g class="tocke"></g><g class="napisi"></g></svg>' +
      '<div class="zoom"><button type="button" data-zoom="-1" aria-label="Pomanjšaj">–</button>' +
      '<button type="button" data-zoom="1" aria-label="Povečaj">+</button>' +
      '<button type="button" data-zoom="0" aria-label="Ves zemljevid">⤢</button></div></div>';
  const el = vsebnik.querySelector('.zem'), svg = el.querySelector('svg');
  const vb = { x:0, y:0, w:z.w, h:z.h };
  function nastaviVB(){ svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h); }

  function priblizaj(f, cx, cy){
    const nw = Math.max(z.w * 0.12, Math.min(z.w, vb.w * f));
    const nh = nw * z.h / z.w;
    if (cx === undefined){ cx = vb.x + vb.w / 2; cy = vb.y + vb.h / 2; }
    vb.x = cx - (cx - vb.x) * (nw / vb.w);
    vb.y = cy - (cy - vb.y) * (nh / vb.h);
    vb.w = nw; vb.h = nh;
    vb.x = Math.max(-10, Math.min(z.w - vb.w + 10, vb.x));
    vb.y = Math.max(-10, Math.min(z.h - vb.h + 10, vb.y));
    nastaviVB();
  }
  /* pokaži izbrani del zemljevida (npr. eno državo z okolico) */
  function pokazi(okvir, obroba){
    const r = obroba === undefined ? 2.2 : obroba;
    const w = Math.max(z.w * 0.12, Math.min(z.w, Math.max(okvir.w, okvir.h * z.w / z.h) * r));
    vb.w = w; vb.h = w * z.h / z.w;
    vb.x = Math.max(0, Math.min(z.w - vb.w, okvir.cx - vb.w / 2));
    vb.y = Math.max(0, Math.min(z.h - vb.h, okvir.cy - vb.h / 2));
    nastaviVB();
  }

  el.querySelector('.zoom').addEventListener('click', e => {
    const b = e.target.closest('[data-zoom]'); if (!b) return;
    e.stopPropagation();
    const v = +b.dataset.zoom;
    if (v === 0){ vb.x = 0; vb.y = 0; vb.w = z.w; vb.h = z.h; nastaviVB(); }
    else priblizaj(v > 0 ? 0.62 : 1.6);
  });

  /* vlečenje s prstom ali miško */
  let vlec = null, premik = 0;
  svg.addEventListener('pointerdown', e => {
    vlec = { x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y, ujet:false }; premik = 0;
  });
  svg.addEventListener('pointermove', e => {
    if (!vlec) return;
    const r = svg.getBoundingClientRect();
    const dx = (e.clientX - vlec.x) * vb.w / r.width, dy = (e.clientY - vlec.y) * vb.h / r.height;
    premik = Math.max(premik, Math.abs(e.clientX - vlec.x) + Math.abs(e.clientY - vlec.y));
    if (premik < 6) return;
    /* prst ujamemo šele, ko res vleče – sicer bi tap romal na okvir namesto na državo */
    if (!vlec.ujet){ try { svg.setPointerCapture(e.pointerId); } catch(err){} vlec.ujet = true; }
    vb.x = Math.max(-10, Math.min(z.w - vb.w + 10, vlec.vx - dx));
    vb.y = Math.max(-10, Math.min(z.h - vb.h + 10, vlec.vy - dy));
    nastaviVB();
  });
  svg.addEventListener('pointerup', e => {
    if (vlec && vlec.ujet){ try { svg.releasePointerCapture(e.pointerId); } catch(err){} }
    vlec = null;
  });
  svg.addEventListener('pointercancel', () => { vlec = null; });

  const api = {
    el, svg,
    naTap(f){
      svg.addEventListener('click', e => {
        if (premik >= 6) return;                 /* vlekel je zemljevid, ne izbiral */
        let t = e.target.closest && e.target.closest('[data-id]');
        if (!t){                                 /* rezerva, če je dogodek pristal na okviru */
          const pod = document.elementFromPoint(e.clientX, e.clientY);
          t = pod && pod.closest ? pod.closest('[data-id]') : null;
        }
        f(t ? t.dataset.id : null, e);
      });
    },
    oznaci(id, razred){
      const p = svg.querySelector('.karta [data-id="' + id + '"]');
      if (p) p.classList.add(razred);
      return p;
    },
    napis(id, besedilo){
      const o = okvirDrzave(kljuc, id); if (!o) return;
      api.napisNa(o.cx, o.cy, besedilo);
    },
    napisNa(x, y, besedilo){
      const g = svg.querySelector('.napisi');
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', x); t.setAttribute('y', y);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'oznaka');
      t.setAttribute('font-size', Math.max(9, vb.w / 26));
      t.textContent = besedilo;
      g.appendChild(t);
    },
    tocke(sez, naKlik){
      const g = svg.querySelector('.tocke');
      g.innerHTML = '';
      sez.forEach((t, i) => {
        const [x, y] = vZemljevid(z, t.p[0], t.p[1]);
        const el2 = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        el2.setAttribute('class', 'tocka');
        el2.dataset.i = i;
        const r = Math.max(4, vb.w / 42);
        el2.innerHTML = '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '"/>';
        g.appendChild(el2);
      });
      if (naKlik) g.addEventListener('click', e => {
        if (premik >= 6) return;
        let t = e.target.closest && e.target.closest('.tocka');
        if (!t){
          const pod = document.elementFromPoint(e.clientX, e.clientY);
          t = pod && pod.closest ? pod.closest('.tocka') : null;
        }
        if (t) naKlik(+t.dataset.i, t);
      });
    },
    oznaciTocko(i, razred){
      const t = svg.querySelector('.tocke .tocka[data-i="' + i + '"]');
      if (t) t.classList.add(razred);
      return t;
    },
    mesto(lat, lon){ return vZemljevid(z, lat, lon); },
    pokazi, priblizaj, zemljevid: z
  };
  return api;
}

/* ======================= POMOŽNE FUNKCIJE ================================ */
const R = n => Math.floor(Math.random() * n);
const ena = a => a[R(a.length)];
function premesaj(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = R(i+1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* iz pravilnega odgovora in zaloge naredi premešane možnosti */
function moznosti(prav, zaloga, n, kljucFn){
  const k = kljucFn || (x => x);
  const izbrane = [prav], vid = { [k(prav)]: 1 };
  const z = premesaj(zaloga);
  for (const x of z){ if (izbrane.length >= n) break; if (!vid[k(x)]){ vid[k(x)] = 1; izbrane.push(x); } }
  const sh = premesaj(izbrane);
  return { opts: sh, a: sh.indexOf(prav) };
}
const stMoznosti = st => [2, 3, 3, 4, 4][st-1] || 4;
const najT = st => st <= 1 ? 1 : (st <= 3 ? 2 : 3);

/* nabori držav */
function drzaveNa(karta){
  const z = ZEMLJEVIDI[karta];
  return DRZAVE.filter(d => z.d[d.id]);
}
function nabor(karta, st, dodatno){
  const mt = najT(st);
  return drzaveNa(karta).filter(d => d.t <= mt && (!dodatno || dodatno(d)));
}
const evropske = d => d.celina.indexOf('Evropa') === 0;

/* ======================= GENERATORJI VPRAŠANJ ============================ */

/* Kje leži? – tapni državo na zemljevidu */
function gZemljevid(karta, filter){
  return function(st){
    const veliki = tapljive(karta, karta === 'svet' ? 55 : 90);
    let mozne = nabor(karta, st, filter).filter(d => veliki.indexOf(d.id) >= 0);
    if (!mozne.length) mozne = nabor(karta, 5, filter).filter(d => veliki.indexOf(d.id) >= 0);
    const d = ena(mozne);
    const kolikoZivih = [4, 6, 8, 12, 0][st-1];
    let zive = null;
    if (kolikoZivih){
      const drugi = premesaj(mozne.filter(x => x.id !== d.id)).slice(0, kolikoZivih - 1);
      zive = [d.id].concat(drugi.map(x => x.id));
    }
    return { tip:'zemljevid', karta, cilj:d.id, zive,
             v:'Kje leži ' + d.sl + '?',
             pod: zive ? 'Tapni pravo državo med osvetljenimi.' : 'Tapni pravo državo na zemljevidu.',
             zn: d.zn, kljuc:'zem:' + karta + ':' + d.id, ucim:d.sl };
  };
}

/* Zastava → država */
function gZastavaVIme(filter){
  return function(st){
    const zal = DRZAVE.filter(d => ZASTAVE[d.id] && (!filter || filter(d)));
    const d = ena(zal.filter(x => x.t <= najT(st)).length ? zal.filter(x => x.t <= najT(st)) : zal);
    const m = moznosti(d, zal, stMoznosti(st), x => x.sl);
    return { tip:'izbira', v:'Čigava je ta zastava?', slika: zastavaSvg(d.id, 200),
             opts: m.opts.map(x => ({ txt:x.sl })), a:m.a, zn:d.zn,
             kljuc:'zas:' + d.id, ucim:d.sl };
  };
}
/* Država → zastava */
function gImeVZastavo(filter){
  return function(st){
    const zal = DRZAVE.filter(d => ZASTAVE[d.id] && (!filter || filter(d)));
    const ozji = zal.filter(x => x.t <= najT(st));
    const d = ena(ozji.length ? ozji : zal);
    const m = moznosti(d, zal, Math.min(4, stMoznosti(st)), x => x.sl);
    return { tip:'izbira', v:'Katera je zastava države ' + d.sl + '?',
             opts: m.opts.map(x => ({ txt:'', svg: zastavaSvg(x.id, 120) })), a:m.a, zn:d.zn,
             kljuc:'zas2:' + d.id, ucim:d.sl };
  };
}
/* Država → glavno mesto in obratno */
function gPrestolnica(filter, obratno){
  return function(st){
    const zal = DRZAVE.filter(d => !filter || filter(d));
    const ozji = zal.filter(x => x.t <= najT(st));
    const d = ena(ozji.length ? ozji : zal);
    const m = moznosti(d, zal, stMoznosti(st), x => obratno ? x.sl : x.pm);
    if (obratno) return { tip:'izbira', v:'Katere države je glavno mesto ' + d.pm + '?',
      opts: m.opts.map(x => ({ txt:x.sl })), a:m.a, zn:d.zn, kljuc:'pm2:' + d.id, ucim:d.sl };
    return { tip:'izbira', v:'Katero je glavno mesto države ' + d.sl + '?',
      opts: m.opts.map(x => ({ txt:x.pm })), a:m.a, zn:d.zn, kljuc:'pm:' + d.id, ucim:d.sl };
  };
}
/* Katera država meji na ...? */
function gSoseda(filter, motnje){
  return function(st){
    const zal = DRZAVE.filter(d => (!filter || filter(d)) && d.s.some(s => PO_IMENU[s]));
    const ozji = zal.filter(x => x.t <= najT(st));
    const d = ena(ozji.length ? ozji : zal);
    const prav = PO_IMENU[ena(d.s.filter(s => PO_IMENU[s]))];
    /* zmotilci pridejo iz širšega nabora, sicer jih pri majhnih skupinah zmanjka */
    const nesosede = DRZAVE.filter(x => x.sl !== d.sl && d.s.indexOf(x.sl) < 0 &&
                                        ((motnje || filter) ? (motnje || filter)(x) : true));
    const m = moznosti(prav, nesosede, stMoznosti(st), x => x.sl);
    return { tip:'izbira', v:'Katera od teh držav meji na državo ' + d.sl + '?',
             opts: m.opts.map(x => ({ txt:x.sl })), a:m.a,
             zn:d.sl + ' meji na: ' + d.s.join(', ') + '.',
             kljuc:'sos:' + d.id, ucim:d.sl };
  };
}
/* Na kateri celini leži? */
function gCelina(){
  return function(st){
    const zal = DRZAVE.filter(x => x.t <= najT(st));
    const d = ena(zal.length ? zal : DRZAVE);
    const prava = d.celina;
    const druge = CELINE.map(c => c.n).filter(c => c !== prava);
    const m = moznosti(prava, druge, stMoznosti(st));
    return { tip:'izbira', v:'Na kateri celini leži ' + d.sl + '?',
             opts: m.opts.map(x => ({ txt:x })), a:m.a, zn:d.zn,
             kljuc:'cel:' + d.id, ucim:d.sl };
  };
}
/* Tapni kraj na zemljevidu (gore, reke, mesta, znamenitosti) */
function gTocke(karta, seznam, uvod){
  return function(st){
    const mt = najT(st);
    let zal = seznam().filter(x => x.t <= mt);
    if (zal.length < 4) zal = seznam();
    const c = ena(zal);
    /* Motilne pike morajo biti dovolj daleč od prave in druga od druge – sicer bi se
       prekrile in otrok prave sploh ne bi mogel tapniti. Če jih toliko ni, razmik popuščamo. */
    const z = ZEMLJEVIDI[karta], r = polmerPike(karta);
    const lega = x => vZemljevid(z, x.p[0], x.p[1]);
    const kandidati = premesaj(seznam().filter(x => x.n !== c.n));
    const koliko = stMoznosti(st);
    let izbrani = [c];
    for (const razmik of [2 * r, 1.4 * r, r, 0]){
      izbrani = [c];
      const lege = [lega(c)];
      for (const x of kandidati){
        if (izbrani.length >= koliko) break;
        const l = lega(x);
        if (lege.every(m => Math.hypot(l[0] - m[0], l[1] - m[1]) >= razmik)){ izbrani.push(x); lege.push(l); }
      }
      if (izbrani.length >= koliko) break;
    }
    const vse = premesaj(izbrani);
    return { tip:'tocke', karta, tocke:vse, a:vse.indexOf(c),
             v:(uvod || 'Kje je') + ' ' + c.n + '?',
             pod:'Tapni pravo piko na zemljevidu.', zn:c.zn,
             kljuc:'toc:' + karta + ':' + c.n, ucim:c.n };
  };
}
/* Vprašanja iz zbirke dejstev */
function gDejstva(banka){
  return function(st){
    const mt = najT(st);
    let zal = banka().filter(x => (x.t || 2) <= mt);
    if (!zal.length) zal = banka();
    const q = ena(zal);
    const n = Math.min(stMoznosti(st) - 1, q.n.length);
    const izb = premesaj(q.n).slice(0, n);
    const sh = premesaj([q.o].concat(izb));
    return { tip:'izbira', v:q.v, opts: sh.map(x => ({ txt:x })), a:sh.indexOf(q.o),
             zn:q.zn || '', kljuc:'dej:' + q.v, ucim:q.v };
  };
}
/* Je država v Evropski uniji? */
function gEu(){
  return function(st){
    const zal = DRZAVE.filter(evropske).filter(x => x.t <= Math.max(2, najT(st)));
    const d = ena(zal);
    const je = EU.indexOf(d.sl) >= 0;
    const sh = ['da', 'ne'];
    return { tip:'izbira', v:'Ali je ' + d.sl + ' v Evropski uniji?',
             opts: sh.map(x => ({ txt: x === 'da' ? 'Da ✅' : 'Ne ❌' })), a: je ? 0 : 1,
             zn: je ? d.sl + ' je članica Evropske unije.' :
                      d.sl + ' ni članica Evropske unije. Unija ima 27 članic.',
             kljuc:'eu:' + d.id, ucim:d.sl };
  };
}
/* V kateri pokrajini leži slovensko mesto? */
function gPokrajina(){
  return function(st){
    const zal = SLO_MESTA.filter(x => x.t <= najT(st));
    const m = ena(zal.length ? zal : SLO_MESTA);
    const druge = SLO_POKRAJINE.filter(p => p !== m.pk);
    const mm = moznosti(m.pk, druge, stMoznosti(st));
    return { tip:'izbira', v:'V kateri pokrajini leži ' + m.n + '?',
             opts: mm.opts.map(x => ({ txt:x })), a:mm.a, zn:m.zn,
             kljuc:'pok:' + m.n, ucim:m.n };
  };
}
/* Katera je najvišja / najdaljša? */
function gNajvecja(seznam, polje, vprasanje, enota){
  return function(st){
    const n = stMoznosti(st) + (st >= 4 ? 1 : 0);
    const izb = premesaj(seznam()).slice(0, Math.max(3, n));
    let najb = izb[0];
    for (const x of izb) if (x[polje] > najb[polje]) najb = x;
    return { tip:'izbira', v:vprasanje,
             opts: izb.map(x => ({ txt:x.n })), a:izb.indexOf(najb),
             zn: najb.n + ' – ' + najb[polje] + ' ' + enota + '. ' +
                 premesaj(izb.filter(x => x !== najb)).map(x => x.n + ' ' + x[polje] + ' ' + enota).join(', ') + '.',
             kljuc:'naj:' + izb.map(x => x.n).sort().join('|'), ucim:najb.n };
  };
}
/* Ponovi tisto, kar je delalo težave */
function gPonovi(igre){
  return function(st, pod){
    const slabi = Object.keys(STANJE.slabo).filter(k => STANJE.slabo[k] > 0);
    const idji = igre.filter(g => g !== 'ponovi');
    for (let i = 0; i < 25; i++){
      const q = IGRE[ena(idji)].gen(Math.max(st, 3), pod);
      if (!slabi.length || slabi.indexOf(q.ucim) >= 0) return q;
    }
    return IGRE[ena(idji)].gen(st, pod);
  };
}

/* Kaj je to? – po opisu ugani celino ali ocean */
function gOpis(seznam, vprasanje){
  return function(st){
    const s = seznam();
    const c = ena(s);
    const m = moznosti(c, s, stMoznosti(st), x => x.n);
    return { tip:'izbira', v:vprasanje + ' »' + c.zn + '«',
             opts: m.opts.map(x => ({ txt:x.n })), a:m.a, zn:'', kljuc:'opis:' + c.n, ucim:c.n };
  };
}

/* ======================= STANJE ========================================== */
const LS = 'globko_geografija_v1';
const SVEZE = { zvezde:0, zvok:true, nacin:'auto', st:{}, gor:{}, dol:{}, slabo:{}, krogi:0 };
let STANJE = naloziStanje();
function naloziStanje(){
  try{
    const raw = localStorage.getItem(LS);
    if (!raw) return Object.assign({}, SVEZE);
    const s = Object.assign({}, SVEZE, JSON.parse(raw));
    for (const k of ['st','gor','dol','slabo']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
    return s;
  } catch(e){ return Object.assign({}, SVEZE); }
}
function shrani(){ try{ localStorage.setItem(LS, JSON.stringify(STANJE)); } catch(e){} }
const kljucIgre = (pod, gid) => pod.id + ':' + gid;

function stopnjaIgre(pod, gid){
  const g = IGRE[gid];
  if (STANJE.nacin !== 'auto'){
    const del = { lahko:0.2, srednje:0.6, tezko:1 }[STANJE.nacin] || 0.6;
    return Math.max(1, Math.round(g.stopnje * del));
  }
  return Math.min(g.stopnje, Math.max(1, STANJE.st[kljucIgre(pod, gid)] || 1));
}
/* trije pravilni zapored gor, dva zaporedna spodrsljaja dol */
function prilagodi(pod, gid, prav){
  if (STANJE.nacin !== 'auto') return 0;
  const k = kljucIgre(pod, gid), g = IGRE[gid], zdaj = stopnjaIgre(pod, gid);
  if (prav){
    STANJE.gor[k] = (STANJE.gor[k] || 0) + 1; STANJE.dol[k] = 0;
    if (STANJE.gor[k] >= 3 && zdaj < g.stopnje){ STANJE.st[k] = zdaj + 1; STANJE.gor[k] = 0; return 1; }
  } else {
    STANJE.dol[k] = (STANJE.dol[k] || 0) + 1; STANJE.gor[k] = 0;
    if (STANJE.dol[k] >= 2 && zdaj > 1){ STANJE.st[k] = zdaj - 1; STANJE.dol[k] = 0; return -1; }
  }
  return 0;
}
function zabelezi(ucim, prav){
  if (!ucim) return;
  if (prav){ if (STANJE.slabo[ucim]){ STANJE.slabo[ucim]--; if (STANJE.slabo[ucim] <= 0) delete STANJE.slabo[ucim]; } }
  else STANJE.slabo[ucim] = Math.min(3, (STANJE.slabo[ucim] || 0) + 2);
}

  try{
    /* na nekaterih napravah (in v samodejnih preizkusih) zvočna naprava ni na voljo;
       takrat tiho nadaljujemo brez zvoka */
    if (c.state === 'suspended'){ const r = c.resume(); if (r && r.catch) r.catch(() => {}); }
    fs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = vrsta || 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(c.destination);
      const t = c.currentTime + i * (dolzina * 0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dolzina);
      o.start(t); o.stop(t + dolzina + 0.02);
    });
  } catch(e){}
}
const zvOk = () => pisk([660, 880], 0.16);
const zvNe = () => pisk([300, 220], 0.2, 'triangle');
const zvZvezda = () => pisk([784, 988, 1319], 0.18);
const zvStopnja = () => pisk([523, 659, 784, 1047], 0.16);

/* ======================= IZRIS =========================================== */
const $ = id => document.getElementById(id);
const scrPod = $('scrPodrocja'), scrIgre = $('scrIgre'), scrIgra = $('scrIgra');
function pokaziZaslon(el){ [scrPod, scrIgre, scrIgra].forEach(s => s.hidden = (s !== el)); window.scrollTo(0, 0); }
function narisiZvezde(){ $('zvezde').textContent = STANJE.zvezde; }
function poskoci(emo){
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = emo; document.body.appendChild(d);
  setTimeout(() => d.remove(), 850);
}
function naziv(n){
  const t = [[0,'Popotnik 🎒'],[30,'Raziskovalec 🧭'],[80,'Kartograf 🗺️'],[160,'Poznavalec sveta 🌍'],
             [280,'Mojster geografije 🏅'],[450,'Globus v glavi 👑']];
  let out = t[0][1];
  for (const [n2, nm] of t) if (n >= n2) out = nm;
  return out;
}

function narisiPodrocja(){
  scrPod.innerHTML =
    '<div class="card">' +
      '<p class="lead">Živjo! Jaz sem <b>Globko</b> 🌍. Skupaj bova raziskala Slovenijo, Evropo in svet. ' +
      'Izberi področje – naloge se same prilagodijo temu, kar že znaš.</p>' +
      '<div class="steps">' +
      PODROCJA.map(p =>
        '<button class="step" data-pod="' + p.id + '" style="--c:' + p.c + '">' +
          '<span class="emo">' + p.emo + '</span>' +
          '<span class="nm">' + esc(p.nm) + '</span>' +
          '<span class="sub">' + esc(p.sub) + '</span>' +
        '</button>').join('') +
      '</div>' +
      '<p class="mini" style="margin-top:14px">Naziv: <b>' + naziv(STANJE.zvezde) + '</b> · odigranih krogov: <b>' + STANJE.krogi + '</b></p>' +
    '</div>';
  pokaziZaslon(scrPod);
}

function narisiIgre(pod){
  const kartice = pod.igre.map(gid => {
    const g = IGRE[gid], st = stopnjaIgre(pod, gid);
    return '<button class="mode" data-igra="' + gid + '" style="--c:' + g.c + '">' +
      '<span class="emo">' + g.emo + '</span>' +
      '<span class="nm">' + esc(g.nm) + '</span>' +
      '<span class="sub">' + esc(g.sub) + '</span>' +
      '<span class="lvl"><b>' + st + '/' + g.stopnje + '</b>' +
        '<span class="bar"><i style="width:' + Math.round(st / g.stopnje * 100) + '%"></i></span></span>' +
    '</button>';
  }).join('');
  scrIgre.innerHTML =
    '<div class="row" style="margin:0 0 12px"><button class="btn btn-ghost" id="nazajDomov">⬅️ Nazaj</button>' +
      '<div class="pill">' + pod.emo + ' ' + esc(pod.nm) + '</div></div>' +
    '<div class="card"><p class="lead">' + esc(pod.sub) + '</p>' +
    '<h2 class="section" style="margin-top:0">Izberi igro</h2>' +
    '<div class="modes">' + kartice + '</div>' +
    '<p class="mini" style="margin-top:14px">Številka na kartici pove, na kateri stopnji te igre si. ' +
    'Ko ti gre dobro, se stopnja sama dvigne. 📈</p></div>';
  pokaziZaslon(scrIgre);
}

/* ======================= KROG ============================================ */
const KROG = 10;
let tek = null, karta = null;

function zacniKrog(pod, gid){
  tek = { pod, gid, i:0, ok:0, znaki:[], videni:{}, q:null, odgovorjeno:false, zacetna:stopnjaIgre(pod, gid), napake:[] };
  naslednje();
}
function naslednje(){
  if (tek.i >= KROG) return konecKroga();
  const g = IGRE[tek.gid];
  let q = null;
  for (let t = 0; t < 30; t++){
    const c = g.gen(stopnjaIgre(tek.pod, tek.gid), tek.pod);
    q = c;
    if (!tek.videni[c.kljuc]) break;
  }
  tek.videni[q.kljuc] = 1;
  tek.q = q; tek.odgovorjeno = false;
  narisiVprasanje();
}

function pikice(){
  let s = '';
  for (let i = 0; i < KROG; i++){
    const z = tek.znaki[i];
    s += '<span class="dot ' + (z === 1 ? 'ok' : z === 0 ? 'no' : (i === tek.i ? 'now' : '')) + '"></span>';
  }
  return '<div class="dots">' + s + '</div>';
}

function narisiVprasanje(){
  const q = tek.q, g = IGRE[tek.gid];
  let telo = '';
  if (q.tip === 'izbira'){
    telo = (q.slika ? '<div style="text-align:center;margin:0 0 14px">' + q.slika + '</div>' : '') +
      '<div class="opts' + (q.opts.length === 2 ? ' dva' : '') + '" id="opts">' +
      q.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' +
        (o.svg ? o.svg : '') + (o.txt ? '<span>' + esc(o.txt) + '</span>' : '') + '</button>').join('') +
      '</div>';
  } else {
    telo = '<div id="karta"></div>';
  }
  scrIgra.innerHTML =
    '<div class="hud"><button class="btn btn-ghost" id="nazajIgre">⬅️</button>' + pikice() +
      '<span class="spacer"></span><span class="pill">' + IGRE[tek.gid].emo + ' ' +
      esc(IGRE[tek.gid].nm) + '</span></div>' +
    '<div class="card">' +
      '<p class="q">' + esc(q.v) + (q.pod ? '<small>' + esc(q.pod) + '</small>' : '') + '</p>' +
      telo +
      '<div class="odziv" id="odziv"></div>' +
    '</div>';
  pokaziZaslon(scrIgra);

  if (q.tip === 'zemljevid'){
    karta = novZemljevid($('karta'), q.karta, { zive: q.zive || Object.keys(ZEMLJEVIDI[q.karta].d) });
    karta.naTap(id => { if (!tek.odgovorjeno && id) odgovori(id === q.cilj, id); });
  } else if (q.tip === 'tocke'){
    karta = novZemljevid($('karta'), q.karta, q.karta === 'slovenija' ? { poudari:'Slovenia' } : {});
    if (q.karta === 'slovenija'){
      const o = okvirDrzave('slovenija', 'Slovenia');
      if (o) karta.pokazi(o, 1.12);       /* približaj na Slovenijo, šele nato pike – da so prave velikosti */
    }
    karta.tocke(q.tocke, i => { if (!tek.odgovorjeno) odgovori(i === q.a, i); });
  } else {
    karta = null;
  }
}

function odgovori(prav, izbrano){
  if (tek.odgovorjeno) return;
  tek.odgovorjeno = true;
  const q = tek.q;
  tek.znaki[tek.i] = prav ? 1 : 0;
  if (prav) tek.ok++;
  else tek.napake.push(q);
  zabelezi(q.ucim, prav);
  const sprememba = prilagodi(tek.pod, tek.gid, prav);
  if (prav){ STANJE.zvezde++; zvOk(); } else zvNe();
  if (sprememba > 0) zvStopnja();
  shrani();

  if (q.tip === 'izbira'){
    const gumbi = $('opts').querySelectorAll('.opt');
    gumbi.forEach((b, i) => {
      b.disabled = true;
      if (i === q.a) b.classList.add('ok');
      else if (i === izbrano) b.classList.add('no');
    });
  } else if (q.tip === 'zemljevid'){
    karta.oznaci(q.cilj, 'prav');
    if (!prav && izbrano) karta.oznaci(izbrano, 'narobe');
    const o = okvirDrzave(q.karta, q.cilj);
    if (o) karta.pokazi(o, 4);          /* najprej približaj, potem napiši – da je napis prave velikosti */
    karta.napis(q.cilj, PO_ID[q.cilj] ? PO_ID[q.cilj].sl : q.cilj);
  } else if (q.tip === 'tocke'){
    karta.oznaciTocko(q.a, 'prav');
    if (!prav && izbrano !== null && izbrano !== q.a) karta.oznaciTocko(izbrano, 'narobe');
    const c = q.tocke[q.a], m = karta.mesto(c.p[0], c.p[1]);
    karta.napisNa(m[0], m[1] - Math.max(9, ZEMLJEVIDI[q.karta].w / 60), c.n);
  }

  const zn = q.zn ? '<span class="zakaj">' + esc(q.zn) + '</span>' : '';
  $('odziv').innerHTML =
    (prav ? '<span style="color:var(--ok-d)">Točno! 🎉</span>' : '<span style="color:var(--no-d)">Ni čisto tako.</span>') +
    (sprememba > 0 ? ' <b>Nova stopnja!</b> 📈' : sprememba < 0 ? ' <span class="mini">Malo lažje bo.</span>' : '') +
    zn +
    '<div style="margin-top:12px"><button class="btn btn-acc" id="naprej">' +
      (tek.i + 1 >= KROG ? 'Konec kroga ✅' : 'Naprej ➡️') + '</button></div>';
  if (prav && STANJE.zvezde % 10 === 0){ poskoci('⭐'); zvZvezda(); }
  narisiZvezde();
}

function konecKroga(){
  STANJE.krogi++;
  const del = tek.ok / KROG;
  const emo = del === 1 ? '🏆' : del >= 0.8 ? '🎉' : del >= 0.5 ? '👍' : '💪';
  const napake = tek.napake.length
    ? '<h2 class="section">Kar si se naučil</h2><ul class="seznam">' +
      tek.napake.slice(0, 6).map(q => '<li>' + esc(q.v) + ' <b>' +
        esc(q.tip === 'izbira' ? q.opts[q.a].txt || q.ucim : q.ucim) + '</b></li>').join('') + '</ul>'
    : '<p class="mini" style="margin-top:12px">Brez napake – odlično! 🌟</p>';
  const konec = stopnjaIgre(tek.pod, tek.gid);
  shrani();
  scrIgra.innerHTML =
    '<div class="card konec">' +
      '<div class="big">' + emo + '</div>' +
      '<h3>' + tek.ok + ' od ' + KROG + '</h3>' +
      '<p class="mini">' + (konec > tek.zacetna ? 'Stopnja se je dvignila na ' + konec + '. 📈' :
        konec < tek.zacetna ? 'Stopnja je zdaj ' + konec + ' – malo lažje bo. 🙂' :
        'Stopnja ostaja ' + konec + '.') + '</p>' +
      napake +
      '<div class="row" style="justify-content:center;margin-top:16px">' +
        '<button class="btn btn-acc" id="spet">Še en krog 🔁</button>' +
        '<button class="btn btn-ghost" id="nazajIgre2">Druga igra</button>' +
      '</div>' +
    '</div>';
  pokaziZaslon(scrIgra);
}

/* ======================= NASTAVITVE ====================================== */
function odpriNastavitve(){
  const stikalo = (id, nm, opis, vklop) =>
    '<button class="level" data-stikalo="' + id + '" aria-pressed="' + (vklop ? 'true' : 'false') + '" ' +
    'style="grid-column:1/-1;text-align:left">' + nm + '<small>' + opis + '</small></button>';
  $('modalBox').innerHTML =
    '<h3 style="margin:0 0 6px;font-size:22px">Kotiček za starše ⚙️</h3>' +
    '<p class="mini" style="margin-bottom:14px">Napredek se shrani samo na to napravo. Nič se ne pošilja na internet.</p>' +
    '<h2 class="section" style="margin-top:0">Težavnost</h2>' +
    '<div class="levels">' +
      [['auto','Samodejno','naloge se prilagajajo otroku'],
       ['lahko','Lahko','najlažje naloge'],
       ['srednje','Srednje','malo težje'],
       ['tezko','Težko','vse najtežje naloge']].map(([id, nm, op]) =>
        '<button class="level" data-nacin="' + id + '" aria-pressed="' + (STANJE.nacin === id) + '">' +
        nm + '<small>' + op + '</small></button>').join('') +
    '</div>' +
    '<h2 class="section">Drugo</h2>' +
    '<div class="levels">' + stikalo('zvok', 'Zvok', 'piski ob pravilnem in napačnem odgovoru', STANJE.zvok) + '</div>' +
    '<div class="row" style="margin-top:16px;justify-content:space-between">' +
      '<button class="btn btn-ghost" id="pobrisi">Ponastavi napredek</button>' +
      '<button class="btn btn-acc" id="zapri">Zapri</button>' +
    '</div>';
  $('modal').hidden = false;
}

/* ======================= DOGODKI ========================================= */
let trenutnoPodrocje = null;
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pod]');
  if (p){ trenutnoPodrocje = PODROCJA.find(x => x.id === p.dataset.pod); narisiIgre(trenutnoPodrocje); return; }
  const g = e.target.closest('[data-igra]');
  if (g){ zacniKrog(trenutnoPodrocje, g.dataset.igra); return; }
  if (e.target.closest('#nazajDomov')){ narisiPodrocja(); return; }
  if (e.target.closest('#nazajIgre') || e.target.closest('#nazajIgre2')){ narisiIgre(trenutnoPodrocje); return; }
  if (e.target.closest('#spet')){ zacniKrog(tek.pod, tek.gid); return; }
  if (e.target.closest('#naprej')){ tek.i++; naslednje(); return; }
  const o = e.target.closest('#opts .opt');
  if (o && !tek.odgovorjeno){ odgovori(+o.dataset.i === tek.q.a, +o.dataset.i); return; }
  if (e.target.closest('#gumbNast')){ odpriNastavitve(); return; }
  const n = e.target.closest('[data-nacin]');
  if (n){ STANJE.nacin = n.dataset.nacin; shrani(); odpriNastavitve(); return; }
  const s = e.target.closest('[data-stikalo]');
  if (s){ STANJE[s.dataset.stikalo] = !STANJE[s.dataset.stikalo]; shrani(); odpriNastavitve(); return; }
  if (e.target.closest('#pobrisi')){
    if (confirm('Res izbrišem ves napredek in zvezdice?')){
      STANJE = Object.assign({}, SVEZE, { st:{}, gor:{}, dol:{}, slabo:{} });
      shrani(); narisiZvezde(); $('modal').hidden = true; narisiPodrocja();
    }
    return;
  }
  if (e.target.closest('#zapri') || e.target === $('modal')){ $('modal').hidden = true; return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!$('modal').hidden) $('modal').hidden = true; }
});

narisiZvezde();
narisiPodrocja();

</script>

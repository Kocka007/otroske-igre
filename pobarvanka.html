<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barvica – pobarvanka</title>
<meta name="description" content="Interaktivna pobarvanka z več načini barvanja, stopnjami zahtevnosti in temami – od otroških do zahtevnejših vzorcev.">
<!-- pisava se naloži ob strani: če je omrežje počasno ali ga ni, se stran izriše
     takoj s sistemsko pisavo in ne čaka -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      media="print" onload="this.media='all'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2f2a26; --ink-soft:#7a6f66;
  --card:#ffffff; --line:#ece5dd;
  --acc:#ff7a45; --acc-d:#e05a26;
  --ok:#1eb872; --ok-d:#159a5e;
  --pop:#12a5a5;
  --ozadje:#fbf7f2;
  --madez1:#ffe9dc; --madez2:#e2f6f4; --madez3:#fdf0c8;
  --oblacek:#fff6ee; --oblacek-rob:#ffe0cc; --oblacek-ink:#8a5030;
  --r:20px;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
/* Temni način: platno s sliko OSTANE belo, saj se pobarvanka barva na belem
   papirju; temni so le okvir, kartice in orodja.                            */
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f4ece4; --ink-soft:#bdaea1;
    --card:#2b2521; --line:#413830;
    --acc:#ff8f5e; --acc-d:#b8481c;
    --ok:#31cf8a; --ok-d:#178a58;
    --pop:#37c9c9;
    --ozadje:#1c1815;
    --madez1:#3a2a20; --madez2:#1e3330; --madez3:#3a3320;
    --oblacek:#382c24; --oblacek-rob:#5a4334; --oblacek-ink:#ffd0ab;
  }
}
html,body{height:100%;margin:0}
body{
  font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--ozadje);
  background-image:
    radial-gradient(900px 600px at 0% -10%, var(--madez1) 0%, transparent 60%),
    radial-gradient(700px 520px at 100% 0%, var(--madez2) 0%, transparent 55%),
    radial-gradient(560px 460px at 20% 100%, var(--madez3) 0%, transparent 60%);
  background-attachment:fixed;
  overscroll-behavior:none;
}
/* barvni madeži v ozadju – rahli, da ne motijo branja */
#madezi{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5}
#madezi svg{width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

.wrap{
  max-width:900px;margin:0 auto;
  padding:calc(14px + var(--top)) calc(14px + env(safe-area-inset-right,0px))
          calc(24px + var(--bot)) calc(14px + env(safe-area-inset-left,0px));
}

/* ---------- glava ---------- */
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900}
.brand .em{font-size:30px}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);
  display:grid;place-items:center;font-size:20px;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.icon-btn[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;
  border-radius:15px;padding:11px 16px;font-weight:900;font-size:16px;line-height:1;
  box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}
.btn-acc:active{box-shadow:0 1px 0 var(--acc-d)}
.btn[disabled]{opacity:.42;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 8px 22px rgba(47,42,38,.09)}
.lead{margin:0 0 12px;font-weight:700;color:var(--ink-soft);font-size:15.5px;line-height:1.5}
h2.sec{font-size:16px;margin:18px 4px 9px;font-weight:900;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase}

/* ---------- izbirniki ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border-radius:999px;padding:9px 15px;font-weight:900;font-size:15px;
  box-shadow:0 4px 0 var(--line);white-space:nowrap}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #17130f}
.chip .k{opacity:.65;font-weight:800;font-size:13px;margin-left:3px}

.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lvl{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-weight:900;font-size:13.5px;
  box-shadow:0 4px 0 var(--line);line-height:1.25}
.lvl b{display:block;font-size:19px}
.lvl[aria-pressed="true"]{background:var(--pop);color:#fff;box-shadow:0 4px 0 #0c8080}
.lvl:active{transform:translateY(3px)}

/* ---------- mreža slik ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.pic{background:#fff;border-radius:18px;padding:10px 10px 12px;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.pic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.pic svg{width:100%;height:auto;display:block;border-radius:12px;background:#fff}
.pic .nm{font-weight:900;font-size:15px;text-align:center}
.pic .meta{font-weight:800;font-size:12px;color:var(--ink-soft);text-align:center}
.pic .done{position:absolute;top:8px;right:9px;font-size:17px}

/* ---------- barvanje ---------- */
.stage{background:var(--card);border-radius:var(--r);padding:10px;box-shadow:0 8px 22px rgba(47,42,38,.10);
  display:flex;justify-content:center;align-items:center}
/* platno s potezami leži NAD črtno risbo in se z njo množi – tako ostanejo
   črte vidne skozi barvo, tako kot voščenka na natisnjeni pobarvanki */
.platno{position:relative;isolation:isolate;width:100%;line-height:0;background:#fff;border-radius:14px}
#risba{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:multiply}
.platno.risem #risba{pointer-events:auto;touch-action:none}
.platno.risem svg{pointer-events:none}
.stage svg{width:100%;height:auto;max-height:min(64vh,620px);display:block;touch-action:manipulation}
/* barvo in obrobo zapiše sama slika (atributa fill/stroke); tu jih namenoma
   ne nastavljamo, ker bi lastnost CSS premagala atribut in bi polja ostala bela */
.obm{cursor:pointer;transition:fill .12s ease}
.obm.plain{transition:none}
.ln{pointer-events:none}
.num{font-size:11px;font-weight:900;fill:#8a8078;text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none}
.obm.zmota{animation:zm .34s}
@keyframes zm{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- orodja ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.modes{display:flex;gap:7px;flex-wrap:wrap}
.mode{background:#fff;border-radius:14px;padding:9px 13px;font-weight:900;font-size:14.5px;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;gap:6px}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}

.pal{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;justify-content:center}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 0 0 3px #fff;
  position:relative}
.sw:active{transform:translateY(2px)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink), inset 0 0 0 3px #fff}
.sw .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.sw.guma{background:#fff;box-shadow:0 3px 0 var(--line), inset 0 0 0 3px #fff;font-size:20px;
  display:grid;place-items:center}
.sw.guma[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink), inset 0 0 0 3px #fff}

.palrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.palpick{background:#fff;border-radius:999px;padding:7px 13px;font-weight:900;font-size:13.5px;
  box-shadow:0 3px 0 var(--line)}
.palpick[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #17130f}

.hint{margin-top:10px;background:#fff6ee;border-radius:15px;padding:11px 14px;font-weight:800;
  font-size:14.5px;line-height:1.5;box-shadow:inset 0 0 0 3px #ffe0cc;color:#8a5030}

/* ---------- izbirnik barv ---------- */
#lestvica,#sivine{width:100%;display:block;border-radius:14px;box-shadow:inset 0 0 0 3px var(--line);
  touch-action:none;cursor:crosshair}
#sivine{margin-top:8px}
.rgb{display:grid;grid-template-columns:22px 1fr 52px;gap:10px;align-items:center;margin-top:10px}
.rgb label{font-weight:900;font-size:15px}
.rgb input[type=range]{width:100%;height:26px;-webkit-appearance:none;background:transparent}
.rgb input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:var(--tr)}
.rgb input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-top:-7px}
.rgb input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:var(--tr)}
.rgb input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rgb output{font-weight:900;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.pregled{display:flex;align-items:center;gap:12px;margin-top:12px}
.pregled .kvad{width:64px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.pregled .hex{font-weight:900;font-size:19px;letter-spacing:.5px}

/* ---------- galerija ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal .pic{box-shadow:0 5px 0 var(--line)}
.gal .del{position:absolute;top:6px;left:7px;font-size:15px;background:rgba(255,255,255,.9);
  border-radius:999px;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* ---------- modalno ---------- */
.mask{position:fixed;inset:0;background:rgba(40,32,26,.6);display:grid;place-items:center;padding:16px;z-index:50}
.mask[hidden]{display:none}
.modal{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;max-width:520px;width:100%;max-height:86dvh;
  overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.modal h3{margin:0 0 10px;font-size:22px}
.modal p{margin:0 0 14px;font-weight:700;color:var(--ink-soft);line-height:1.5}
.modal img{max-width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:76px;pointer-events:none;
  animation:pp .9s ease-out forwards;z-index:60}
@keyframes pp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-95%) scale(1);opacity:0}}
/* ---------- maskota Barvica ---------- */
.maskota{width:56px;height:56px;flex:none;display:block;animation:ziba 4.6s ease-in-out infinite}
.maskota.velika{width:74px;height:74px}
@keyframes ziba{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
.maskota .veka{transform-origin:center;animation:mezik 5.2s infinite}
@keyframes mezik{0%,94%,100%{transform:scaleY(0)}96%,98%{transform:scaleY(1)}}
.pozdrav{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.oblacek{background:var(--oblacek);border-radius:16px 16px 16px 4px;padding:10px 14px;
  font-weight:800;font-size:15px;line-height:1.4;box-shadow:inset 0 0 0 3px var(--oblacek-rob);
  color:var(--oblacek-ink);flex:1}

/* ---------- kartice tem ---------- */
.chip{background:linear-gradient(160deg,var(--tem1,#fff),var(--tem2,#fff));color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);box-shadow:0 4px 0 var(--acc-d)}
.chip .em{font-size:17px;margin-right:2px}

/* ---------- napredek na sličici ---------- */
.pic .obroc{position:absolute;top:7px;right:8px;width:30px;height:30px}
.pic .obroc text{font:900 11px "Nunito",sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.pic.koncana{box-shadow:0 6px 0 var(--ok-d)}
.pic .done{position:absolute;top:6px;right:7px;font-size:19px}

/* ---------- prehodi med zasloni ---------- */
@keyframes vstop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
section:not([hidden]){animation:vstop .18s ease-out}
.grid>.pic{animation:vstop .22s ease-out backwards}

/* ---------- slavje ---------- */
#konfeti{position:fixed;inset:0;pointer-events:none;z-index:70}
#konfeti[hidden]{display:none}

/* Temni način naj premaga svetle privzetke, zato stoji na koncu sloga.
   Platno s sliko in sličice OSTANEJO bele – pobarvanka se barva na papirju. */
@media (prefers-color-scheme: dark){
  #madezi{opacity:.28}
  .icon-btn,.btn,.lvl,.mode,.palpick,.pic,.sw.guma{background:var(--card)}
  .btn-acc{background:var(--acc);color:#241f1b}
  .icon-btn[aria-pressed="true"],.mode[aria-pressed="true"]{background:var(--acc);color:#241f1b}
  .lvl[aria-pressed="true"]{background:var(--pop);color:#1c1815}
  .palpick[aria-pressed="true"]{background:var(--acc);color:#241f1b}
  .pic svg,.platno{background:#fff}
  .num{fill:#6b625a}
  .hint{background:var(--oblacek);box-shadow:inset 0 0 0 3px var(--oblacek-rob);color:var(--oblacek-ink)}
  /* ploščice tem ostanejo pastelne, da so emojiji in besedilo berljivi */
  .chip{color:#241f1b;box-shadow:0 4px 0 #0f0c0a}
  .chip[aria-pressed="true"]{background:var(--acc);color:#241f1b;box-shadow:0 4px 0 var(--acc-d)}
  #lestvica,#sivine{box-shadow:inset 0 0 0 3px var(--line)}
  .sw{box-shadow:0 3px 0 rgba(0,0,0,.5), inset 0 0 0 3px #2b2521}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--acc), inset 0 0 0 3px #2b2521}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){
  .brand{font-size:20px}.sw{width:40px;height:40px}
  .levels{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="madezi" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <span id="glavaMaskota"></span>
    <div class="brand"><span>Barvica</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="galBtn" title="Moje slike" aria-label="Moje slike">🖼️</button>
    <button class="icon-btn" id="soundBtn" title="Zvok" aria-label="Zvok">🔊</button>
  </div>

  <section id="scrIzbira">
    <div class="card">
      <p class="lead">Izberi sliko in jo pobarvaj. Nič ni narobe – barve lahko kadar koli zamenjaš.</p>
    </div>
  </section>

  <section id="scrBarvanje" hidden></section>
</div>

<div class="mask" id="mask" hidden><div class="modal" id="modal"></div></div>
<canvas id="konfeti" hidden></canvas>

<script>
/* =========================================================================
   BARVICA – pobarvanka za otroke in odrasle
   Slike se sestavljajo iz oblik v kodi, zato jih je mogoče risati v več
   stopnjah podrobnosti: ista slika ima lahko 8 ali 80 polj za barvanje.
   ========================================================================= */

/* ===================== ČISTA LOGIKA – ZAČETEK =========================== */

/* ---------------------- naključje z zrnom -------------------------------
   Ista slika mora vsakič izgledati enako, zato ne uporabljamo Math.random. */
function zrno(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function nak(seed){
  let a = seed >>> 0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------------- oblike ------------------------------------------ */
const f1 = n => Math.round(n * 10) / 10;
function polyD(P, closed){
  let d = 'M' + f1(P[0][0]) + ' ' + f1(P[0][1]);
  for (let i=1;i<P.length;i++) d += 'L' + f1(P[i][0]) + ' ' + f1(P[i][1]);
  return d + (closed === false ? '' : 'Z');
}
/* gladka krivulja skozi točke (Catmull-Rom → Bézier) */
function smoothD(P, closed, nap){
  nap = nap == null ? 1 : nap;
  const n = P.length;
  if (n < 3) return polyD(P, closed);
  const tc = i => closed ? P[(i % n + n) % n] : P[Math.max(0, Math.min(n-1, i))];
  let d = 'M' + f1(P[0][0]) + ' ' + f1(P[0][1]);
  const zad = closed ? n : n - 1;
  for (let i=0;i<zad;i++){
    const p0 = tc(i-1), p1 = tc(i), p2 = tc(i+1), p3 = tc(i+2);
    const c1x = p1[0] + (p2[0]-p0[0])/6*nap, c1y = p1[1] + (p2[1]-p0[1])/6*nap;
    const c2x = p2[0] - (p3[0]-p1[0])/6*nap, c2y = p2[1] - (p3[1]-p1[1])/6*nap;
    d += 'C' + f1(c1x) + ' ' + f1(c1y) + ',' + f1(c2x) + ' ' + f1(c2y) + ',' + f1(p2[0]) + ' ' + f1(p2[1]);
  }
  return d + (closed ? 'Z' : '');
}
function svetleje(hex, k){
  const n = parseInt(hex.slice(1), 16), o = v => Math.max(0, Math.min(255, v + k));
  const r = o((n >> 16) & 255), g = o((n >> 8) & 255), b = o(n & 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const el = (cx,cy,rx,ry,rot) => ({ t:'e', cx, cy, rx, ry, rot: rot||0 });
const ci = (cx,cy,r) => el(cx,cy,r,r,0);
const re = (x,y,w,h,r) => ({ t:'r', x, y, w, h, r: r||0 });
const po = P => ({ t:'p', d: polyD(P) });
const bl = (P,nap) => ({ t:'p', d: smoothD(P, true, nap) });
const cr = (P,nap) => ({ t:'p', d: smoothD(P, false, nap) });   /* odprta črta */
const pa = d => ({ t:'p', d });

/* trak vzdolž krivulje – repi, stebla, roke, kite */
function trak(spine, w0, w1, nap){
  const n = spine.length, L = [], D = [];
  for (let i=0;i<n;i++){
    const p = spine[i];
    const a = spine[Math.max(0,i-1)], b = spine[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const dl = Math.hypot(dx,dy) || 1; dx/=dl; dy/=dl;
    const w = (w0 + (w1-w0) * (i/(n-1))) / 2;
    L.push([p[0] - dy*w, p[1] + dx*w]);
    D.push([p[0] + dy*w, p[1] - dx*w]);
  }
  const P = L.concat(D.reverse());
  return { t:'p', d: smoothD(P, true, nap == null ? .7 : nap) };
}

/* zrcaljenje in vrtenje točk */
const zrcali = (P, os) => P.map(p => [2*os - p[0], p[1]]);
function vrti(P, cx, cy, kot){
  const c = Math.cos(kot), s = Math.sin(kot);
  return P.map(function(p){
    const x = p[0]-cx, y = p[1]-cy;
    return [cx + x*c - y*s, cy + x*s + y*c];
  });
}
function zvezda(cx, cy, r, kraki, notr){
  const P = [];
  for (let i=0;i<kraki*2;i++){
    const a = -Math.PI/2 + i * Math.PI / kraki;
    const rr = i % 2 ? r*notr : r;
    P.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]);
  }
  return po(P);
}

/* ---------------------- gradniki slike -----------------------------------
   obm(): polje, ki ga otrok pobarva. c = barva, kot si jo je zamislil risar
   (uporabi se pri barvanju po številkah in pri gumbu »pokaži predlog«).
   sym: polja z isto oznako se pri simetričnem načinu pobarvajo skupaj.
   rez: polje se obreže na dano obliko (npr. proge znotraj telesa).         */
function obm(s, c, o){ o = o || {}; return { s:s, c:c, sym:o.sym, rez:o.rez, lp:o.lp, deb:o.deb, oz:o.oz }; }
/* ozd(): polje, ki je del prizorišča (nebo, voda, tla). Označeno je z oz,
   zato vanj ne vrinjamo okrasja.                                           */
function ozd(s, c, o){ o = o || {}; o.oz = true; return obm(s, c, o); }
function crt(s, w){ return { s:s, w: w || 2.2 }; }

/* ---------------------- izris slike v SVG -------------------------------- */
function elemIz(s, atts){
  if (s.t === 'e'){
    const r = s.rot ? ' transform="rotate(' + f1(s.rot*180/Math.PI) + ' ' + f1(s.cx) + ' ' + f1(s.cy) + ')"' : '';
    return '<ellipse cx="' + f1(s.cx) + '" cy="' + f1(s.cy) + '" rx="' + f1(s.rx) + '" ry="' + f1(s.ry) + '"' + r + ' ' + atts + '/>';
  }
  if (s.t === 'r')
    return '<rect x="' + f1(s.x) + '" y="' + f1(s.y) + '" width="' + f1(s.w) + '" height="' + f1(s.h) +
           '" rx="' + f1(s.r) + '" ' + atts + '/>';
  return '<path d="' + s.d + '" ' + atts + '/>';
}
/* barve: polje barv po indeksu območja; stevilke: izpiši številke (barvanje po številkah) */
function svgIz(sl, o){
  o = o || {};
  const barve = o.barve || [], deb = o.deb || 2.2;
  let defs = '', telo = '';
  sl.R.forEach(function(ob, i){
    /* obroba je zapisana v sami sliki, ne le v CSS: tako je vidna tudi v
       sličicah in pri izvozu v PNG, kjer slogov strani ni. */
    let polnilo = barve[i] || '#fff';
    if (polnilo.indexOf('preliv:') === 0){
      const hex = polnilo.slice(7), gid = 'pr' + i + (o.pre || '');
      defs += '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + svetleje(hex, 70) + '"/>' +
        '<stop offset="1" stop-color="' + hex + '"/></linearGradient>';
      polnilo = 'url(#' + gid + ')';
    }
    /* Debelina obrobe je odvisna od velikosti polja: velika telesa dobijo
       krepko obrobo, drobne podrobnosti tanko – tako kot v tiskanih
       pobarvankah. Slika lahko debelino tudi sama predpiše (deb v obm()).  */
    const bb = pribBBox(ob.s);
    const povr = Math.abs(bb[2] * bb[3]) * (ob.s.t === 'e' ? 0.79 : 1);
    const rel = Math.sqrt(povr) / Math.sqrt(sl.w * sl.h || 1);
    const faktor = ob.deb != null ? ob.deb
      : (rel > 0.52 ? 2.0 : rel > 0.30 ? 1.7 : rel > 0.16 ? 1.35 : rel > 0.06 ? 1.05 : 0.85);
    let atts = 'class="obm' + (o.plain ? ' plain' : '') + '" data-i="' + i + '" fill="' + polnilo +
      '" stroke="#241f1b" stroke-width="' + f1(deb * faktor) + '" stroke-linejoin="round"';
    if (ob.rez){
      const id = 'rez' + i + (o.pre || '');
      defs += '<clipPath id="' + id + '">' + elemIz(ob.rez, '') + '</clipPath>';
      atts += ' clip-path="url(#' + id + ')"';
    }
    telo += elemIz(ob.s, atts);
  });
  let crte = '';
  (sl.L || []).forEach(function(c){
    crte += elemIz(c.s, 'class="ln" fill="none" stroke="#241f1b" stroke-width="' + (c.w || deb) +
      '" stroke-linecap="round" stroke-linejoin="round"');
  });
  /* Vse skupaj obrežemo na velikost slike: če kak del (rep, žarek, veja)
     sega čez rob, se ne razlije po beli strani okoli risbe.               */
  const rob = 'rob' + (o.pre || '');
  defs += '<clipPath id="' + rob + '"><rect x="0" y="0" width="' + sl.w + '" height="' + sl.h + '"/></clipPath>';
  return '<svg viewBox="0 0 ' + sl.w + ' ' + sl.h + '" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' + defs + '</defs><g clip-path="url(#' + rob + ')">' +
    telo + crte + (o.dodatek || '') + '</g></svg>';
}


/* ---------------- obraz in prizor: skupni gradniki risb ------------------
   Prave pobarvanke imajo velik obraz z izrazitimi očmi in prizor okoli
   junaka. Te funkcije vrnejo polje (ali seznam polj), ki ga slika doda
   med svoja polja: R.push.apply(R, oko(...)).                             */
function oko(x, y, r, o){
  o = o || {};
  const g = o.gled || [0, 0], gx = g[0]*r*0.22, gy = g[1]*r*0.22, s = o.sym, P = [];
  P.push(obm(el(x, y, r, r*(o.oval || 1.08), 0), '#ffffff', { sym:s }));
  P.push(obm(ci(x+gx, y+gy, r*0.58), o.barva || '#4f7fd4', { sym:s && s+'i' }));
  P.push(obm(ci(x+gx, y+gy, r*0.33), '#241f1b', { sym:s && s+'z' }));
  P.push(obm(ci(x+gx-r*0.24, y+gy-r*0.28, r*0.17), '#ffffff', { sym:s && s+'b' }));
  return P;
}
function usta(x, y, w, h, o){
  o = o || {};
  const P = [], s = o.sym;
  P.push(obm(bl([[x-w/2,y],[x-w*0.3,y+h],[x+w*0.3,y+h],[x+w/2,y]], .9), o.barva || '#8a3346', { sym:s }));
  if (o.jezik !== false)
    P.push(obm(bl([[x-w*0.24,y+h*0.38],[x,y+h*0.95],[x+w*0.24,y+h*0.38]], .95), '#ff8fa3', { sym:s && s+'j' }));
  return P;
}
function licko(x, y, r, sym){ return obm(ci(x, y, r), '#ffb3c1', { sym:sym }); }
function sonce(x, y, r, n){
  const P = [];
  for (let i=0;i<n;i++){
    const a = i*2*Math.PI/n;
    P.push(obm(listek(x, y, r*0.96, r*1.8, a-0.16, a+0.16, .9), '#f9c74f', { sym:'zarek' }));
  }
  P.push(obm(ci(x, y, r), '#ffd166'));
  return P;
}
function oblak(x, y, s, sym){
  return obm(bl([[x-46*s,y+11*s],[x-42*s,y-9*s],[x-18*s,y-23*s],[x+8*s,y-29*s],[x+35*s,y-13*s],
                 [x+47*s,y+5*s],[x+28*s,y+17*s],[x-22*s,y+18*s]], .95), '#ffffff', { sym:sym });
}
function drevo(x, y, s, sym){                    /* y je črta tal */
  const P = [];
  P.push(obm(re(x-10*s, y-64*s, 20*s, 66*s, 5*s), '#a3703f', { sym:sym }));
  P.push(obm(ci(x-26*s, y-70*s, 27*s), '#3f9d80', { sym:sym && sym+'l' }));
  P.push(obm(ci(x+26*s, y-70*s, 27*s), '#4fb89a', { sym:sym && sym+'d' }));
  P.push(obm(ci(x, y-92*s, 36*s), '#43aa8b', { sym:sym && sym+'k' }));
  return P;
}
function cvetek(x, y, s, barva, sym){
  const P = [];
  for (let i=0;i<5;i++){
    const a = i*2*Math.PI/5 - Math.PI/2;
    P.push(obm(ci(x+Math.cos(a)*8.5*s, y+Math.sin(a)*8.5*s, 6.5*s), barva || '#ff70a6', { sym:sym }));
  }
  P.push(obm(ci(x, y, 5*s), '#ffd166', { sym:sym && sym+'s' }));
  return P;
}
function grm(x, y, s, barva, sym){
  return obm(bl([[x-34*s,y],[x-30*s,y-18*s],[x-12*s,y-28*s],[x+10*s,y-30*s],[x+30*s,y-16*s],[x+34*s,y]], .95),
    barva || '#4fb89a', { sym:sym });
}
function hrib(x, y, w, h, barva, sym){
  return obm(bl([[x-w/2,y],[x-w*0.26,y-h],[x+w*0.06,y-h*0.86],[x+w/2,y]], .82), barva, { sym:sym });
}
function ptickaVDaljavi(x, y, s, sym){
  return obm(bl([[x-14*s,y],[x-7*s,y-8*s],[x,y-1*s],[x+7*s,y-8*s],[x+14*s,y],[x,y+5*s]], .9),
    '#ffffff', { sym:sym });
}


/* ---------------- kosmata žival: skupno ogrodje --------------------------
   Vse ljubke živali (mucka, kuža, medved, zajec, lisica, panda …) so
   sestavljene po istem kopitu: veliko glavo z izrazitimi očmi, telo pod
   njo in tace. Razlikujejo se ušesa, smrček, rep in barve. Ogrodje riše na
   platno 340×400, glava je pri (170,150).                                  */
function zivalcek(o){
  const R = [], L = [];
  const t = o.barva, sv = o.svetlo, lv = o.lv || 1;
  const telo = bl([[170,196],[242,240],[256,320],[236,364],[170,376],[104,364],[84,320],[98,240]], .95);
  const glava = el(170,150,96,86,0);
  /* rep pride pod telo */
  if (o.rep === 'macji') R.push(obm(trak([[266,356],[308,332],[320,286],[300,246],[274,240]], 32, 17, .8), t));
  if (o.rep === 'puhast') R.push(obm(bl([[262,340],[310,326],[330,286],[312,246],[276,242],[254,286]], .95), sv));
  if (o.rep === 'kratek') R.push(obm(ci(268,330,30), sv));
  R.push(obm(telo, t));
  const trebuh = bl([[170,250],[214,292],[214,346],[170,364],[126,346],[126,292]], .95);
  R.push(obm(trebuh, sv));
  R.push(obm(el(124,362,32,21,-0.12), sv, {sym:'t'}));
  R.push(obm(el(216,362,32,21,0.12), sv, {sym:'t'}));
  if (lv >= 2) for (let i=0;i<3;i++){
    const dx = (i-1)*13, dy = 358 - (i === 1 ? 4 : 0);
    R.push(obm(ci(124+dx, dy, 6), '#e0c3a0', {sym:'pr'+i}));
    R.push(obm(ci(216+dx, dy, 6), '#e0c3a0', {sym:'pr'+i}));
  }
  /* ušesa – pod glavo, da se dno skrije */
  if (o.usesa === 'trikotna'){
    R.push(obm(po([[80,126],[96,18],[178,86]]), t, {sym:'u'}));
    R.push(obm(po([[260,126],[244,18],[162,86]]), t, {sym:'u'}));
    R.push(obm(po([[96,116],[106,48],[152,92]]), '#ffb3c1', {sym:'nu'}));
    R.push(obm(po([[244,116],[234,48],[188,92]]), '#ffb3c1', {sym:'nu'}));
  } else if (o.usesa === 'okrogla'){
    R.push(obm(ci(90,74,42), t, {sym:'u'}));
    R.push(obm(ci(250,74,42), t, {sym:'u'}));
    R.push(obm(ci(90,74,24), o.notrUho || '#ffb3c1', {sym:'nu'}));
    R.push(obm(ci(250,74,24), o.notrUho || '#ffb3c1', {sym:'nu'}));
  } else if (o.usesa === 'dolga'){
    R.push(obm(el(122,50,26,74,0.13), t, {sym:'u'}));
    R.push(obm(el(218,50,26,74,-0.13), t, {sym:'u'}));
    R.push(obm(el(122,52,14,58,0.13), '#ffb3c1', {sym:'nu'}));
    R.push(obm(el(218,52,14,58,-0.13), '#ffb3c1', {sym:'nu'}));
  } else if (o.usesa === 'viseca'){
    R.push(obm(bl([[96,96],[62,132],[58,196],[86,222],[112,196],[110,124]], .95), o.temno || sv, {sym:'u'}));
    R.push(obm(bl([[244,96],[278,132],[282,196],[254,222],[228,196],[230,124]], .95), o.temno || sv, {sym:'u'}));
  }
  R.push(obm(glava, t));
  /* obrazna krpa (npr. pri lisici ali pandi) */
  if (o.krpa) R.push(obm(el(170,178,74,56,0), sv, {sym:'krpa'}));
  /* smrček */
  const my = o.smrckaY || 188;
  if (o.smrcek === 'dvojni'){
    R.push(obm(el(148,my,32,26,0), sv, {sym:'gb'}));
    R.push(obm(el(192,my,32,26,0), sv, {sym:'gb'}));
  } else {
    R.push(obm(el(170,my+2,50,36,0), sv));
  }
  const ny = my - 22;
  if (o.nos === 'trikotni') R.push(obm(bl([[170,ny-9],[188,ny+1],[170,ny+14],[152,ny+1]], .95), '#e05c7e'));
  else R.push(obm(el(170,ny+2,20,15,0), '#3f3630'));
  R.push.apply(R, usta(170, my+12, 32, 19, {}));
  R.push.apply(R, oko(136,138,26,{barva:o.ocibarva || '#5b8def', sym:'o', gled:[0.15,0.12]}));
  R.push.apply(R, oko(204,138,26,{barva:o.ocibarva || '#5b8def', sym:'o', gled:[0.15,0.12]}));
  if (o.obrvi){
    L.push(crt(pa('M116 104Q136 92 158 100'), 4));
    L.push(crt(pa('M224 104Q204 92 182 100'), 4));
  }
  R.push(licko(96,182,16,'l')); R.push(licko(244,182,16,'l'));
  /* najvišja stopnja: pege na čelu in proge na trebuhu, obrezane na svoje polje,
     da ne visijo v zraku ob živali */
  if (lv >= 5){
    for (let i=0;i<3;i++)
      R.push(obm(ci(120 + i*50, 94, 13), sv, {rez:glava, sym:'pega'+i}));
    for (let i=0;i<3;i++)
      R.push(obm(el(170, 274 + i*28, 46 - i*10, 12, 0), t, {rez:trebuh, sym:'proga'+i}));
  }
  if (o.brki) for (let i=0;i<3;i++){
    L.push(crt(pa('M110 '+(178+i*13)+'Q72 '+(172+i*17)+' 44 '+(166+i*22)), 3));
    L.push(crt(pa('M230 '+(178+i*13)+'Q268 '+(172+i*17)+' 296 '+(166+i*22)), 3));
  }
  return { R:R, L:L, telo:telo, glava:glava };
}


/* Človeški obraz – uporabljajo ga princesa, vila, junak, vitez … */
function obrazCloveka(cx, cy, r, o){
  o = o || {};
  const P = [];
  P.push(obm(el(cx, cy, r*0.86, r, 0), o.koza || '#f6d3ae'));
  P.push.apply(P, oko(cx - r*0.34, cy - r*0.08, r*0.24, { barva:o.oci || '#4f7fd4', sym:'o', gled:o.gled }));
  P.push.apply(P, oko(cx + r*0.34, cy - r*0.08, r*0.24, { barva:o.oci || '#4f7fd4', sym:'o', gled:o.gled }));
  P.push.apply(P, usta(cx, cy + r*0.36, r*0.42, r*0.26, {}));
  P.push(licko(cx - r*0.6, cy + r*0.24, r*0.17, 'l'));
  P.push(licko(cx + r*0.6, cy + r*0.24, r*0.17, 'l'));
  return P;
}

function bor(x, y, s, sym){                       /* iglasto drevo, y = tla */
  const P = [];
  P.push(obm(re(x-6*s, y-22*s, 12*s, 24*s, 3*s), '#8a5a2b', { sym:sym }));
  P.push(obm(po([[x-34*s,y-18*s],[x+34*s,y-18*s],[x,y-62*s]]), '#2f7d5b', { sym:sym && sym+'a' }));
  P.push(obm(po([[x-28*s,y-44*s],[x+28*s,y-44*s],[x,y-82*s]]), '#3f9d70', { sym:sym && sym+'b' }));
  P.push(obm(po([[x-20*s,y-68*s],[x+20*s,y-68*s],[x,y-100*s]]), '#4fb890', { sym:sym && sym+'c' }));
  return P;
}

/* ---------------- ozadje prizora ----------------------------------------
   Prej je vsak prizor dobil isto sonce zgoraj levo in isti oblak zgoraj
   desno. ozadje() vrne polja za eno od več različic neba, da se prizori med
   seboj razlikujejo. Seme poskrbi, da je ista slika vedno enaka.
   tip: jasno | oblacno | zvezdnato | mavrica | zahod | sneg | dez | jutro
   o: { tla:'#…' ali false, visinaTal:št, gostota:0–1,
        samo:true = vrni samo predmete na nebu (sonce, oblake, zvezde …),
        brez neba in tal – za prizore, ki nebo in tla rišejo sami }         */
function ozadje(tip, w, h, seme, o){
  o = o || {};
  const R = [], r = nak(zrno('ozadje:' + tip + ':' + (seme || '')));
  const vt = o.visinaTal == null ? Math.round(h * 0.14) : o.visinaTal;
  const talna = h - vt;
  const nebo = function(c){ if (!o.samo) R.push(ozd(re(0, 0, w, o.tla === false ? h : talna + 14, 0), c)); };
  const pas = function(x, y, sir, vis, c){ if (!o.samo) R.push(ozd(re(x, y, sir, vis, 0), c)); };
  const zvezde = function(n, barva){
    for (let i = 0; i < n; i++)
      R.push(ozd(zvezda(10 + r()*(w-20), 8 + r()*(talna*0.6), 5 + r()*4, 4, .42), barva || '#ffe066'));
  };
  if (tip === 'zvezdnato'){
    nebo('#1b2a49');
    R.push(ozd(ci(w - 56, 52, 28), '#fff3b0'));
    if (!o.samo) R.push(ozd(ci(w - 44, 44, 24), '#1b2a49'));       /* mesečeva mena */
    zvezde(Math.round(6 + 10 * (o.gostota == null ? 1 : o.gostota)));
  } else if (tip === 'zahod'){
    nebo('#ffd9b0');
    pas(0, 0, w, Math.round(talna*0.34), '#f79f79');
    pas(0, Math.round(talna*0.34), w, Math.round(talna*0.26), '#f7c59f');
    R.push(ozd(ci(w*0.72, talna*0.62, 34), '#ff8c42'));
    if (o.samo){
      R.push(ozd(oblak(w*0.24, talna*0.34, 0.7).s, '#f7c59f'));
      R.push(ozd(oblak(w*0.5, talna*0.16, 0.55).s, '#f9d7bd'));
    } else for (let i = 0; i < 3; i++)
      R.push(ozd(bl([[w*0.1+i*10, talna*0.5+i*22],[w*0.42, talna*0.44+i*22],
                     [w*0.74, talna*0.52+i*22],[w*0.42, talna*0.58+i*22]], .9), '#e07a5f'));
  } else if (tip === 'oblacno'){
    nebo('#dcefff');
    R.push(ozd(oblak(w*0.24, 52, 1.05).s, '#ffffff'));
    R.push(ozd(oblak(w*0.72, 42, 0.88).s, '#f2f6fb'));
    R.push(ozd(oblak(w*0.46, 104, 0.72).s, '#ffffff'));
  } else if (tip === 'mavrica'){
    nebo('#e8f4ff');
    const mav = ['#e63946','#f4a259','#ffd166','#8ed081','#4cc9f0','#7c5cff'];
    for (let i = 0; i < 6; i++){
      const rr = w*0.36 - i*8.5;
      R.push(ozd(pa('M' + f1(w*0.5 - rr) + ' ' + f1(talna) +
        'A' + f1(rr) + ' ' + f1(rr) + ' 0 0 1 ' + f1(w*0.5 + rr) + ' ' + f1(talna) +
        'L' + f1(w*0.5 + rr - 9) + ' ' + f1(talna) +
        'A' + f1(rr-9) + ' ' + f1(rr-9) + ' 0 0 0 ' + f1(w*0.5 - rr + 9) + ' ' + f1(talna) + 'Z'), mav[i]));
    }
    R.push(ozd(oblak(w*0.16, talna-34, 0.85).s, '#ffffff'));
  } else if (tip === 'sneg'){
    nebo('#e6f0ff');
    for (let i = 0; i < Math.round(10 + 10 * (o.gostota == null ? 1 : o.gostota)); i++)
      R.push(ozd(ci(10 + r()*(w-20), 8 + r()*(talna*0.86), 4 + r()*3), '#ffffff'));
  } else if (tip === 'dez'){
    nebo('#c7d9e8');
    R.push(ozd(oblak(w*0.3, 50, 1.0).s, '#a9bdd0'));

/* ---------------- balonske črke in števke -------------------------------
   Vsak znak je opisan s potezami v škatli 0–100 × 0–140 (vrh črke je pri
   y = 4, črta pisave pri y = 140). Poteza je ravna črta ['c', x1,y1, x2,y2],
   lomljenka ['v', x1,y1, x2,y2, x3,y3] ali lok ['l', cx,cy, rx,ry, kot1,kot2]
   v stopinjah (0 = desno, 90 = navzdol). Strešica leži nad škatlo.         */
function lokTocke(cx, cy, rx, ry, a1, a2){
  const P = [], n = Math.max(6, Math.round(Math.abs(a2 - a1) / 12));
  for (let i = 0; i <= n; i++){
    const a = (a1 + (a2 - a1) * i / n) * Math.PI / 180;
    P.push([cx + Math.cos(a)*rx, cy + Math.sin(a)*ry]);
  }
  return P;
}

/* točke ene poteze v koordinatah škatle */
function potezaTocke(d){
  if (d[0] === 'c') return [[d[1],d[2]],[d[3],d[4]]];
  if (d[0] === 'v') return [[d[1],d[2]],[d[3],d[4]],[d[5],d[6]]];
  return lokTocke(d[1], d[2], d[3], d[4], d[5], d[6]);
}
const ABECEDA = 'ABCČDEFGHIJKLMNOPRSŠTUVZŽ'.split('');
const STEVKE = '0123456789'.split('');
/* Poteze znaka kot polja za barvanje. ox, oy = levi zgornji kot škatle,
   s = merilo, deb = debelina poteze v enotah škatle.                       */
function crkaPolja(znak, ox, oy, s, deb, bp, sym){
  const def = CRKE[znak] || [];
  const R = [];
  def.forEach(function(d, i){
    const sp = potezaTocke(d).map(function(p){ return [ox + p[0]*s, oy + p[1]*s]; });
    R.push(obm(trak(sp, deb*s, deb*s, d[0] === 'c' ? .35 : .55),
      bp[i % bp.length], sym ? { sym: sym + i } : undefined));
  });
  return R;
}
/* Črte znaka (brez polnila) – kadar je znak le napisan, ne pobarvan. */
function crkaCrte(znak, ox, oy, s, w){
  const def = CRKE[znak] || [], L = [];
  def.forEach(function(d){
    const sp = potezaTocke(d).map(function(p){ return [ox + p[0]*s, oy + p[1]*s]; });
    L.push(crt(sp.length > 2 ? cr(sp, .6) : po(sp), w));
  });
  return L;
}

/* Vsaka slika je funkcija stopnje (1–5): več kot je stopnja, več je polj.  */
const SLIKE = [];

/* Groba očrtna škatla oblike – za iskanje največjih polj. */
function pribBBox(s){
  if (s.t === 'e') return [s.cx - s.rx, s.cy - s.ry, s.rx*2, s.ry*2];
  if (s.t === 'r') return [s.x, s.y, s.w, s.h];
  const n = s.d.match(/-?\d+(\.\d+)?/g) || [];
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for (let i=0; i+1 < n.length; i += 2){
    const x = +n[i], y = +n[i+1];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return x1 > x0 ? [x0, y0, x1-x0, y1-y0] : [0,0,0,0];
}
/* Barve, ki v tej zbirki pomenijo nebo, vodo ali noč. Na takšna polja okras
   ne sodi: krogci na nebu izgledajo kot napaka, ne kot okrasje.            */
const BARVE_OZADJA = ['#a8dcf0','#cfe8f7','#cfe8fb','#eaf6ff','#e6f0ff','#e6f4ff','#bfe6f5',
  '#dff0d8','#d6f2fb','#1b2a49','#2b2d5e','#fdf6ec','#b8e2f2','#3d9be9','#7fc6f2','#0b1d3a',
  '#f7d9a0','#ffd9b0','#c7e9ff','#dcefff','#e8f4ff','#fff3b0','#2f3a63','#dff0ff'];
/* Je polje ozadje (nebo, tla, voda)? Poznamo ga po zastavici oz, po barvi
   ali po tem, da se razteza čez skoraj vso širino platna.                  */
function jeOzadje(o, bb, sl){
  if (o.oz) return true;
  if (BARVE_OZADJA.indexOf(String(o.c || '').toLowerCase()) >= 0) return true;
  return bb[2] >= sl.w * 0.85;
}
/* Če višja stopnja sama po sebi ne doda polj, sliko obogatimo z okrasjem
   v njenih največjih poljih: pikami, kapljicami, zvezdicami in progami.
   Okras se vrine TAKOJ ZA svoje polje, da ne prekrije oči in drugih
   podrobnosti, ki se rišejo pozneje.                                       */
function dodajPodrobnosti(sl, id, lv, koliko){
  const r = nak(zrno(id + ':' + lv));
  const vsi = sl.R.map(function(o, i){
    const bb = pribBBox(o.s);
    return { i:i, o:o, bb:bb, a:bb[2]*bb[3] };
  }).filter(function(k){
    return !k.o.rez && k.bb[2] > 34 && k.bb[3] > 34 && /^#[0-9a-f]{6}$/i.test(k.o.c || '');
  });
  const strogi = vsi.filter(function(k){
    /* največ tretjina platna in nič ozadij */
    return k.a < sl.w * sl.h / 3 && !jeOzadje(k.o, k.bb, sl);
  });
  /* Če stroga izbira ne najde ničesar, raje okrasimo večje polje, kot da bi
     višja stopnja ostala enako bogata kot nižja. */
  const kand = (strogi.length ? strogi : vsi.filter(function(k){ return k.a < sl.w * sl.h * 0.6; }))
    .sort(function(a, b){ return b.a - a.a; }).slice(0, 6);
  if (!kand.length) return;
  const vrini = [];
  for (let j = 0; j < koliko; j++){
    const k = kand[j % kand.length], bb = k.bb;
    const kot = r() * Math.PI * 2, odd = 0.16 + r() * 0.16;
    const x = bb[0] + bb[2] * (0.5 + Math.cos(kot) * odd);
    const y = bb[1] + bb[3] * (0.5 + Math.sin(kot) * odd);
    const rr = Math.min(15, Math.max(6, Math.min(bb[2], bb[3]) * (0.10 + r() * 0.07)));
    const barva = svetleje(k.o.c, j % 2 ? 38 : -34);
    let oblika;
    const vrsta = (j + Math.floor(r()*4)) % 4;
    if (vrsta === 0) oblika = ci(x, y, rr);
    else if (vrsta === 1) oblika = zvezda(x, y, rr*1.25, 5, .46);
    else if (vrsta === 2) oblika = el(x, y, rr*1.35, rr*0.72, kot);
    else oblika = bl([[x-rr,y],[x,y-rr*1.5],[x+rr,y],[x,y+rr*1.5]], .9);
    vrini.push({ i:k.i, o:obm(oblika, barva, { rez:k.o.s }) });
  }
  vrini.sort(function(a, b){ return b.i - a.i; });
  vrini.forEach(function(v){ sl.R.splice(v.i + 1, 0, v.o); });
}
/* Polje, ki v celoti pade čez rob platna, je nevidno – otrok ga ne more tapniti,
   preveriKonec() pa ga vseeno šteje, zato slika nikoli ne bi bila končana.
   Oblik, ki jih ne znamo izmeriti, ne odstranjujemo. */
function samoNaPlatnu(sl){
  sl.R = sl.R.filter(function(o){
    const b = pribBBox(o.s);
    if (b[2] <= 0 && b[3] <= 0) return true;
    return b[0] < sl.w && b[1] < sl.h && b[0] + b[2] > 0 && b[1] + b[3] > 0;
  });
  return sl;
}
function slika(id, nm, tema, stopnje, gradi){
  /* Primerjamo se s POLNO prejšnjo stopnjo (tudi če je bila sama obogatena),
     sicer bi višja stopnja lahko imela manj polj od nižje. */
  const polna = function(lv){
    const sl = samoNaPlatnu(gradi(lv));
    const k = stopnje.indexOf(lv);
    if (k > 0){
      const prej = polna(stopnje[k-1]).R.length;
      if (sl.R.length <= prej) dodajPodrobnosti(sl, id, lv, prej - sl.R.length + 2 + k * 2);
    }
    return sl;
  };
  SLIKE.push({ id:id, nm:nm, tema:tema, stopnje:stopnje, gradi:polna });
}

slika('mandala','Mandala','vzorci', [1,2,3,4,5], function(lv){
  const R = [], L = [];
  const cx = 170, cy = 170, rmax = 156;
  const obroci = [3,4,5,6,7][lv-1];
  const seg = [8,10,12,16,20][lv-1];
  const bp = ['#e63946','#f77f00','#ffd60a','#43aa8b','#118ab2','#7c5cff','#ff70a6','#06d6a0'];
  const tocka = (r,a) => [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  function kolut(r1,r2,a1,a2){
    const A = tocka(r2,a1), B = tocka(r2,a2), C = tocka(r1,a2), D = tocka(r1,a1);
    return pa('M' + f1(A[0]) + ' ' + f1(A[1]) + 'A' + f1(r2) + ' ' + f1(r2) + ' 0 0 1 ' + f1(B[0]) + ' ' + f1(B[1]) +
      'L' + f1(C[0]) + ' ' + f1(C[1]) + 'A' + f1(r1) + ' ' + f1(r1) + ' 0 0 0 ' + f1(D[0]) + ' ' + f1(D[1]) + 'Z');
  }
  const r0 = 26, sirina = (rmax - r0) / obroci;
  for (let o=0;o<obroci;o++){
    const r1 = r0 + o*sirina, r2 = r0 + (o+1)*sirina;
    for (let i=0;i<seg;i++){
      const a1 = i*2*Math.PI/seg - Math.PI/2, a2 = (i+1)*2*Math.PI/seg - Math.PI/2, am = (a1+a2)/2;
      const sym = 'o' + o + '_' + (i % 2);
      if (o % 2 === 0){
        R.push(obm(kolut(r1, r2, a1, a2), bp[(o + i) % bp.length], { sym:sym }));
      } else {
        const d = (a2 - a1) * .18;
        const P = [tocka(r1 + 2, am), tocka((r1+r2)/2, a1 + d), tocka(r2 - 1, am), tocka((r1+r2)/2, a2 - d)];
        R.push(obm(bl(P, .95), bp[(o + i + 3) % bp.length], { sym:sym }));
      }
    }
  }
  R.push(obm(ci(cx,cy,r0), bp[2]));
  if (lv >= 3){
    const n = seg >= 16 ? 8 : 6;
    for (let i=0;i<n;i++){
      const a = i*2*Math.PI/n;
      R.push(obm(ci(cx + Math.cos(a)*14, cy + Math.sin(a)*14, 7), bp[(i+1) % bp.length], { sym:'sr' + (i%2) }));
    }
  }
  return { w:340, h:340, R:R, L:L };
});

slika('mozaik','Mozaik','vzorci', [2,3,4], function(lv){
  const R = [], L = [];
  const ime = lv <= 2 ? 'srce' : (lv === 3 ? 'drevo' : 'gobica');
  const vz = VZORCI[ime], v = vz.v;
  const st = v[0].length, vr = v.length, c = 22, rob = 10;
  const W = st*c + rob*2, H = vr*c + rob*2;
  R.push(obm(re(0,0,W,H,0), '#eaf4fb'));                                              /* ozadje */
  for (let a=0;a<vr;a++)

      if (z === '.') continue;
      R.push(obm(re(rob + b*c, rob + a*c, c, c, 3), vz.k[z]));
    }
  return { w:W, h:H, R:R, L:L };
});

function zival(o){
  return function(lv){
    const R = [], L = [];
    const gx = 150, gy = 104, gr = 62;
    const telo = bl([[150,150],[98,178],[86,242],[150,262],[214,242],[202,178]], .9);
    const glava = ci(gx, gy, gr);
    if (lv >= 4){
      R.push(obm(re(0,0,300,290,0), o.ozadje || '#eaf4e6'));
      R.push(obm(bl([[0,254],[80,246],[160,256],[240,246],[300,254],[300,290],[0,290]], .8), '#8fbf6a'));
    }
    /* rep */
    if (o.rep === 'dolg')   R.push(obm(trak([[210,244],[258,240],[272,196],[250,166]], o.repW || 26, 13), o.b2));
    if (o.rep === 'tanek')  R.push(obm(trak([[210,246],[258,242],[274,200],[256,172]], 13, 6), o.b2));
    if (o.rep === 'puhast') R.push(obm(bl([[198,232],[248,258],[288,216],[268,162],[214,182]], .9), o.b2));
    if (o.rep === 'kratek') R.push(obm(ci(214,240,22), o.b2));
    /* ušesa */
    if (o.uho === 'trikotno'){
      R.push(obm(po([[104,72],[92,14],[146,54]]), o.b2));
      R.push(obm(po([[196,72],[208,14],[154,54]]), o.b2));
      R.push(obm(po([[110,68],[102,32],[138,56]]), o.notri));
      R.push(obm(po([[190,68],[198,32],[162,56]]), o.notri));
    } else if (o.uho === 'okroglo'){
      R.push(obm(ci(102,56,o.uhoR || 26), o.b2));
      R.push(obm(ci(198,56,o.uhoR || 26), o.b2));
      R.push(obm(ci(102,56,(o.uhoR || 26)*0.55), o.notri));
      R.push(obm(ci(198,56,(o.uhoR || 26)*0.55), o.notri));
    } else if (o.uho === 'dolgo'){
      R.push(obm(el(122,40,18,48,-0.12), o.b2));
      R.push(obm(el(178,40,18,48,0.12), o.b2));
      R.push(obm(el(122,44,9,34,-0.12), o.notri));
      R.push(obm(el(178,44,9,34,0.12), o.notri));
    } else if (o.uho === 'visece'){
      R.push(obm(bl([[104,72],[72,96],[76,156],[112,144]], .9), o.b2));
      R.push(obm(bl([[196,72],[228,96],[224,156],[188,144]], .9), o.b2));
    }
    R.push(obm(telo, o.b));
    R.push(obm(bl([[150,186],[116,208],[112,246],[150,256],[188,246],[184,208]], .9), o.svetlo));
    R.push(obm(el(114,250,26,15), o.svetlo));
    R.push(obm(el(186,250,26,15), o.svetlo));
    R.push(obm(glava, o.b));
    if (o.poseb) o.poseb(lv, R, L, { glava:glava, telo:telo });
    /* gobec, oči, nos */
    R.push(obm(el(gx, gy+26, o.gobecW || 32, 22), o.svetlo));
    R.push(obm(ci(124,96,15), '#ffffff'));
    R.push(obm(ci(176,96,15), '#ffffff'));
    R.push(obm(ci(124,96,7), o.oko || '#3c8f4f'));
    R.push(obm(ci(176,96,7), o.oko || '#3c8f4f'));
    R.push(obm(ci(124,96,3.5), '#2f2a26'));
    R.push(obm(ci(176,96,3.5), '#2f2a26'));
    if (o.nos === 'oval') R.push(obm(el(gx,124,15,11), o.nosB || '#2f2a26'));
    else R.push(obm(po([[gx,132],[gx-13,119],[gx+13,119]]), o.nosB || '#2f2a26'));
    L.push(crt(cr([[gx,132],[gx,142]], .9)));
    L.push(crt(cr([[gx,142],[gx-15,150]], .9)));
    L.push(crt(cr([[gx,142],[gx+15,150]], .9)));
    if (o.brki){
      L.push(crt(cr([[118,128],[60,118]], .9))); L.push(crt(cr([[118,136],[62,140]], .9)));
      L.push(crt(cr([[182,128],[240,118]], .9))); L.push(crt(cr([[182,136],[238,140]], .9)));
    }
    if (lv >= 3 && o.ovratnica){
      R.push(obm(bl([[150,166],[112,160],[108,174],[150,182],[192,174],[188,160]], .8), '#e63946'));
      R.push(obm(ci(150,184,11), '#ffd60a'));
    }
    return { w:300, h:290, R:R, L:L };
  };
}
const proge = function(lv, R, L, d){
  const n = lv >= 3 ? 5 : 3;
  for (let i=0;i<n;i++){
    R.push(obm(bl([[104+i*24,50],[112+i*24,74],[104+i*24,98],[96+i*24,74]], .9), '#7f4f24', { rez:d.glava }));
    R.push(obm(bl([[98+i*27,176],[104+i*27,204],[98+i*27,232],[92+i*27,204]], .9), '#7f4f24', { rez:d.telo }));
  }
};

/* ======================= ZA ODRASLE =====================================
   Zahtevnejši, meditativni vzorci z veliko drobnimi polji. Vsi so risani
   iz kroga ali mreže, zato jih stopnja lahko poljubno zgosti.            */
const BP_ODR = ['#e63946','#f77f00','#ffd60a','#43aa8b','#118ab2','#7c5cff','#ff70a6','#06d6a0',
                '#bc4749','#e07a3f','#3a86ff','#8338ec'];
function tocka(cx, cy, r, a){ return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; }
function kolobar(cx, cy, r1, r2, a1, a2){
  const A = tocka(cx,cy,r2,a1), B = tocka(cx,cy,r2,a2), C = tocka(cx,cy,r1,a2), D = tocka(cx,cy,r1,a1);
  return pa('M' + f1(A[0]) + ' ' + f1(A[1]) + 'A' + f1(r2) + ' ' + f1(r2) + ' 0 0 1 ' + f1(B[0]) + ' ' + f1(B[1]) +
    'L' + f1(C[0]) + ' ' + f1(C[1]) + 'A' + f1(r1) + ' ' + f1(r1) + ' 0 0 0 ' + f1(D[0]) + ' ' + f1(D[1]) + 'Z');
}
function listek(cx, cy, r1, r2, a1, a2, nap){
  const am = (a1+a2)/2, d = (a2-a1)*0.2;
  return bl([tocka(cx,cy,r1,am), tocka(cx,cy,(r1+r2)/2,a1+d), tocka(cx,cy,r2,am), tocka(cx,cy,(r1+r2)/2,a2-d)], nap || .95);
}

    const n = p % 2 ? Math.round(listov*0.75) : listov;
    for (let i=0;i<n;i++){

          BP_ODR[(p*3+i+5)%BP_ODR.length], { sym:'v'+p+'_'+(i%2) }));
    }
  }
  for (let i=0;i<listov;i++){
    const a1 = i*2*Math.PI/listov;
    R.push(obm(listek(cx,cy,12,34,a1,a1+2*Math.PI/listov), BP_ODR[(i+2)%BP_ODR.length], { sym:'sr'+(i%2) }));

      const x = b*cw + cw/2, y = a*ch + ch/2, m = Math.min(cw,ch)/2 * 0.92;
      const obrni = (a+b)%2 ? -1 : 1;

      for (let k=0;k<pik;k++){

slika('ornamentalnasova','Ornamentalna sova','odrasli',[2,3,4,5], function(lv){

slika('koi','Koi ribi','odrasli',[2,3,4,5], function(lv){
  const R=[],L=[];
  const W=400, H=400, cx=200, cy=200;
  R.push(obm(ci(cx,cy,190), '#eaf6ff'));
  /* mirni krogi na vodi */
  const obr = [0,0,4,5,7,9][lv];
  for (let i=obr;i>=1;i--)
    R.push(obm(ci(cx,cy,40 + i*(150/obr)), i%2 ? '#cfefff' : '#dff1ff', { sym:'v'+(i%2) }));
  function koi(sx, sy, kot, b1, b2, ozn){
    const T = P => vrti(P.map(function(q){ return [sx+q[0], sy+q[1]]; }), sx, sy, kot);
    const T1 = q => T([q])[0];
    const telo = bl(T([[-96,0],[-56,-52],[10,-62],[68,-36],[92,4],[56,52],[-16,62],[-70,42]]), .95);
    R.push(obm(bl(T([[76,-10],[152,-58],[134,4],[156,60],[80,20]]), .8), b2, { sym:'r'+ozn }));
    R.push(obm(bl(T([[-4,58],[-34,110],[18,90],[34,58]]), .85), b2, { sym:'p'+ozn }));
    R.push(obm(bl(T([[4,-62],[-28,-116],[34,-98],[48,-60]]), .85), b2, { sym:'h'+ozn }));
    R.push(obm(bl(T([[-40,44],[-70,80],[-24,72],[-8,48]]), .85), b2, { sym:'s'+ozn }));
    R.push(obm(telo, b1, { sym:'t'+ozn }));
    /* luske kot polkrogi, vrsta za vrsto */
    const vr = lv >= 4 ? 5 : 3, st = lv >= 4 ? 7 : 5, rr = 22;
    for (let a=0;a<vr;a++)
      for (let c=0;c<st;c++){
        const x = -80 + c*26 + (a%2 ? 13 : 0), y = -40 + a*22;
        const p1 = T1([x-rr, y]), p2 = T1([x+rr, y]);
        R.push(obm(pa('M' + f1(p1[0]) + ' ' + f1(p1[1]) + 'A' + rr + ' ' + rr + ' 0 0 0 ' +
          f1(p2[0]) + ' ' + f1(p2[1]) + 'Z'), (a+c)%2 ? b2 : '#ffffff', { rez:telo, sym:'l'+ozn+a }));
      }
    const o = T1([-66,-16]);
    R.push(obm(ci(o[0],o[1],13), '#ffffff', { sym:'o'+ozn }));
    R.push(obm(ci(o[0],o[1],7), '#2f2a26', { sym:'z'+ozn }));
    const u = T1([-92,6]);
    L.push(crt(cr([[u[0],u[1]],[u[0]-10,u[1]+8]], 2)));
  }
  koi(cx-26, cy-74, 0.42, '#f77f00', '#e63946', 'a');
  koi(cx+26, cy+74, Math.PI+0.42, '#f7f3ea', '#118ab2', 'b');
  if (lv >= 3){
    const m = lv >= 4 ? 9 : 5;
    for (let i=0;i<m;i++){
      const a = i*2*Math.PI/m + 0.3;
      R.push(obm(ci(cx+Math.cos(a)*172, cy+Math.sin(a)*172, 13), '#ffffff', { sym:'m'+(i%2) }));
    }
  }
  return { w:W, h:H, R:R, L:L };
});

slika('balon','Ornamentalni balon','odrasli',[2,3,4,5], function(lv){

  const W=340, H=440, cx=170, y0=24, Hb=252, Rb=138;
  R.push(obm(re(0,0,W,H,0), '#eaf4fb'));
  const sir = function(t){ return Rb * Math.pow(Math.sin(Math.PI*(0.07 + 0.88*t)), 0.8); };
  const gor = [0,0,5,6,8,10][lv], pas = [0,0,3,4,5,6][lv];
  const rob = [];
  for (let j=0;j<=24;j++) rob.push([cx + sir(j/24), y0 + (j/24)*Hb]);
  for (let j=24;j>=0;j--) rob.push([cx - sir(j/24), y0 + (j/24)*Hb]);
  const kupola = po(rob);
  R.push(obm(kupola, '#f6f1e4'));
  for (let g=0;g<gor;g++)
    for (let b=0;b<pas;b++){
      const u1 = -1 + 2*g/gor, u2 = -1 + 2*(g+1)/gor;
      const t1 = b/pas, t2 = (b+1)/pas, P=[];
      for (let s=0;s<=4;s++){ const t = t1 + (t2-t1)*s/4; P.push([cx + u1*sir(t), y0 + t*Hb]); }
      for (let s=4;s>=0;s--){ const t = t1 + (t2-t1)*s/4; P.push([cx + u2*sir(t), y0 + t*Hb]); }
      R.push(obm(po(P), BP_ODR[(g+b*3)%BP_ODR.length], { rez:kupola, sym:'p'+b+'_'+(g%2) }));
      if (lv >= 4){
        const tm = (t1+t2)/2, xm = cx + (u1+u2)/2*sir(tm), ym = y0 + tm*Hb;
        R.push(obm(ci(xm, ym, Math.max(4, sir(tm)/gor*0.55)), BP_ODR[(g+b+6)%BP_ODR.length],
          { rez:kupola, sym:'o'+b+'_'+(g%2) }));
      }
    }
  const yd = y0 + Hb, ky = yd + 60;
  R.push(obm(po([[cx-sir(1)-2,yd],[cx-30,ky],[cx-22,ky],[cx-sir(1)+9,yd]]), '#8d5524', { sym:'vr' }));
  R.push(obm(po([[cx+sir(1)+2,yd],[cx+30,ky],[cx+22,ky],[cx+sir(1)-9,yd]]), '#8d5524', { sym:'vr' }));
  const kos = po([[cx-36,ky],[cx+36,ky],[cx+29,ky+58],[cx-29,ky+58]]);
  R.push(obm(kos, '#b5651d'));
  const pl = lv >= 4 ? 5 : 3;
  for (let i=0;i<pl;i++)
    R.push(obm(re(cx-36+i*(72/pl), ky+5, 72/pl-5, 48, 3), i%2 ? '#8d5524' : '#d69f6b',
      { rez:kos, sym:'k'+(i%2) }));
  const obl = lv >= 3 ? 4 : 2;
  for (let i=0;i<obl;i++){
    const x = 46 + (i%2)*242, y = 316 + (i>>1)*62;
    R.push(obm(bl([[x-36,y],[x-20,y-20],[x+4,y-26],[x+28,y-12],[x+36,y+6],[x-26,y+8]], .95),
      '#ffffff', { sym:'ob'+(i%2) }));
  }
  return { w:W, h:H, R:R, L:L };
});

/* ======================= LETNI ČASI ===================================== */
/* Skupni gradniki letnih časov: preprost cvet, list in listnata krošnja. */
function cvetic(x, y, r, barva, sym){
  return [obm(zvezda(x, y, r, 6, .52), barva || '#ff8fab', { sym:sym }),
          obm(ci(x, y, r*0.42), '#ffd166', { sym: sym && sym+'s' })];
}
function listic(x, y, s, kot, barva, sym){
  const P = vrti([[x, y-16*s],[x+11*s, y],[x, y+16*s],[x-11*s, y]], x, y, kot);
  return obm(bl(P, .95), barva, { sym:sym });
}
function listnato(x, y, s, barva, svetlo, sym){
  return [obm(ci(x-26*s, y+8*s, 30*s), barva, { sym:sym }),
          obm(ci(x+26*s, y+10*s, 28*s), svetlo, { sym: sym && sym+'d' }),
          obm(ci(x, y-20*s, 34*s), barva, { sym: sym && sym+'v' })];
}

/* ======================= ČRKE IN ŠTEVILKE ===============================
   Vsaka črka slovenske abecede in vsaka števka je svoja slika. Poteze so
   debele in balonske, ozadje pa se z višjo stopnjo bogati z okrasjem.     */
const CRKA_OZADJA = ['#ffd60a','#4cc9f0','#8ac926','#ff70a6','#f77f00','#c77dff','#43aa8b','#ffb703'];
const CRKA_POTEZE = ['#e63946','#118ab2','#7c5cff','#06d6a0','#f4a259','#ef476f'];
const CRKA_ID = { 'Č':'Cs', 'Š':'Ss', 'Ž':'Zs' };
function slikaZnaka(znak, id, ime, iz){
  slika(id, ime, 'crke', [1,2,3,4,5], function(lv){
    const W = 220, H = 260, R = [], L = [];
    const oz = CRKA_OZADJA[iz % CRKA_OZADJA.length];
    R.push(ozd(re(0, 0, W, H, 0), oz));
    if (lv >= 2) for (let i=0;i<4;i++)
      R.push(obm(ci(i % 2 ? 194 : 26, i < 2 ? 26 : 234, 16), '#ffffff', { sym:'vg' }));
    if (lv >= 3) for (let i=0;i<4;i++)
      R.push(obm(zvezda(i % 2 ? 192 : 28, i < 2 ? 92 : 172, 14, 5, .45), '#ffffff', { sym:'zv' }));
    if (lv >= 4) for (let i=0;i<6;i++)
      R.push(obm(re(i < 3 ? 6 : 204, 42 + (i % 3) * 62, 10, 40, 5), svetleje(oz, -44), { sym:'rob' }));
    if (lv >= 5) for (let i=0;i<8;i++)
      R.push(obm(ci(24 + (i*47) % 172, 20 + (i*83) % 220, 8), svetleje(oz, 46), { sym:'pk'+(i%2) }));
    R.push.apply(R, crkaPolja(znak, 50, 64, 1.2, 21,
      [CRKA_POTEZE[iz % CRKA_POTEZE.length], CRKA_POTEZE[(iz + 2) % CRKA_POTEZE.length]]));
    return { w:W, h:H, R:R, L:L };
  });
}
ABECEDA.forEach(function(z, i){ slikaZnaka(z, 'crka' + (CRKA_ID[z] || z), 'Črka ' + z, i); });
STEVKE.forEach(function(z, i){ slikaZnaka(z, 'stevka' + z, 'Številka ' + z, i + 3); });

let AC = null;
function pisk(fr, dur, tip){
  if (!S.zvok) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    fr.forEach(function(f, i){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = tip || 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(AC.destination);
      const t = AC.currentTime + i*(dur*0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    });
  } catch(e){}
}

function stopnjaZa(sl, zel){
  let best = sl.stopnje[0];
  sl.stopnje.forEach(function(l){ if (Math.abs(l - zel) < Math.abs(best - zel)) best = l; });
  return best;
}

/* Govorni oblaček ob maskoti – kratek stavek, ki otroka nagovori. */

const SPODBUDE = ['Lepo ti gre!', 'Kakšne barve!', 'Kar tako naprej!', 'To je pa pisano!',
                  'Super izbira barve!', 'Že diši po mavrici!'];

/* Barvni madeži v ozadju – vgrajen SVG, brez zunanjih virov. */
function narisiMadeze(){
  const m = $('madezi'); if (!m) return;
  const barve = ['#ff7a45','#12a5a5','#ffd166','#c77dff','#8ac926','#ff70a6'];
  let k = '';
  for (let i=0;i<9;i++){
    const x = 6 + ((i*37) % 88), y = 8 + ((i*53) % 84), rr = 5 + (i % 4) * 2.6;
    k += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rr + '" ry="' + (rr*0.72) +
         '" fill="' + barve[i % barve.length] + '" opacity="' + (0.10 + (i%3)*0.04) +
         '" transform="rotate(' + (i*37) + ' ' + x + ' ' + y + ')"/>';
  }
  m.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' + k + '</svg>';
}

/* ---------------------- konfeti ob dokončani sliki ----------------------- */
let konfetiCas = 0;
function konfeti(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('konfeti'); if (!c) return;
  c.hidden = false;
  c.width = window.innerWidth; c.height = window.innerHeight;
  const cx = c.getContext('2d');
  const barve = ['#ff7a45','#12a5a5','#ffd166','#c77dff','#8ac926','#ff70a6','#4cc9f0'];
  const kosi = [];
  for (let i=0;i<90;i++)
    kosi.push({ x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.5,
                w: 6 + Math.random()*7, h: 9 + Math.random()*9,
                vy: 2 + Math.random()*3, vx: -1.2 + Math.random()*2.4,
                kot: Math.random()*Math.PI*2, vk: -0.14 + Math.random()*0.28,
                b: barve[i % barve.length] });
  const zacetek = Date.now();
  clearInterval(konfetiCas);
  konfetiCas = setInterval(function(){
    cx.clearRect(0, 0, c.width, c.height);
    kosi.forEach(function(k){
      k.x += k.vx; k.y += k.vy; k.kot += k.vk;
      cx.save(); cx.translate(k.x, k.y); cx.rotate(k.kot);
      cx.fillStyle = k.b; cx.fillRect(-k.w/2, -k.h/2, k.w, k.h); cx.restore();
    });
    if (Date.now() - zacetek > 2600){
      clearInterval(konfetiCas); cx.clearRect(0, 0, c.width, c.height); c.hidden = true;
    }
  }, 26);
}

/* ======================= ZASLON: IZBIRA ================================= */
function izrisiIzbiro(){
  const izbrane = SLIKE.filter(s => S.tema === 'vse' || s.tema === S.tema);
  const kartice = izbrane.map(function(s, k){
    const lv = stopnjaZa(s, S.stopnja), sl = s.gradi(lv);
    const kljuc = s.id + ':' + lv;
    /* sličico rišemo v nižji stopnji: enako berljiva je, zaslon z več kot sto
       slikami pa se izriše bistveno hitreje. Število polj ostane pravo. */
    const tlv = Math.min(lv, 2), enaka = tlv === lv;
    const slT = enaka ? sl : s.gradi(tlv);
    const vTeku = (S.trenutna && S.trenutna.id === s.id && S.trenutna.lv === lv) ? S.trenutna : null;
    const barve = (vTeku && enaka) ? vTeku.barve : [];
    const koncana = !!S.koncane[kljuc];
    const odst = koncana ? 100 : (S.napredek[kljuc] || 0);
    return '<button class="pic' + (koncana ? ' koncana' : '') + '" data-slika="' + s.id + '" ' +
      'style="animation-delay:' + Math.min(k, 12) * 18 + 'ms">' +
      (koncana ? '<span class="done">✅</span>' : (odst > 0 ? obrocNapredka(odst) : '')) +
      svgIz(slT, { barve:barve, pre:'t' + s.id + lv, plain:true,
                  dodatek:risbaPlast(enaka && vTeku && vTeku.risba, slT) }) +
      '<span class="nm">' + esc(s.nm) + '</span>' +
      '<span class="meta">' + sl.R.length + ' polj · st. ' + lv + '</span></button>';
  }).join('');
  const koncanih = izbrane.filter(function(s){
    return !!S.koncane[s.id + ':' + stopnjaZa(s, S.stopnja)]; }).length;
  scrIzbira.innerHTML =
    '<div class="card">' +
      pozdravBlok(koncanih
        ? 'Pobarvanih imaš že ' + koncanih + ' od ' + izbrane.length + ' slik. Katera bo naslednja?'
        : 'Živjo, jaz sem Barvica! Izberi sliko in jo pobarvaj. Nič ni narobe – barve lahko kadar koli zamenjaš.',
        koncanih ? 'veselo' : 'pozdrav') +
      '<h2 class="sec" style="margin-top:4px">Tema</h2>' +
      '<div class="chips">' + TEME.map(t =>
        '<button class="chip" data-tema="' + t.id + '" aria-pressed="' + (S.tema === t.id) + '" ' +
        'style="--tem1:' + svetleje(t.b, 132) + ';--tem2:' + svetleje(t.b, 92) + '">' +
        '<span class="em">' + t.emo + '</span> ' + esc(t.nm) + '</button>').join('') + '</div>' +
      '<h2 class="sec">Zahtevnost</h2>' +
      '<div class="levels">' + STOPNJE.map(l =>
        '<button class="lvl" data-stopnja="' + l.n + '" aria-pressed="' + (S.stopnja === l.n) + '">' +
        '<b>' + l.n + '</b>' + esc(l.nm) + '</button>').join('') + '</div>' +
      '<p class="lead" style="margin:10px 0 0;font-size:14px">Ista slika ima na višji stopnji več in manjša polja. ' +
      'Če slika te stopnje nima, se izbere najbližja.</p>' +
    '</div>' +
    '<h2 class="sec">Slike (' + izbrane.length + ')' +
      (koncanih ? ' · dokončanih ' + koncanih : '') + '</h2>' +
    '<div class="grid">' + kartice + '</div>';
  pokaziZaslon(scrIzbira);
}
/* Obroč z odstotkom pobarvanega na sličici. */
function obrocNapredka(odst){
  const o = Math.max(0, Math.min(100, Math.round(odst)));
  const obseg = 2 * Math.PI * 12;
  return '<svg class="obroc" viewBox="0 0 30 30" aria-label="pobarvano ' + o + ' odstotkov">' +
    '<circle cx="15" cy="15" r="13.4" fill="var(--card)" opacity=".92"/>' +
    '<circle cx="15" cy="15" r="12" fill="none" stroke="var(--line)" stroke-width="3.2"/>' +
    '<circle cx="15" cy="15" r="12" fill="none" stroke="var(--acc)" stroke-width="3.2" ' +
      'stroke-linecap="round" stroke-dasharray="' + f1(obseg * o / 100) + ' ' + f1(obseg) + '" ' +
      'transform="rotate(-90 15 15)"/>' +
    '<text x="15" y="15.5">' + o + '</text></svg>';
}

/* ======================= BARVANJE ======================================= */
const NS = 'http://www.w3.org/2000/svg';
let P = null, risem = false, skladOb = 0;

function imaSim(sl){ return sl.R.some(function(o){ return !!o.sym; }); }

function odpri(id, lv){
  const s = najdi(id); if (!s) return;
  lv = lv || stopnjaZa(s, S.stopnja);
  const sl = s.gradi(lv);
  let barve = new Array(sl.R.length);
  if (S.trenutna && S.trenutna.id === id && S.trenutna.lv === lv && S.trenutna.barve.length === sl.R.length)
    barve = S.trenutna.barve.slice();
  P = { s:s, lv:lv, sl:sl, barve:barve, sklad:[], naprej:[], predlog:barveSlike(sl),
        poteze:[], osnova:null, k:1 };
  const shranjena = (S.trenutna && S.trenutna.id === id && S.trenutna.lv === lv) ? S.trenutna.risba : null;
  if (shranjena){
    const im = new Image();
    im.onload = function(){ P.osnova = im; izrisiPoteze(); };
    im.src = shranjena;
  }
  if (S.nacin === 'sim' && !imaSim(sl)) S.nacin = 'tap';
  if (poStevilkah(S.nacin) && !P.predlog.length) S.nacin = 'tap';
  /* pri barvanju po številkah in po vsoti izbiramo med predlaganimi barvami */
  if (poStevilkah(S.nacin) && P.predlog.indexOf(S.barva) < 0) S.barva = P.predlog[0];
  /* prazen list je namenjen prostemu risanju – takoj ponudimo svinčnik */
  if (s.tema === 'prosto' && S.nacin !== 'svincnik'){ S.nacin = 'svincnik'; shrani(); }
  izrisiPlatno();
}

function paletaBarv(){
  if (poStevilkah(S.nacin)) return P.predlog;
  return PALETE[S.paleta].b.concat(S.mojeBarve || []);
}
/* Delež pobarvanih polj v odstotkih. */
function odstotek(){ return P.sl.R.length ? Math.round(prestej() / P.sl.R.length * 100) : 0; }

function izrisiPlatno(){
  const sl = P.sl;
  const nacini = NACINI.filter(function(n){ return n.id !== 'sim' || imaSim(sl); });
  const risalno = S.nacin === 'svincnik';
  const barve = paletaBarv();
  const stevMode = poStevilkah(S.nacin);
  scrBarvanje.innerHTML =
    '<div class="tools" style="margin:0 0 10px">' +
      '<button class="btn" id="nazaj">⬅️ Nazaj</button>' +
      '<b style="font-size:17px">' + esc(P.s.nm) + '</b>' +
      '<span class="spacer"></span>' +
      '<button class="icon-btn" id="razveljavi" title="Razveljavi">↩️</button>' +
      '<button class="icon-btn" id="uveljavi" title="Uveljavi">↪️</button>' +
      '<button class="icon-btn" id="kapalka" title="Kapalka – vzemi barvo iz slike" ' +
        'aria-pressed="' + !!S.kapalka + '">💧</button>' +
      '<button class="icon-btn" id="predloga" title="Pokaži predlogo">👁️</button>' +
      '<button class="icon-btn" id="pocisti" title="Počisti vse">🗑️</button>' +
      '<button class="icon-btn" id="shraniSliko" title="Shrani sliko">💾</button>' +
    '</div>' +
    '<div class="stage" id="stage"><div class="platno' + (risalno ? ' risem' : '') + '" id="platno">' +
      svgIz(sl, { barve:P.barve, pre:'p' }) + '<canvas id="risba"></canvas></div></div>' +
    '<div class="tools"><div class="modes">' + nacini.map(function(n){
      return '<button class="mode" data-nacin="' + n.id + '" aria-pressed="' + (S.nacin === n.id) + '">' +
        n.emo + ' ' + esc(n.nm) + '</button>'; }).join('') + '</div></div>' +
    (risalno
      ? '<div class="tools"><div class="modes">' + ORODJA.map(function(o){
          return '<button class="mode" data-orodje="' + o.id + '" aria-pressed="' + (S.orodje === o.id) + '">' +
            o.emo + ' ' + esc(o.nm) + '</button>'; }).join('') + '</div>' +
        '<div class="modes">' + DEBELINE.map(function(d){
          return '<button class="mode" data-deb="' + d.n + '" aria-pressed="' + (S.debelina === d.n) + '">' +
            esc(d.nm) + '</button>'; }).join('') + '</div>' +
        '<button class="mode" id="vCrtah" aria-pressed="' + !!S.vCrtah + '">📏 Ostani v črtah</button></div>'
      : '') +
    '<div class="pal">' + barve.map(function(b, i){
      return '<button class="sw" data-barva="' + b + '" aria-pressed="' + (S.barva === b) + '" ' +
        'style="background:' + b + '" title="' + b + '">' + (stevMode ? '<span class="n">' + (i+1) + '</span>' : '') + '</button>';
    }).join('') + ((stevMode || risalno) ? '' :
      '<button class="sw guma" data-barva="guma" aria-pressed="' + (S.barva === 'guma') + '" title="Radirka">🧽</button>') +
      (stevMode ? '' : '<button class="sw guma" id="svojaBarva" title="Svoja barva" ' +
        'style="background:conic-gradient(#e63946,#f77f00,#ffd60a,#43aa8b,#118ab2,#7c5cff,#ff70a6,#e63946)">🎨</button>') + '</div>' +
    (stevMode ? '' : '<div class="palrow">' + Object.keys(PALETE).map(function(k){
      return '<button class="palpick" data-paleta="' + k + '" aria-pressed="' + (S.paleta === k) + '">' +
        esc(PALETE[k].nm) + '</button>'; }).join('') + '</div>') +
    '<div class="pozdrav" id="namig">' + maskota('pozdrav', 'velika') +
      '<div class="oblacek" id="namigText">' + esc(namigBesedilo()) + '</div></div>' +
    '<div class="hint">' + NACINI.filter(function(n){ return n.id === S.nacin; })[0].opis +
      (S.kapalka ? ' · <b>kapalka je vklopljena</b>: tapni polje in prevzameš njegovo barvo.' : '') +
      (risalno ? '' : ' · pobarvanih <b id="stanje">' + prestej() + '</b> od ' + sl.R.length +
        ' (<b id="odstotek">' + odstotek() + '</b> %)') + '</div>';
  pokaziZaslon(scrBarvanje);
  const platno = $('stage').querySelector('svg');
  if (stevMode) dodajStevilke(platno);
  vezi(platno);
  pripraviRisalno();
}

/* številke se postavijo v središče polja, majhna polja jih ne dobijo */
function dodajStevilke(platno){
  const stev = {};
  P.predlog.forEach(function(b, i){ stev[b] = i + 1; });
  P.sl.R.forEach(function(ob, i){
    const el = platno.querySelector('[data-i="' + i + '"]');
    if (!el || !ob.c) return;
    let bb; try { bb = el.getBBox(); } catch(e){ return; }
    if (bb.width < 15 || bb.height < 13) return;
    const st = stev[ob.c];
    const zapis = S.nacin === 'vsota' ? racunZa(st, P.s.id + ':' + i) : String(st);
    /* račun je širši od same številke – v drobno polje ga ne stlačimo */
    if (S.nacin === 'vsota' && zapis.length > 1 && bb.width < 30) return;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'num');
    t.setAttribute('x', bb.x + bb.width/2);
    t.setAttribute('y', bb.y + bb.height/2);
    t.setAttribute('data-num', i);
    t.textContent = zapis;
    platno.appendChild(t);
  });
}

function prestej(){ return P.barve.filter(function(b){ return !!b; }).length; }

function gradId(platno, hex){
  const id = 'g' + hex.slice(1);
  if (!platno.querySelector('#' + id)){
    let defs = platno.querySelector('defs');
    if (!defs){ defs = document.createElementNS(NS,'defs'); platno.insertBefore(defs, platno.firstChild); }
    const lg = document.createElementNS(NS,'linearGradient');
    lg.setAttribute('id', id); lg.setAttribute('x1','0'); lg.setAttribute('y1','0');
    lg.setAttribute('x2','0'); lg.setAttribute('y2','1');
    [[0, svetleje(hex,70)],[1, hex]].forEach(function(p){
      const st = document.createElementNS(NS,'stop');
      st.setAttribute('offset', p[0]); st.setAttribute('stop-color', p[1]);
      lg.appendChild(st);
    });
    defs.appendChild(lg);
  }
  return id;
}
function nastaviBarvo(i){
  const platno = $('stage').querySelector('svg');
  const el = platno.querySelector('[data-i="' + i + '"]');
  if (!el) return;
  const b = P.barve[i];
  if (!b){ el.setAttribute('fill', '#fff'); return; }
  if (b.indexOf('preliv:') === 0) el.setAttribute('fill', 'url(#' + gradId(platno, b.slice(7)) + ')');
  else el.setAttribute('fill', b);
}

function pobarvaj(i){
  if (!P || !P.sl.R[i]) return;
  const ob = P.sl.R[i];
  /* kapalka: iz polja vzamemo barvo, ne da bi karkoli pobarvali */
  if (S.kapalka){
    let b = P.barve[i] || ob.c;
    if (b && b.indexOf('preliv:') === 0) b = b.slice(7);
    if (b){ S.barva = b; S.kapalka = false; shrani(); izrisiPlatno(); zvokBarva(); }
    return;
  }
  if (poStevilkah(S.nacin)){
    if (S.barva !== ob.c){
      const el = $('stage').querySelector('[data-i="' + i + '"]');
      if (el){ el.classList.add('zmota'); setTimeout(function(){ el.classList.remove('zmota'); }, 360); }
      zvokNapak();
      povejMaskota(S.nacin === 'vsota'
        ? 'Skoraj! Seštej račun v polju in izberi barvo s tem rezultatom.'
        : 'Ta barva ima drugo številko. Poglej, katera piše v polju.', 'zalostno');
      return;
    }
  }
  let ciljne = [i];
  if (S.nacin === 'sim' && ob.sym)
    ciljne = P.sl.R.map(function(o, j){ return o.sym === ob.sym ? j : -1; }).filter(function(j){ return j >= 0; });
  let barva = S.barva;
  if (poStevilkah(S.nacin)) barva = ob.c;
  else if (barva === 'guma') barva = null;
  else if (S.nacin === 'preliv') barva = 'preliv:' + barva;
  const sprem = [];
  ciljne.forEach(function(j){
    if (P.barve[j] !== barva){ sprem.push({ i:j, prej:P.barve[j] }); P.barve[j] = barva || undefined; }
  });
  if (!sprem.length) return;
  P.sklad.push(sprem);
  P.naprej = [];                       /* nova poteza pobriše pot naprej */
  sprem.forEach(function(x){ nastaviBarvo(x.i); });
  osveziStanje();
  /* vsakih nekaj polj maskota spodbudi */
  if (prestej() % 8 === 0 && prestej() < P.sl.R.length)
    povejMaskota(SPODBUDE[(prestej() / 8) % SPODBUDE.length], 'veselo');
  zvokBarva(); shraniTrenutno(); preveriKonec();
}
/* Števec pobarvanih polj in odstotek pod platnom. */
function osveziStanje(){
  const st = $('stanje'); if (st) st.textContent = prestej();
  const od = $('odstotek'); if (od) od.textContent = odstotek();
}
/* Kaj Barvica reče, ko ni posebnega dogodka. */
function namigBesedilo(){
  if (!P) return 'Izberi sliko in začniva.';
  const o = odstotek();
  if (S.nacin === 'svincnik') return 'Riši, kakor želiš. Če ti ni všeč, obstaja radirka.';
  if (o === 0) return 'Izberi barvo in tapni polje. Barvo lahko kadar koli zamenjaš.';
  if (o < 50) return SPODBUDE[Math.floor(o / 10) % SPODBUDE.length];
  if (o < 100) return 'Že ' + o + ' odstotkov! Manjka še ' + (P.sl.R.length - prestej()) + ' polj.';
  return 'Slika je pobarvana. Bravo!';
}
/* Maskota spregovori – kratek stavek in ustrezno razpoloženje. */
let namigCas = 0;
function povejMaskota(besedilo, razp){
  const el = $('namig'); if (!el) return;
  el.innerHTML = maskota(razp || 'pozdrav', 'velika') +
    '<div class="oblacek" id="namigText">' + esc(besedilo) + '</div>';
  clearTimeout(namigCas);
  namigCas = setTimeout(function(){
    const e2 = $('namig');
    if (e2) e2.innerHTML = maskota('pozdrav', 'velika') +
      '<div class="oblacek" id="namigText">' + esc(namigBesedilo()) + '</div>';
  }, 2600);
}

function razveljavi(){
  const zadnji = P.sklad.pop();
  if (!zadnji) return;
  if (zadnji.poteza){
    const p = P.poteze.pop();
    P.naprej.push({ poteza:1, p:p });
    izrisiPoteze(); shraniRisbo(); return;
  }
  /* shranimo tudi stanje PO potezi, da jo znamo znova uveljaviti */
  P.naprej.push(zadnji.map(function(x){ return { i:x.i, prej:x.prej, potem:P.barve[x.i] }; }));
  zadnji.forEach(function(x){ P.barve[x.i] = x.prej; nastaviBarvo(x.i); });
  osveziStanje();
  shraniTrenutno();
}
/* Uveljavi: vrne potezo, ki smo jo pravkar razveljavili. */
function uveljavi(){
  const zadnji = P.naprej.pop();
  if (!zadnji) return;
  if (zadnji.poteza){
    if (zadnji.p) P.poteze.push(zadnji.p);
    P.sklad.push({ poteza:1 });
    izrisiPoteze(); shraniRisbo(); return;
  }
  zadnji.forEach(function(x){ P.barve[x.i] = x.potem; nastaviBarvo(x.i); });
  P.sklad.push(zadnji.map(function(x){ return { i:x.i, prej:x.prej }; }));
  osveziStanje();
  shraniTrenutno(); preveriKonec();
}

function shraniTrenutno(){
  const prej = (S.trenutna && S.trenutna.id === P.s.id && S.trenutna.lv === P.lv) ? S.trenutna.risba : null;
  S.trenutna = { id:P.s.id, lv:P.lv, barve:P.barve.map(function(b){ return b || null; }), risba:prej };
  const o = odstotek();
  if (o > 0) S.napredek[P.s.id + ':' + P.lv] = o;
  else delete S.napredek[P.s.id + ':' + P.lv];
  shrani();
}

function preveriKonec(){
  if (prestej() < P.sl.R.length) return;
  S.koncane[P.s.id + ':' + P.lv] = 1;
  S.napredek[P.s.id + ':' + P.lv] = 100; shrani();
  zvokKonec(); konfeti();
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = '🎉'; document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 950);
  setTimeout(function(){
    $('modal').innerHTML = '<h3>Slika je pobarvana! 🎉</h3>' +
      pozdravBlok('Bravo! Vsa polja so pobarvana. Jo shraniva med tvoje slike?', 'veselo') +
      '<div style="max-width:260px;margin:0 auto">' +
        svgIz(P.sl, { barve:P.barve, pre:'k', dodatek:risbaPlast(jeRisba() ? risbaVURL(460) : null, P.sl) }) + '</div>' +
      '<div class="row"><button class="btn btn-acc" id="vGalerijo">🖼️ Shrani med moje slike</button>' +
      '<button class="btn" id="zapriModal">Zapri</button></div>';
    $('mask').hidden = false;
  }, 700);
}

/* ---------------------- dotik in miška ---------------------------------- */
function vezi(platno){
  platno.addEventListener('pointerdown', function(e){
    const t = e.target.closest('.obm');
    if (!t) return;
    risem = true; skladOb = P.sklad.length;
    pobarvaj(+t.getAttribute('data-i'));
  });
  platno.addEventListener('pointermove', function(e){
    if (!risem || S.nacin !== 'copic') return;
    e.preventDefault();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.classList && el.classList.contains('obm')) pobarvaj(+el.getAttribute('data-i'));
  });
}
window.addEventListener('pointerup', function(){
  if (!risem) return;
  risem = false;
  /* poteza s čopičem naj se razveljavi v enem koraku */
  if (P && P.sklad.length - skladOb > 1){
    const zdruzeno = [];
    while (P.sklad.length > skladOb) zdruzeno.unshift.apply(zdruzeno, P.sklad.pop());
    P.sklad.push(zdruzeno);
  }
});

}
function vGalerijo(){

function izvoziPNG(){

    const sc = 2, c = document.createElement('canvas');

    cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);

    if (jeRisba() && kanvas && kanvas.width){          /* poteze se z risbo množijo */

/* ---------------------- izbirnik barv (RGB) ------------------------------
   Barvna lestvica: vodoravno odtenek, navpično od svetle proti temni.
   Pod njo sivine, pod tem pa drsniki R, G in B za natančno nastavitev.   */
function vHex(r, g, b){
  const d = v => ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2);
  return '#' + d(r) + d(g) + d(b);
}
function izHex(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function odpriIzbirnik(){
  const zac = (S.barva && S.barva.charAt(0) === '#') ? S.barva : '#e63946';
  $('modal').innerHTML =
    '<h3>🎨 Svoja barva</h3>' +
    '<p style="margin-bottom:10px">Tapni barvo na lestvici ali natančno nastavi z drsniki.</p>' +
    '<canvas id="lestvica" width="600" height="260"></canvas>' +
    '<canvas id="sivine" width="600" height="52"></canvas>' +
    '<div class="rgb"><label style="color:#c1121f">R</label>' +
      '<input type="range" id="sR" min="0" max="255"><output id="oR"></output></div>' +
    '<div class="rgb"><label style="color:#1a7f37">G</label>' +
      '<input type="range" id="sG" min="0" max="255"><output id="oG"></output></div>' +
    '<div class="rgb"><label style="color:#1560bd">B</label>' +
      '<input type="range" id="sB" min="0" max="255"><output id="oB"></output></div>' +
    '<div class="pregled"><span class="kvad" id="pregledK"></span><span class="hex" id="pregledH"></span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn btn-acc" id="uporabiBarvo">Uporabi</button>' +
      '<button class="btn" id="zapriModal">Zapri</button></div>' +
    (S.mojeBarve.length ? '<h3 style="margin:16px 0 8px;font-size:17px">Moje barve</h3>' +
      '<div class="pal" style="justify-content:flex-start">' + S.mojeBarve.map(function(b){
        return '<button class="sw" data-mojaBarva="' + b + '" style="background:' + b + '" title="' + b + '"></button>';
      }).join('') + '</div>' : '');
  $('mask').hidden = false;

  const les = $('lestvica'), lc = les.getContext('2d');
  const odt = lc.createLinearGradient(0, 0, les.width, 0);
  ['#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#ff0000']
    .forEach(function(b, i){ odt.addColorStop(i/6, b); });
  lc.fillStyle = odt; lc.fillRect(0, 0, les.width, les.height);
  const nav = lc.createLinearGradient(0, 0, 0, les.height);
  nav.addColorStop(0, 'rgba(255,255,255,1)');
  nav.addColorStop(0.5, 'rgba(255,255,255,0)');
  nav.addColorStop(0.5, 'rgba(0,0,0,0)');
  nav.addColorStop(1, 'rgba(0,0,0,1)');
  lc.fillStyle = nav; lc.fillRect(0, 0, les.width, les.height);

  const siv = $('sivine'), sc = siv.getContext('2d');
  const sg = sc.createLinearGradient(0, 0, siv.width, 0);
  sg.addColorStop(0, '#000000'); sg.addColorStop(1, '#ffffff');
  sc.fillStyle = sg; sc.fillRect(0, 0, siv.width, siv.height);

  let barva = zac;
  function pokazi(){
    const rgb = izHex(barva);
    $('sR').value = rgb[0]; $('sG').value = rgb[1]; $('sB').value = rgb[2];
    $('oR').textContent = rgb[0]; $('oG').textContent = rgb[1]; $('oB').textContent = rgb[2];
    $('sR').style.setProperty('--tr', 'linear-gradient(90deg,' + vHex(0,rgb[1],rgb[2]) + ',' + vHex(255,rgb[1],rgb[2]) + ')');
    $('sG').style.setProperty('--tr', 'linear-gradient(90deg,' + vHex(rgb[0],0,rgb[2]) + ',' + vHex(rgb[0],255,rgb[2]) + ')');
    $('sB').style.setProperty('--tr', 'linear-gradient(90deg,' + vHex(rgb[0],rgb[1],0) + ',' + vHex(rgb[0],rgb[1],255) + ')');
    $('pregledK').style.background = barva;
    $('pregledH').textContent = barva.toUpperCase();
  }
  function izPlatna(el, e){
    const c = el.getContext('2d'), r = el.getBoundingClientRect();
    const x = Math.max(0, Math.min(el.width - 1, Math.round((e.clientX - r.left) / r.width * el.width)));
    const y = Math.max(0, Math.min(el.height - 1, Math.round((e.clientY - r.top) / r.height * el.height)));
    const d = c.getImageData(x, y, 1, 1).data;
    barva = vHex(d[0], d[1], d[2]); pokazi();
  }
  [les, siv].forEach(function(el){
    let drzi = false;
    el.addEventListener('pointerdown', function(e){ drzi = true; el.setPointerCapture(e.pointerId); izPlatna(el, e); });
    el.addEventListener('pointermove', function(e){ if (drzi){ e.preventDefault(); izPlatna(el, e); } });
    el.addEventListener('pointerup', function(){ drzi = false; });

  ['sR','sG','sB'].forEach(function(id){

  $('uporabiBarvo').addEventListener('click', function(){
    S.barva = barva;
    S.mojeBarve = [barva].concat(S.mojeBarve.filter(function(b){ return b !== barva; })).slice(0, 12);
    shrani(); $('mask').hidden = true;
    if (P) izrisiPlatno();
  });
  pokazi();
}

document.addEventListener('click', function(e){
  const g = e.target.closest('[data-brisi]');
  if (g){ S.galerija.splice(+g.getAttribute('data-brisi'), 1); shrani(); odpriGalerijo(); return; }
  const kart = e.target.closest('[data-gal]');

    const x = S.galerija[+kart.getAttribute('data-gal')];
    $('mask').hidden = true;
    if (x){ S.trenutna = { id:x.id, lv:x.lv, barve:x.barve, risba:x.risba || null }; shrani(); odpri(x.id, x.lv); }

  }
  const b = e.target.closest('button');

<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barvica – pobarvanka</title>
<meta name="description" content="Interaktivna pobarvanka z več načini barvanja, stopnjami zahtevnosti in temami – od otroških do zahtevnejših vzorcev.">
<!-- pisava se naloži ob strani: če je omrežje počasno ali ga ni, se stran izriše
     takoj s sistemsko pisavo in ne čaka -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      media="print" onload="this.media='all'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2f2a26; --ink-soft:#7a6f66;
  --card:#ffffff; --line:#ece5dd;
  --acc:#ff7a45; --acc-d:#e05a26;
  --ok:#1eb872; --ok-d:#159a5e;
  --pop:#12a5a5;
  --r:20px;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{
  font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:#fbf7f2;
  background-image:
    radial-gradient(900px 600px at 0% -10%, #ffe9dc 0%, transparent 60%),
    radial-gradient(700px 520px at 100% 0%, #e2f6f4 0%, transparent 55%);
  background-attachment:fixed;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

.wrap{
  max-width:900px;margin:0 auto;
  padding:calc(14px + var(--top)) calc(14px + env(safe-area-inset-right,0px))
          calc(24px + var(--bot)) calc(14px + env(safe-area-inset-left,0px));
}

/* ---------- glava ---------- */
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900}
.brand .em{font-size:30px}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);
  display:grid;place-items:center;font-size:20px;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.icon-btn[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;
  border-radius:15px;padding:11px 16px;font-weight:900;font-size:16px;line-height:1;
  box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}
.btn-acc:active{box-shadow:0 1px 0 var(--acc-d)}
.btn[disabled]{opacity:.42;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 8px 22px rgba(47,42,38,.09)}
.lead{margin:0 0 12px;font-weight:700;color:var(--ink-soft);font-size:15.5px;line-height:1.5}
h2.sec{font-size:16px;margin:18px 4px 9px;font-weight:900;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase}

/* ---------- izbirniki ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border-radius:999px;padding:9px 15px;font-weight:900;font-size:15px;
  box-shadow:0 4px 0 var(--line);white-space:nowrap}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #17130f}
.chip .k{opacity:.65;font-weight:800;font-size:13px;margin-left:3px}

.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lvl{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-weight:900;font-size:13.5px;
  box-shadow:0 4px 0 var(--line);line-height:1.25}
.lvl b{display:block;font-size:19px}
.lvl[aria-pressed="true"]{background:var(--pop);color:#fff;box-shadow:0 4px 0 #0c8080}
.lvl:active{transform:translateY(3px)}

/* ---------- mreža slik ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.pic{background:#fff;border-radius:18px;padding:10px 10px 12px;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.pic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.pic svg{width:100%;height:auto;display:block;border-radius:12px;background:#fff}
.pic .nm{font-weight:900;font-size:15px;text-align:center}
.pic .meta{font-weight:800;font-size:12px;color:var(--ink-soft);text-align:center}
.pic .done{position:absolute;top:8px;right:9px;font-size:17px}

/* ---------- barvanje ---------- */
.stage{background:#fff;border-radius:var(--r);padding:10px;box-shadow:0 8px 22px rgba(47,42,38,.10);
  display:flex;justify-content:center;align-items:center}
/* platno s potezami leži NAD črtno risbo in se z njo množi – tako ostanejo
   črte vidne skozi barvo, tako kot voščenka na natisnjeni pobarvanki */
.platno{position:relative;isolation:isolate;width:100%;line-height:0}
#risba{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:multiply}
.platno.risem #risba{pointer-events:auto;touch-action:none}
.platno.risem svg{pointer-events:none}
.stage svg{width:100%;height:auto;max-height:min(64vh,620px);display:block;touch-action:manipulation}
/* barvo in obrobo zapiše sama slika (atributa fill/stroke); tu jih namenoma
   ne nastavljamo, ker bi lastnost CSS premagala atribut in bi polja ostala bela */
.obm{cursor:pointer;transition:fill .12s ease}
.obm.plain{transition:none}
.ln{pointer-events:none}
.num{font-size:11px;font-weight:900;fill:#8a8078;text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none}
.obm.zmota{animation:zm .34s}
@keyframes zm{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- orodja ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.modes{display:flex;gap:7px;flex-wrap:wrap}
.mode{background:#fff;border-radius:14px;padding:9px 13px;font-weight:900;font-size:14.5px;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;gap:6px}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}

.pal{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;justify-content:center}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 0 0 3px #fff;
  position:relative}
.sw:active{transform:translateY(2px)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink), inset 0 0 0 3px #fff}
.sw .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.sw.guma{background:#fff;box-shadow:0 3px 0 var(--line), inset 0 0 0 3px #fff;font-size:20px;
  display:grid;place-items:center}
.sw.guma[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink), inset 0 0 0 3px #fff}

.palrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.palpick{background:#fff;border-radius:999px;padding:7px 13px;font-weight:900;font-size:13.5px;
  box-shadow:0 3px 0 var(--line)}
.palpick[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #17130f}

.hint{margin-top:10px;background:#fff6ee;border-radius:15px;padding:11px 14px;font-weight:800;
  font-size:14.5px;line-height:1.5;box-shadow:inset 0 0 0 3px #ffe0cc;color:#8a5030}

/* ---------- izbirnik barv ---------- */
#lestvica,#sivine{width:100%;display:block;border-radius:14px;box-shadow:inset 0 0 0 3px var(--line);
  touch-action:none;cursor:crosshair}
#sivine{margin-top:8px}
.rgb{display:grid;grid-template-columns:22px 1fr 52px;gap:10px;align-items:center;margin-top:10px}
.rgb label{font-weight:900;font-size:15px}
.rgb input[type=range]{width:100%;height:26px;-webkit-appearance:none;background:transparent}
.rgb input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:var(--tr)}
.rgb input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-top:-7px}
.rgb input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:var(--tr)}
.rgb input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rgb output{font-weight:900;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.pregled{display:flex;align-items:center;gap:12px;margin-top:12px}
.pregled .kvad{width:64px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.pregled .hex{font-weight:900;font-size:19px;letter-spacing:.5px}

/* ---------- galerija ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gal .pic{box-shadow:0 5px 0 var(--line)}
.gal .del{position:absolute;top:6px;left:7px;font-size:15px;background:rgba(255,255,255,.9);
  border-radius:999px;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* ---------- modalno ---------- */
.mask{position:fixed;inset:0;background:rgba(40,32,26,.6);display:grid;place-items:center;padding:16px;z-index:50}
.mask[hidden]{display:none}
.modal{background:#fff;border-radius:24px;padding:20px;max-width:520px;width:100%;max-height:86dvh;
  overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.modal h3{margin:0 0 10px;font-size:22px}
.modal p{margin:0 0 14px;font-weight:700;color:var(--ink-soft);line-height:1.5}
.modal img{max-width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:76px;pointer-events:none;
  animation:pp .9s ease-out forwards;z-index:60}
@keyframes pp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-95%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){
  .brand{font-size:20px}.sw{width:40px;height:40px}
  .levels{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="em">🎨</span><span>Barvica</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="galBtn" title="Moje slike" aria-label="Moje slike">🖼️</button>
    <button class="icon-btn" id="soundBtn" title="Zvok" aria-label="Zvok">🔊</button>
  </div>

  <section id="scrIzbira">
    <div class="card">
      <p class="lead">Izberi sliko in jo pobarvaj. Nič ni narobe – barve lahko kadar koli zamenjaš.</p>
    </div>
  </section>

  <section id="scrBarvanje" hidden></section>
</div>

<div class="mask" id="mask" hidden><div class="modal" id="modal"></div></div>

<script>
/* =========================================================================
   BARVICA – pobarvanka za otroke in odrasle
   Slike se sestavljajo iz oblik v kodi, zato jih je mogoče risati v več
   stopnjah podrobnosti: ista slika ima lahko 8 ali 80 polj za barvanje.
   ========================================================================= */

/* ===================== ČISTA LOGIKA – ZAČETEK =========================== */

/* ---------------------- naključje z zrnom -------------------------------
   Ista slika mora vsakič izgledati enako, zato ne uporabljamo Math.random. */
function zrno(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function nak(seed){
  let a = seed >>> 0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------------- oblike ------------------------------------------ */
const f1 = n => Math.round(n * 10) / 10;
function polyD(P, closed){
  let d = 'M' + f1(P[0][0]) + ' ' + f1(P[0][1]);
  for (let i=1;i<P.length;i++) d += 'L' + f1(P[i][0]) + ' ' + f1(P[i][1]);
  return d + (closed === false ? '' : 'Z');
}
/* gladka krivulja skozi točke (Catmull-Rom → Bézier) */
function smoothD(P, closed, nap){
  nap = nap == null ? 1 : nap;
  const n = P.length;
  if (n < 3) return polyD(P, closed);
  const tc = i => closed ? P[(i % n + n) % n] : P[Math.max(0, Math.min(n-1, i))];
  let d = 'M' + f1(P[0][0]) + ' ' + f1(P[0][1]);
  const zad = closed ? n : n - 1;
  for (let i=0;i<zad;i++){
    const p0 = tc(i-1), p1 = tc(i), p2 = tc(i+1), p3 = tc(i+2);
    const c1x = p1[0] + (p2[0]-p0[0])/6*nap, c1y = p1[1] + (p2[1]-p0[1])/6*nap;
    const c2x = p2[0] - (p3[0]-p1[0])/6*nap, c2y = p2[1] - (p3[1]-p1[1])/6*nap;
    d += 'C' + f1(c1x) + ' ' + f1(c1y) + ',' + f1(c2x) + ' ' + f1(c2y) + ',' + f1(p2[0]) + ' ' + f1(p2[1]);
  }
  return d + (closed ? 'Z' : '');
}
function svetleje(hex, k){
  const n = parseInt(hex.slice(1), 16), o = v => Math.max(0, Math.min(255, v + k));
  const r = o((n >> 16) & 255), g = o((n >> 8) & 255), b = o(n & 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const el = (cx,cy,rx,ry,rot) => ({ t:'e', cx, cy, rx, ry, rot: rot||0 });
const ci = (cx,cy,r) => el(cx,cy,r,r,0);
const re = (x,y,w,h,r) => ({ t:'r', x, y, w, h, r: r||0 });
const po = P => ({ t:'p', d: polyD(P) });
const bl = (P,nap) => ({ t:'p', d: smoothD(P, true, nap) });
const cr = (P,nap) => ({ t:'p', d: smoothD(P, false, nap) });   /* odprta črta */
const pa = d => ({ t:'p', d });

/* trak vzdolž krivulje – repi, stebla, roke, kite */
function trak(spine, w0, w1, nap){
  const n = spine.length, L = [], D = [];
  for (let i=0;i<n;i++){
    const p = spine[i];
    const a = spine[Math.max(0,i-1)], b = spine[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const dl = Math.hypot(dx,dy) || 1; dx/=dl; dy/=dl;
    const w = (w0 + (w1-w0) * (i/(n-1))) / 2;
    L.push([p[0] - dy*w, p[1] + dx*w]);
    D.push([p[0] + dy*w, p[1] - dx*w]);
  }
  const P = L.concat(D.reverse());
  return { t:'p', d: smoothD(P, true, nap == null ? .7 : nap) };
}

/* zrcaljenje in vrtenje točk */
const zrcali = (P, os) => P.map(p => [2*os - p[0], p[1]]);
function vrti(P, cx, cy, kot){
  const c = Math.cos(kot), s = Math.sin(kot);
  return P.map(function(p){
    const x = p[0]-cx, y = p[1]-cy;
    return [cx + x*c - y*s, cy + x*s + y*c];
  });
}
function zvezda(cx, cy, r, kraki, notr){
  const P = [];
  for (let i=0;i<kraki*2;i++){
    const a = -Math.PI/2 + i * Math.PI / kraki;
    const rr = i % 2 ? r*notr : r;
    P.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]);
  }
  return po(P);
}

/* ---------------------- gradniki slike -----------------------------------
   obm(): polje, ki ga otrok pobarva. c = barva, kot si jo je zamislil risar
   (uporabi se pri barvanju po številkah in pri gumbu »pokaži predlog«).
   sym: polja z isto oznako se pri simetričnem načinu pobarvajo skupaj.
   rez: polje se obreže na dano obliko (npr. proge znotraj telesa).         */
function obm(s, c, o){ o = o || {}; return { s:s, c:c, sym:o.sym, rez:o.rez, lp:o.lp }; }
function crt(s, w){ return { s:s, w: w || 2.2 }; }

/* ---------------------- barvne palete ------------------------------------ */
const PALETE = {
  osnovne: { nm:'Osnovne', b:['#e63946','#f77f00','#ffd60a','#43aa8b','#118ab2','#5b6cff','#9d4edd',
    '#ff70a6','#8b5e34','#2f3e46','#ffffff','#c9d6df'] },
  pastelne: { nm:'Pastelne', b:['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff',
    '#ffc6ff','#f4e4c1','#e8e8e4','#ffffff','#b8b8d1'] },
  zemeljske:{ nm:'Zemeljske', b:['#7f4f24','#a68a64','#c2b280','#606c38','#283618','#bc6c25',
    '#dda15e','#8a5a44','#4a4e69','#22333b','#f2e8cf','#9c6644'] },
  neon:     { nm:'Neon', b:['#ff006e','#fb5607','#ffbe0b','#8ac926','#00f5d4','#00bbf9','#9b5de5',
    '#f15bb5','#ff4d6d','#39ff14','#ffffff','#1a1a2e'] },
  narava:   { nm:'Narava', b:['#386641','#6a994e','#a7c957','#f2e8cf','#bc4749','#e07a5f','#3d5a80',
    '#98c1d9','#e0fbfc','#5e503f','#c1a57b','#ffffff'] }
};

/* ---------------------- izris slike v SVG -------------------------------- */
function elemIz(s, atts){
  if (s.t === 'e'){
    const r = s.rot ? ' transform="rotate(' + f1(s.rot*180/Math.PI) + ' ' + f1(s.cx) + ' ' + f1(s.cy) + ')"' : '';
    return '<ellipse cx="' + f1(s.cx) + '" cy="' + f1(s.cy) + '" rx="' + f1(s.rx) + '" ry="' + f1(s.ry) + '"' + r + ' ' + atts + '/>';
  }
  if (s.t === 'r')
    return '<rect x="' + f1(s.x) + '" y="' + f1(s.y) + '" width="' + f1(s.w) + '" height="' + f1(s.h) +
           '" rx="' + f1(s.r) + '" ' + atts + '/>';
  return '<path d="' + s.d + '" ' + atts + '/>';
}
/* barve: polje barv po indeksu območja; stevilke: izpiši številke (barvanje po številkah) */
function svgIz(sl, o){
  o = o || {};
  const barve = o.barve || [], deb = o.deb || 2.2;
  let defs = '', telo = '';
  sl.R.forEach(function(ob, i){
    /* obroba je zapisana v sami sliki, ne le v CSS: tako je vidna tudi v
       sličicah in pri izvozu v PNG, kjer slogov strani ni. */
    let polnilo = barve[i] || '#fff';
    if (polnilo.indexOf('preliv:') === 0){
      const hex = polnilo.slice(7), gid = 'pr' + i + (o.pre || '');
      defs += '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="' + svetleje(hex, 70) + '"/>' +
        '<stop offset="1" stop-color="' + hex + '"/></linearGradient>';
      polnilo = 'url(#' + gid + ')';
    }
    let atts = 'class="obm' + (o.plain ? ' plain' : '') + '" data-i="' + i + '" fill="' + polnilo +
      '" stroke="#241f1b" stroke-width="' + deb + '" stroke-linejoin="round"';
    if (ob.rez){
      const id = 'rez' + i + (o.pre || '');
      defs += '<clipPath id="' + id + '">' + elemIz(ob.rez, '') + '</clipPath>';
      atts += ' clip-path="url(#' + id + ')"';
    }
    telo += elemIz(ob.s, atts);
  });
  let crte = '';
  (sl.L || []).forEach(function(c){
    crte += elemIz(c.s, 'class="ln" fill="none" stroke="#241f1b" stroke-width="' + (c.w || deb) +
      '" stroke-linecap="round" stroke-linejoin="round"');
  });
  return '<svg viewBox="0 0 ' + sl.w + ' ' + sl.h + '" xmlns="http://www.w3.org/2000/svg">' +
    (defs ? '<defs>' + defs + '</defs>' : '') + telo + crte + (o.dodatek || '') + '</svg>';
}

/* ======================= SLIKE ========================================== */
/* Vsaka slika je funkcija stopnje (1–5): več kot je stopnja, več je polj.  */
const SLIKE = [];

/* Groba očrtna škatla oblike – za iskanje največjih polj. */
function pribBBox(s){
  if (s.t === 'e') return [s.cx - s.rx, s.cy - s.ry, s.rx*2, s.ry*2];
  if (s.t === 'r') return [s.x, s.y, s.w, s.h];
  const n = s.d.match(/-?\d+(\.\d+)?/g) || [];
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for (let i=0; i+1 < n.length; i += 2){
    const x = +n[i], y = +n[i+1];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return x1 > x0 ? [x0, y0, x1-x0, y1-y0] : [0,0,0,0];
}
/* Če višja stopnja sama po sebi ne doda polj, sliko obogatimo z okrasnimi
   pikami v njenih največjih poljih. Pike se vrinejo TAKOJ ZA svojim poljem,
   da ne prekrijejo oči in drugih podrobnosti, ki se rišejo pozneje.        */
function dodajPodrobnosti(sl, id, lv, koliko){
  const r = nak(zrno(id + ':' + lv));
  const kand = sl.R.map(function(o, i){
    const bb = pribBBox(o.s);
    return { i:i, o:o, bb:bb, a:bb[2]*bb[3] };
  }).filter(function(k){
    return !k.o.rez && k.bb[2] > 34 && k.bb[3] > 34 && /^#[0-9a-f]{6}$/i.test(k.o.c || '');
  }).sort(function(a, b){ return b.a - a.a; }).slice(0, 6);
  if (!kand.length) return;
  const vrini = [];
  for (let j = 0; j < koliko; j++){
    const k = kand[j % kand.length], bb = k.bb;
    const kot = r() * Math.PI * 2, odd = 0.16 + r() * 0.16;
    const x = bb[0] + bb[2] * (0.5 + Math.cos(kot) * odd);
    const y = bb[1] + bb[3] * (0.5 + Math.sin(kot) * odd);
    const rr = Math.max(6, Math.min(bb[2], bb[3]) * (0.09 + r() * 0.06));
    vrini.push({ i:k.i, o:obm(ci(x, y, rr), svetleje(k.o.c, j % 2 ? 38 : -34), { rez:k.o.s }) });
  }
  vrini.sort(function(a, b){ return b.i - a.i; });
  vrini.forEach(function(v){ sl.R.splice(v.i + 1, 0, v.o); });
}
function slika(id, nm, tema, stopnje, gradi){
  /* Primerjamo se s POLNO prejšnjo stopnjo (tudi če je bila sama obogatena),
     sicer bi višja stopnja lahko imela manj polj od nižje. */
  const polna = function(lv){
    const sl = gradi(lv);
    const k = stopnje.indexOf(lv);
    if (k > 0){
      const prej = polna(stopnje[k-1]).R.length;
      if (sl.R.length <= prej) dodajPodrobnosti(sl, id, lv, prej - sl.R.length + 2 + k * 2);
    }
    return sl;
  };
  SLIKE.push({ id:id, nm:nm, tema:tema, stopnje:stopnje, gradi:polna });
}

slika('mandala','Mandala','vzorci', [1,2,3,4,5], function(lv){
  const R = [], L = [];
  const cx = 170, cy = 170, rmax = 156;
  const obroci = [3,4,5,6,7][lv-1];
  const seg = [8,10,12,16,20][lv-1];
  const bp = ['#e63946','#f77f00','#ffd60a','#43aa8b','#118ab2','#7c5cff','#ff70a6','#06d6a0'];
  const tocka = (r,a) => [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  function kolut(r1,r2,a1,a2){
    const A = tocka(r2,a1), B = tocka(r2,a2), C = tocka(r1,a2), D = tocka(r1,a1);
    return pa('M' + f1(A[0]) + ' ' + f1(A[1]) + 'A' + f1(r2) + ' ' + f1(r2) + ' 0 0 1 ' + f1(B[0]) + ' ' + f1(B[1]) +
      'L' + f1(C[0]) + ' ' + f1(C[1]) + 'A' + f1(r1) + ' ' + f1(r1) + ' 0 0 0 ' + f1(D[0]) + ' ' + f1(D[1]) + 'Z');
  }
  const r0 = 26, sirina = (rmax - r0) / obroci;
  for (let o=0;o<obroci;o++){
    const r1 = r0 + o*sirina, r2 = r0 + (o+1)*sirina;
    for (let i=0;i<seg;i++){
      const a1 = i*2*Math.PI/seg - Math.PI/2, a2 = (i+1)*2*Math.PI/seg - Math.PI/2, am = (a1+a2)/2;
      const sym = 'o' + o + '_' + (i % 2);
      if (o % 2 === 0){
        R.push(obm(kolut(r1, r2, a1, a2), bp[(o + i) % bp.length], { sym:sym }));
      } else {
        const d = (a2 - a1) * .18;
        const P = [tocka(r1 + 2, am), tocka((r1+r2)/2, a1 + d), tocka(r2 - 1, am), tocka((r1+r2)/2, a2 - d)];
        R.push(obm(bl(P, .95), bp[(o + i + 3) % bp.length], { sym:sym }));
      }
    }
  }
  R.push(obm(ci(cx,cy,r0), bp[2]));
  if (lv >= 3){
    const n = seg >= 16 ? 8 : 6;
    for (let i=0;i<n;i++){
      const a = i*2*Math.PI/n;
      R.push(obm(ci(cx + Math.cos(a)*14, cy + Math.sin(a)*14, 7), bp[(i+1) % bp.length], { sym:'sr' + (i%2) }));
    }
  }
  return { w:340, h:340, R:R, L:L };
});

/* ======================= ZA ODRASLE =====================================
   Zahtevnejši, meditativni vzorci z veliko drobnimi polji. Vsi so risani
   iz kroga ali mreže, zato jih stopnja lahko poljubno zgosti.            */
const BP_ODR = ['#e63946','#f77f00','#ffd60a','#43aa8b','#118ab2','#7c5cff','#ff70a6','#06d6a0',
                '#bc4749','#e07a3f','#3a86ff','#8338ec'];
function tocka(cx, cy, r, a){ return [cx + Math.cos(a)*r, cy + Math.sin(a)*r]; }
function kolobar(cx, cy, r1, r2, a1, a2){
  const A = tocka(cx,cy,r2,a1), B = tocka(cx,cy,r2,a2), C = tocka(cx,cy,r1,a2), D = tocka(cx,cy,r1,a1);
  return pa('M' + f1(A[0]) + ' ' + f1(A[1]) + 'A' + f1(r2) + ' ' + f1(r2) + ' 0 0 1 ' + f1(B[0]) + ' ' + f1(B[1]) +
    'L' + f1(C[0]) + ' ' + f1(C[1]) + 'A' + f1(r1) + ' ' + f1(r1) + ' 0 0 0 ' + f1(D[0]) + ' ' + f1(D[1]) + 'Z');
}
function listek(cx, cy, r1, r2, a1, a2, nap){
  const am = (a1+a2)/2, d = (a2-a1)*0.2;
  return bl([tocka(cx,cy,r1,am), tocka(cx,cy,(r1+r2)/2,a1+d), tocka(cx,cy,r2,am), tocka(cx,cy,(r1+r2)/2,a2-d)], nap || .95);
}

slika('lotos','Lotosova mandala','odrasli',[1,2,3,4,5], function(lv){
  const R=[],L=[];
  const cx=190, cy=190, R0=176;
  const plasti=[3,4,5,6,7][lv-1], listov=[8,12,16,20,24][lv-1];
  R.push(obm(ci(cx,cy,R0), '#faf3e6'));
  for (let p=plasti-1;p>=0;p--){
    const r1 = 34 + p*((R0-34)/plasti), r2 = 34 + (p+1)*((R0-34)/plasti);
    const n = p % 2 ? Math.round(listov*0.75) : listov;
    for (let i=0;i<n;i++){
      const a1 = i*2*Math.PI/n + (p%2)*(Math.PI/n);
      R.push(obm(listek(cx,cy,r1,r2,a1,a1+2*Math.PI/n), BP_ODR[(p*3+i)%BP_ODR.length], { sym:'p'+p+'_'+(i%2) }));
      if (p >= plasti-2 && lv >= 3)
        R.push(obm(listek(cx,cy,r1+(r2-r1)*0.25,r1+(r2-r1)*0.75,a1+0.05,a1+2*Math.PI/n-0.05),
          BP_ODR[(p*3+i+5)%BP_ODR.length], { sym:'v'+p+'_'+(i%2) }));
    }
  }
  for (let i=0;i<listov;i++){
    const a1 = i*2*Math.PI/listov;
    R.push(obm(listek(cx,cy,12,34,a1,a1+2*Math.PI/listov), BP_ODR[(i+2)%BP_ODR.length], { sym:'sr'+(i%2) }));
  }
  R.push(obm(ci(cx,cy,12), '#ffd60a'));
  return { w:380, h:380, R:R, L:L };
});

slika('zentangle','Zentangle','odrasli',[2,3,4,5], function(lv){
  const R=[],L=[];
  const W=360, H=360, st=[0,0,3,4,5,6][lv], c=W/st;
  const r=nak(zrno('zentangle'+lv));
  R.push(obm(re(0,0,W,H,0), '#faf6ee'));
  for (let a=0;a<st;a++)
    for (let b=0;b<st;b++){
      const x=b*c, y=a*c, celica = re(x+3,y+3,c-6,c-6,10);
      R.push(obm(celica, '#f7f0e2'));
      const vzorec = Math.floor(r()*4);
      if (vzorec === 0){                                  /* koncentrični loki */
        for (let k=5;k>=1;k--)
          R.push(obm(ci(x+c*0.5, y+c*0.5, c*0.09*k), BP_ODR[(a+b+k)%BP_ODR.length], { rez:celica }));
      } else if (vzorec === 1){                           /* proge */
        for (let k=0;k<6;k++)
          R.push(obm(re(x+3+k*(c-6)/6, y+3, (c-6)/6, c-6, 0), BP_ODR[(a*2+b+k)%BP_ODR.length], { rez:celica }));
      } else if (vzorec === 2){                           /* mreža kroglic */
        for (let m=0;m<3;m++) for (let n=0;n<3;n++)
          R.push(obm(ci(x+c*(0.22+m*0.28), y+c*(0.22+n*0.28), c*0.11), BP_ODR[(a+b+m+n)%BP_ODR.length], { rez:celica }));
      } else {                                            /* listi iz kota */
        for (let k=0;k<5;k++)
          R.push(obm(listek(x+4, y+4, c*0.2*k+6, c*0.2*(k+1)+6, 0, Math.PI/2, .9),
            BP_ODR[(a+b*2+k)%BP_ODR.length], { rez:celica }));
      }
    }
  return { w:W, h:H, R:R, L:L };
});

      const obrni = (a+b)%2 ? -1 : 1;

          [x-obrni*m*0.1*f, y+m*0.86*f],[x-obrni*m*0.62*f, y+m*0.3*f],[x-obrni*m*0.3*f, y-m*0.56*f]], .95),
          BP_ODR[(a*2+b+k*3)%BP_ODR.length], { rez:kaplja }));
      }
      const pik = lv >= 4 ? 7 : 5;
      for (let k=0;k<pik;k++){

slika('ornamentalnimetulj','Ornamentalni metulj','odrasli',[2,3,4,5], function(lv){

let AC = null;
function pisk(fr, dur, tip){
  if (!S.zvok) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    fr.forEach(function(f, i){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = tip || 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(AC.destination);
      const t = AC.currentTime + i*(dur*0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    });
  } catch(e){}
}

function stopnjaZa(sl, zel){
  let best = sl.stopnje[0];
  sl.stopnje.forEach(function(l){ if (Math.abs(l - zel) < Math.abs(best - zel)) best = l; });
  return best;
}

  sl.R.forEach(function(o){ if (o.c && !vid[o.c]){ vid[o.c] = 1; vrsta.push(o.c); } });
  return vrsta;
}

/* številke se postavijo v središče polja, majhna polja jih ne dobijo */
function dodajStevilke(platno){
  const stev = {};
  P.predlog.forEach(function(b, i){ stev[b] = i + 1; });
  P.sl.R.forEach(function(ob, i){
    const el = platno.querySelector('[data-i="' + i + '"]');
    if (!el || !ob.c) return;
    let bb; try { bb = el.getBBox(); } catch(e){ return; }
    if (bb.width < 15 || bb.height < 13) return;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'num');
    t.setAttribute('x', bb.x + bb.width/2);
    t.setAttribute('y', bb.y + bb.height/2);
    t.setAttribute('data-num', i);
    t.textContent = stev[ob.c];
    platno.appendChild(t);
  });
}

function prestej(){ return P.barve.filter(function(b){ return !!b; }).length; }

function gradId(platno, hex){
  const id = 'g' + hex.slice(1);
  if (!platno.querySelector('#' + id)){
    let defs = platno.querySelector('defs');
    if (!defs){ defs = document.createElementNS(NS,'defs'); platno.insertBefore(defs, platno.firstChild); }
    const lg = document.createElementNS(NS,'linearGradient');
    lg.setAttribute('id', id); lg.setAttribute('x1','0'); lg.setAttribute('y1','0');
    lg.setAttribute('x2','0'); lg.setAttribute('y2','1');
    [[0, svetleje(hex,70)],[1, hex]].forEach(function(p){
      const st = document.createElementNS(NS,'stop');
      st.setAttribute('offset', p[0]); st.setAttribute('stop-color', p[1]);
      lg.appendChild(st);
    });
    defs.appendChild(lg);
  }
  return id;
}
function nastaviBarvo(i){
  const platno = $('stage').querySelector('svg');
  const el = platno.querySelector('[data-i="' + i + '"]');
  if (!el) return;
  const b = P.barve[i];
  if (!b){ el.setAttribute('fill', '#fff'); return; }
  if (b.indexOf('preliv:') === 0) el.setAttribute('fill', 'url(#' + gradId(platno, b.slice(7)) + ')');
  else el.setAttribute('fill', b);
}

function pobarvaj(i){
  if (!P || !P.sl.R[i]) return;
  const ob = P.sl.R[i];
  if (S.nacin === 'stev'){
    if (S.barva !== ob.c){
      const el = $('stage').querySelector('[data-i="' + i + '"]');
      if (el){ el.classList.add('zmota'); setTimeout(function(){ el.classList.remove('zmota'); }, 360); }
      zvokNapak(); return;
    }
  }
  let ciljne = [i];
  if (S.nacin === 'sim' && ob.sym)
    ciljne = P.sl.R.map(function(o, j){ return o.sym === ob.sym ? j : -1; }).filter(function(j){ return j >= 0; });
  let barva = S.barva;
  if (S.nacin === 'stev') barva = ob.c;
  else if (barva === 'guma') barva = null;
  else if (S.nacin === 'preliv') barva = 'preliv:' + barva;
  const sprem = [];
  ciljne.forEach(function(j){
    if (P.barve[j] !== barva){ sprem.push({ i:j, prej:P.barve[j] }); P.barve[j] = barva || undefined; }
  });
  if (!sprem.length) return;
  P.sklad.push(sprem);
  sprem.forEach(function(x){ nastaviBarvo(x.i); });
  const st = $('stanje'); if (st) st.textContent = prestej();
  zvokBarva(); shraniTrenutno(); preveriKonec();
}

function razveljavi(){
  const zadnji = P.sklad.pop();
  if (!zadnji) return;
  if (zadnji.poteza){ P.poteze.pop(); izrisiPoteze(); shraniRisbo(); return; }
  zadnji.forEach(function(x){ P.barve[x.i] = x.prej; nastaviBarvo(x.i); });
  const st = $('stanje'); if (st) st.textContent = prestej();
  shraniTrenutno();
}

function shraniTrenutno(){
  const prej = (S.trenutna && S.trenutna.id === P.s.id && S.trenutna.lv === P.lv) ? S.trenutna.risba : null;
  S.trenutna = { id:P.s.id, lv:P.lv, barve:P.barve.map(function(b){ return b || null; }), risba:prej };
  shrani();
}

function preveriKonec(){
  if (prestej() < P.sl.R.length) return;
  S.koncane[P.s.id + ':' + P.lv] = 1; shrani();
  zvokKonec();
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = '🎉'; document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 950);
  setTimeout(function(){
    $('modal').innerHTML = '<h3>Slika je pobarvana! 🎉</h3>' +
      '<p>Lepo si jo naredil. Jo shraniva med tvoje slike?</p>' +
      '<div style="max-width:260px;margin:0 auto">' +
        svgIz(P.sl, { barve:P.barve, pre:'k', dodatek:risbaPlast(jeRisba() ? risbaVURL(460) : null, P.sl) }) + '</div>' +
      '<div class="row"><button class="btn btn-acc" id="vGalerijo">🖼️ Shrani med moje slike</button>' +
      '<button class="btn" id="zapriModal">Zapri</button></div>';
    $('mask').hidden = false;
  }, 700);
}

/* ---------------------- dotik in miška ---------------------------------- */
function vezi(platno){
  platno.addEventListener('pointerdown', function(e){
    const t = e.target.closest('.obm');
    if (!t) return;
    risem = true; skladOb = P.sklad.length;
    pobarvaj(+t.getAttribute('data-i'));
  });
  platno.addEventListener('pointermove', function(e){
    if (!risem || S.nacin !== 'copic') return;
    e.preventDefault();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.classList && el.classList.contains('obm')) pobarvaj(+el.getAttribute('data-i'));
  });
}
window.addEventListener('pointerup', function(){
  if (!risem) return;
  risem = false;
  /* poteza s čopičem naj se razveljavi v enem koraku */
  if (P && P.sklad.length - skladOb > 1){
    const zdruzeno = [];
    while (P.sklad.length > skladOb) zdruzeno.unshift.apply(zdruzeno, P.sklad.pop());
    P.sklad.push(zdruzeno);
  }
});

function odpriGalerijo(){

function izvoziPNG(){
  const izvirnik = $('stage').querySelector('svg');
  const kop = izvirnik.cloneNode(true);

    const sc = 2, c = document.createElement('canvas');

/* ---------------------- izbirnik barv (RGB) ------------------------------
   Barvna lestvica: vodoravno odtenek, navpično od svetle proti temni.
   Pod njo sivine, pod tem pa drsniki R, G in B za natančno nastavitev.   */
function vHex(r, g, b){
  const d = v => ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2);
  return '#' + d(r) + d(g) + d(b);
}
function izHex(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function odpriIzbirnik(){
  const zac = (S.barva && S.barva.charAt(0) === '#') ? S.barva : '#e63946';
  $('modal').innerHTML =
    '<h3>🎨 Svoja barva</h3>' +
    '<p style="margin-bottom:10px">Tapni barvo na lestvici ali natančno nastavi z drsniki.</p>' +
    '<canvas id="lestvica" width="600" height="260"></canvas>' +
    '<canvas id="sivine" width="600" height="52"></canvas>' +
    '<div class="rgb"><label style="color:#c1121f">R</label>' +
      '<input type="range" id="sR" min="0" max="255"><output id="oR"></output></div>' +
    '<div class="rgb"><label style="color:#1a7f37">G</label>' +
      '<input type="range" id="sG" min="0" max="255"><output id="oG"></output></div>' +
    '<div class="rgb"><label style="color:#1560bd">B</label>' +
      '<input type="range" id="sB" min="0" max="255"><output id="oB"></output></div>' +
    '<div class="pregled"><span class="kvad" id="pregledK"></span><span class="hex" id="pregledH"></span>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn btn-acc" id="uporabiBarvo">Uporabi</button>' +
      '<button class="btn" id="zapriModal">Zapri</button></div>' +
    (S.mojeBarve.length ? '<h3 style="margin:16px 0 8px;font-size:17px">Moje barve</h3>' +
      '<div class="pal" style="justify-content:flex-start">' + S.mojeBarve.map(function(b){
        return '<button class="sw" data-mojaBarva="' + b + '" style="background:' + b + '" title="' + b + '"></button>';
      }).join('') + '</div>' : '');
  $('mask').hidden = false;

  const les = $('lestvica'), lc = les.getContext('2d');
  const odt = lc.createLinearGradient(0, 0, les.width, 0);
  ['#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#ff0000']
    .forEach(function(b, i){ odt.addColorStop(i/6, b); });
  lc.fillStyle = odt; lc.fillRect(0, 0, les.width, les.height);
  const nav = lc.createLinearGradient(0, 0, 0, les.height);
  nav.addColorStop(0, 'rgba(255,255,255,1)');
  nav.addColorStop(0.5, 'rgba(255,255,255,0)');
  nav.addColorStop(0.5, 'rgba(0,0,0,0)');
  nav.addColorStop(1, 'rgba(0,0,0,1)');
  lc.fillStyle = nav; lc.fillRect(0, 0, les.width, les.height);

  const siv = $('sivine'), sc = siv.getContext('2d');
  const sg = sc.createLinearGradient(0, 0, siv.width, 0);
  sg.addColorStop(0, '#000000'); sg.addColorStop(1, '#ffffff');
  sc.fillStyle = sg; sc.fillRect(0, 0, siv.width, siv.height);

  let barva = zac;
  function pokazi(){
    const rgb = izHex(barva);
    $('sR').value = rgb[0]; $('sG').value = rgb[1]; $('sB').value = rgb[2];
    $('oR').textContent = rgb[0]; $('oG').textContent = rgb[1]; $('oB').textContent = rgb[2];
    $('sR').style.setProperty('--tr', 'linear-gradient(90deg,' + vHex(0,rgb[1],rgb[2]) + ',' + vHex(255,rgb[1],rgb[2]) + ')');
    $('sG').style.setProperty('--tr', 'linear-gradient(90deg,' + vHex(rgb[0],0,rgb[2]) + ',' + vHex(rgb[0],255,rgb[2]) + ')');
    $('sB').style.setProperty('--tr', 'linear-gradient(90deg,' + vHex(rgb[0],rgb[1],0) + ',' + vHex(rgb[0],rgb[1],255) + ')');
    $('pregledK').style.background = barva;
    $('pregledH').textContent = barva.toUpperCase();
  }
  function izPlatna(el, e){
    const c = el.getContext('2d'), r = el.getBoundingClientRect();
    const x = Math.max(0, Math.min(el.width - 1, Math.round((e.clientX - r.left) / r.width * el.width)));
    const y = Math.max(0, Math.min(el.height - 1, Math.round((e.clientY - r.top) / r.height * el.height)));
    const d = c.getImageData(x, y, 1, 1).data;
    barva = vHex(d[0], d[1], d[2]); pokazi();
  }
  [les, siv].forEach(function(el){
    let drzi = false;
    el.addEventListener('pointerdown', function(e){ drzi = true; el.setPointerCapture(e.pointerId); izPlatna(el, e); });
    el.addEventListener('pointermove', function(e){ if (drzi){ e.preventDefault(); izPlatna(el, e); } });
    el.addEventListener('pointerup', function(){ drzi = false; });
    el.addEventListener('pointercancel', function(){ drzi = false; });
  });
  ['sR','sG','sB'].forEach(function(id){
    $(id).addEventListener('input', function(){
      barva = vHex(+$('sR').value, +$('sG').value, +$('sB').value); pokazi();
    });
  });
  $('uporabiBarvo').addEventListener('click', function(){
    S.barva = barva;
    S.mojeBarve = [barva].concat(S.mojeBarve.filter(function(b){ return b !== barva; })).slice(0, 12);
    shrani(); $('mask').hidden = true;
    if (P) izrisiPlatno();
  });
  pokazi();
}

document.addEventListener('click', function(e){
  const g = e.target.closest('[data-brisi]');
  if (g){ S.galerija.splice(+g.getAttribute('data-brisi'), 1); shrani(); odpriGalerijo(); return; }
  const kart = e.target.closest('[data-gal]');
  if (kart){
    const x = S.galerija[+kart.getAttribute('data-gal')];
    $('mask').hidden = true;
    if (x){ S.trenutna = { id:x.id, lv:x.lv, barve:x.barve, risba:x.risba || null }; shrani(); odpri(x.id, x.lv); }
    return;
  }
  const b = e.target.closest('button');
  if (!b) return;

  if (b.hasAttribute('data-tema')){ S.tema = b.getAttribute('data-tema'); shrani(); izrisiIzbiro(); return; }
  if (b.hasAttribute('data-stopnja')){ S.stopnja = +b.getAttribute('data-stopnja'); shrani(); izrisiIzbiro(); return; }
  if (b.hasAttribute('data-slika')){ odpri(b.getAttribute('data-slika')); return; }
  if (b.id === 'nazaj'){ izrisiIzbiro(); return; }

  if (b.hasAttribute('data-nacin')){
    S.nacin = b.getAttribute('data-nacin');
    if (S.nacin === 'stev') S.barva = P.predlog[0];
    else if (PALETE[S.paleta].b.indexOf(S.barva) < 0 && S.barva !== 'guma') S.barva = PALETE[S.paleta].b[0];
    shrani(); izrisiPlatno(); return;
  }
  if (b.hasAttribute('data-barva')){
    S.barva = b.getAttribute('data-barva'); shrani();
    Array.prototype.forEach.call(document.querySelectorAll('.sw'), function(sw){
      sw.setAttribute('aria-pressed', sw.getAttribute('data-barva') === S.barva);
    });
    return;
  }
  if (b.hasAttribute('data-paleta')){
    S.paleta = b.getAttribute('data-paleta');
    if (PALETE[S.paleta].b.indexOf(S.barva) < 0 && S.barva !== 'guma') S.barva = PALETE[S.paleta].b[0];
    shrani(); izrisiPlatno(); return;
  }
  if (b.hasAttribute('data-orodje')){ S.orodje = b.getAttribute('data-orodje'); shrani(); izrisiPlatno(); return; }
  if (b.hasAttribute('data-deb')){ S.debelina = +b.getAttribute('data-deb'); shrani(); izrisiPlatno(); return; }
  if (b.id === 'vCrtah'){ S.vCrtah = !S.vCrtah; shrani(); izrisiPlatno(); return; }
  if (b.id === 'svojaBarva'){ odpriIzbirnik(); return; }
  if (b.hasAttribute('data-mojaBarva')){
    S.barva = b.getAttribute('data-mojaBarva'); shrani(); $('mask').hidden = true;
    if (P) izrisiPlatno();
    return;
  }
  if (b.id === 'razveljavi'){ razveljavi(); return; }
  if (b.id === 'pocisti'){
    const sprem = [];
    P.barve.forEach(function(x, i){ if (x){ sprem.push({ i:i, prej:x }); P.barve[i] = undefined; } });
    if (sprem.length){ P.sklad.push(sprem); sprem.forEach(function(x){ nastaviBarvo(x.i); }); }
    if (jeRisba()){ P.poteze = []; P.osnova = null; izrisiPoteze(); }
    const st = $('stanje'); if (st) st.textContent = prestej();
    shraniTrenutno(); shraniRisbo(); return;
  }
  if (b.id === 'predloga'){
    const platno = $('stage').querySelector('svg');
    P.sl.R.forEach(function(o, i){
      if (!o.c) return;
      const el = platno.querySelector('[data-i="' + i + '"]');
      if (el) el.setAttribute('fill', o.c);
    });
    setTimeout(function(){ P.sl.R.forEach(function(o, i){ nastaviBarvo(i); }); }, 1800);
    return;
  }
  if (b.id === 'shraniSliko'){ izvoziPNG(); return; }
  if (b.id === 'vGalerijo'){ vGalerijo(); $('mask').hidden = true; izrisiIzbiro(); return; }
  if (b.id === 'zapriModal'){ $('mask').hidden = true; return; }
  if (b.id === 'galBtn'){ odpriGalerijo(); return; }
  if (b.id === 'soundBtn'){
    S.zvok = !S.zvok; shrani();
    b.textContent = S.zvok ? '🔊' : '🔇';
    return;
  }
});

/* ---------------------- risanje s svinčnikom ----------------------------
   Poteze hranimo v koordinatah slike (ne v pikslih zaslona), zato so ostre
   na vsaki velikosti zaslona in jih je mogoče znova izrisati po zasuku.    */
let ctx = null, kanvas = null, opazovalec = null, penZaznan = false, poteza = null, narisanih = 0, casovnik = 0;

function poljePath(o){
  const s = o.s, p = new Path2D();
  if (s.t === 'e'){ p.ellipse(s.cx, s.cy, s.rx, s.ry, s.rot || 0, 0, Math.PI*2); }
  else if (s.t === 'r'){
    if (p.roundRect) p.roundRect(s.x, s.y, s.w, s.h, s.r || 0);
    else p.rect(s.x, s.y, s.w, s.h);
  } else p.addPath(new Path2D(s.d));
  return p;
}

function pripraviRisalno(){
  kanvas = $('risba');
  if (!kanvas) return;
  const svg = $('platno').querySelector('svg');
  ctx = kanvas.getContext('2d');
  function prilagodi(){
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    /* Slika se v svojem okvirju ohrani v razmerju (xMidYMid meet), zato je
       okoli nje lahko prazen prostor. Platno moramo postaviti NATANKO na
       risbo, sicer barva pristane drugje, kot se pero dotakne zaslona –
       pri zelo neujemajočih razmerjih pa celo zunaj platna in je ni videti. */
    const m = Math.min(r.width / P.sl.w, r.height / P.sl.h);
    const sir = P.sl.w * m, vis = P.sl.h * m;
    kanvas.style.left = ((r.width - sir) / 2) + 'px';
    kanvas.style.top = ((r.height - vis) / 2) + 'px';
    kanvas.style.width = sir + 'px';
    kanvas.style.height = vis + 'px';
    kanvas.width = Math.max(1, Math.round(sir * dpr));
    kanvas.height = Math.max(1, Math.round(vis * dpr));
    P.k = (sir * dpr) / P.sl.w;
    izrisiPoteze();
  }
  if (opazovalec) opazovalec.disconnect();
  if (window.ResizeObserver){ opazovalec = new ResizeObserver(prilagodi); opazovalec.observe(svg); }
  prilagodi();
  if (S.nacin === 'svincnik') vezalnikRisanja();
}

function tockaIz(e){
  const r = kanvas.getBoundingClientRect();
  return [ (e.clientX - r.left) / r.width * P.sl.w,
           (e.clientY - r.top) / r.height * P.sl.h,
           e.pressure > 0 ? e.pressure : 0.5 ];
}
/* Katero polje je pod konico – iščemo od zgornjega navzdol.
   isPointInPath pričakuje koordinate PLATNA (nanje se preslikava ne uporabi),
   pot pa je v koordinatah slike, zato točko pomnožimo s povečavo. */
function poljeNa(x, y){
  if (!ctx) return null;
  ctx.setTransform(P.k, 0, 0, P.k, 0, 0);
  const dx = x * P.k, dy = y * P.k;
  for (let i = P.sl.R.length - 1; i >= 0; i--){
    if (ctx.isPointInPath(poljePath(P.sl.R[i]), dx, dy)) return i;
  }
  return null;
}

function zacniRisbo(pot){
  ctx.save();
  if (pot.rez != null && P.sl.R[pot.rez]){
    ctx.clip(poljePath(P.sl.R[pot.rez]));
    if (P.sl.R[pot.rez].rez) ctx.clip(poljePath({ s:P.sl.R[pot.rez].rez }));
  }
  if (pot.t === 'radirka') ctx.globalCompositeOperation = 'destination-out';
}
/* Zrnata orodja: drobne pike ob poti. gostota, razpršenost in prosojnost
   določijo, ali je videti kot vosek, kreda ali sprej. */
function pike(r, a, b, w, barva, o){
  const d = Math.hypot(b[0]-a[0], b[1]-a[1]);
  const n = Math.max(1, Math.round(d / o.korak));
  ctx.fillStyle = barva;
  for (let j = 0; j < n; j++){
    const u = j / n, x = a[0] + (b[0]-a[0])*u, y = a[1] + (b[1]-a[1])*u;
    for (let k = 0; k < o.na; k++){
      const kot = r() * Math.PI * 2, rad = Math.pow(r(), o.proti || 1) * w * o.raztros;
      ctx.globalAlpha = o.a0 + r() * o.a1;
      ctx.beginPath();
      ctx.arc(x + Math.cos(kot)*rad, y + Math.sin(kot)*rad, w * (o.r0 + r()*o.r1), 0, Math.PI*2);
      ctx.fill();
    }
  }
}
function narisiOd(pot, od){
  zacniRisbo(pot);
  const t = pot.p;
  for (let i = Math.max(1, od); i < t.length; i++){
    /* zrno je vezano na odsek, zato je sled po ponovnem izrisu enaka */
    const r = nak(pot.seed + i * 7919);
    const a = t[i-1], b = t[i], pri = (a[2] + b[2]) / 2;
    const w = pot.w * (0.35 + pri * 1.25);
    if (pot.t === 'voscenka'){
      pike(r, a, b, pot.w * (0.45 + pri), pot.c, { korak:1.4, na:3, raztros:0.5, a0:0.10, a1:0.14, r0:0.14, r1:0.16 });
    } else if (pot.t === 'kreda'){
      pike(r, a, b, pot.w * (0.55 + pri), svetleje(pot.c, 40), { korak:1.1, na:4, raztros:0.62, a0:0.06, a1:0.10, r0:0.10, r1:0.14 });
    } else if (pot.t === 'sprej'){
      pike(r, a, b, pot.w * (0.8 + pri * 0.8), pot.c, { korak:2.2, na:7, raztros:1, proti:0.5, a0:0.03, a1:0.07, r0:0.03, r1:0.05 });
    } else if (pot.t === 'akvarel'){
      /* mehke lise z raztezajočim se prelivom – barva se nabira kot pri akvarelu */
      const d = Math.hypot(b[0]-a[0], b[1]-a[1]), n = Math.max(1, Math.round(d / (w*0.4)));
      for (let j = 0; j < n; j++){
        const u = j / n, x = a[0] + (b[0]-a[0])*u, y = a[1] + (b[1]-a[1])*u;
        const rr = w * (0.9 + r()*0.4);
        const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
        g.addColorStop(0, pot.c); g.addColorStop(1, pot.c);
        ctx.fillStyle = g; ctx.globalAlpha = 0.05 + r()*0.04;
        ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI*2); ctx.fill();
      }
    } else if (pot.t === 'blescice'){
      ctx.strokeStyle = svetleje(pot.c, 30);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
      ctx.lineWidth = w * 0.5;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      pike(r, a, b, pot.w * (0.8 + pri), '#ffffff', { korak:5, na:2, raztros:0.9, a0:0.5, a1:0.5, r0:0.05, r1:0.10 });
      pike(r, a, b, pot.w * (0.9 + pri), svetleje(pot.c, -40), { korak:7, na:1, raztros:1, a0:0.4, a1:0.4, r0:0.04, r1:0.08 });
    } else {
      /* Odseke rišemo prekrivno, barvo pa svetlimo proti beli. Če bi risali
         prosojno, bi se na stikih odsekov prosojnosti seštele in ostali bi
         temnejši krogci. Prosojen videz da množenje s črtno risbo pod platnom. */
      ctx.strokeStyle = pot.t === 'radirka' ? pot.c
        : (pot.t === 'pero' ? pot.c : svetleje(pot.c, pot.t === 'svincnik' ? 74 : 46));
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.globalAlpha = 1;
      ctx.lineWidth = pot.t === 'pero' ? Math.max(1.2, pot.w * 0.45) : w;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function izrisiPoteze(){
  if (!ctx || !kanvas) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, kanvas.width, kanvas.height);
  ctx.setTransform(P.k, 0, 0, P.k, 0, 0);
  if (P.osnova){ try { ctx.drawImage(P.osnova, 0, 0, P.sl.w, P.sl.h); } catch(e){} }
  P.poteze.forEach(function(pot){ narisiOd(pot, 1); });
}

function vezalnikRisanja(){
  kanvas.onpointerdown = function(e){
    if (e.pointerType === 'pen') penZaznan = true;
    if (penZaznan && e.pointerType === 'touch') return;   /* dlan na zaslonu ne riše */
    e.preventDefault();
    try { kanvas.setPointerCapture(e.pointerId); } catch(err){}
    const t = tockaIz(e);
    poteza = {
      t: S.orodje,
      c: S.orodje === 'radirka' ? '#000' : S.barva,
      w: DEBELINE[S.debelina-1].w *
         (S.orodje === 'svincnik' ? 0.5 : S.orodje === 'pero' ? 0.5 :
          S.orodje === 'akvarel' ? 1.5 : S.orodje === 'sprej' ? 1.6 : 1),
      rez: S.vCrtah ? poljeNa(t[0], t[1]) : null,
      seed: Math.round(t[0]*13 + t[1]*7 + P.poteze.length*97) + 1,
      p: [t]
    };
    P.poteze.push(poteza); narisanih = 1;
  };
  kanvas.onpointermove = function(e){
    if (!poteza) return;
    if (penZaznan && e.pointerType === 'touch') return;
    e.preventDefault();
    /* Apple Pencil pošlje več vmesnih točk na en dogodek – z njimi je črta gladka.
       Če jih brskalnik ne da (ali vrne prazen seznam), uporabimo sam dogodek. */
    let vsi = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (!vsi || !vsi.length) vsi = [e];
    for (let i = 0; i < vsi.length; i++) poteza.p.push(tockaIz(vsi[i]));
    narisiOd(poteza, narisanih);
    narisanih = poteza.p.length;
  };
  const konec = function(){
    if (!poteza) return;
    if (poteza.p.length < 2){ poteza.p.push([poteza.p[0][0]+0.6, poteza.p[0][1], poteza.p[0][2]]); narisiOd(poteza, 1); }
    P.sklad.push({ poteza:1 });
    poteza = null;
    zvokBarva(); shraniRisbo();
  };
  kanvas.onpointerup = konec;
  kanvas.onpointercancel = konec;
  kanvas.onpointerleave = function(e){ if (poteza && e.buttons === 0) konec(); };
}

/* risbo shranimo kot sliko (pomanjšano), da se barvanje nadaljuje po zaprtju */
function risbaVURL(najvec){
  if (!kanvas || !kanvas.width) return null;
  const m = najvec / Math.max(kanvas.width, kanvas.height);
  if (m >= 1) return kanvas.toDataURL('image/png');
  const c = document.createElement('canvas');
  c.width = Math.round(kanvas.width * m); c.height = Math.round(kanvas.height * m);
  c.getContext('2d').drawImage(kanvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}
function shraniRisbo(){
  clearTimeout(casovnik);
  casovnik = setTimeout(function(){
    if (!P) return;
    const u = risbaVURL(900);
    S.trenutna = { id:P.s.id, lv:P.lv, barve:P.barve.map(function(b){ return b || null; }), risba:u };
    try { shrani(); } catch(e){}
  }, 500);
}
function jeRisba(){ return !!(P && (P.poteze.length || P.osnova)); }

/* ---------------------- zagon -------------------------------------------- */
$('soundBtn').textContent = S.zvok ? '🔊' : '🔇';
izrisiIzbiro();
</script>

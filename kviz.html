<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vseved – kviz za vso družino</title>
<meta name="description" content="Kviz v slovenščini za otroke in odrasle: štirinajst področij, več kot 500 vprašanj z razlago, lestvica do vrha, hitri ogenj, dvoboj za dva in izziv dneva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- pisava se naloži ob strani: če je omrežje počasno ali ga ni, se stran izriše
     takoj s sistemsko pisavo in ne čaka -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      media="print" onload="this.media='all'">
<meta name="theme-color" content="#c2255c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2b1b2c; --ink-soft:#6d5a70;
  --card:#ffffff; --card2:#fdf7fa;
  --line:#f0e2ea;
  --ok:#1eb872; --ok-d:#159a5e;
  --no:#f2762e; --no-d:#d55f1c;
  --acc:#c2255c; --acc-d:#9c1c49;
  --acc2:#6d28d9; --acc2-d:#5620ac;
  --gold:#ffb703;
  --i1:#2563eb; --i1-d:#1b4fc0;   /* prvi igralec v dvoboju */
  --i2:#ea580c; --i2-d:#bf460a;   /* drugi igralec v dvoboju */
  --tla:#fdf1f6; --o1:#ffdfec; --o2:#e6e0ff; --o3:#fff0d8;
  --risba:#c2255c;                /* barva bledih motivov v ozadju */
  --risba-p:.085;
  --mozg:#ffc4dd; --mozg-d:#e0679b; --koza:#fff1f7; --ocala:#9c1c49; --zenica:#2b1b2c;
  --r:22px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#f7ecf2; --ink-soft:#c3aecb;
    --card:#2b2030; --card2:#352739;
    --line:#48344c;
    --ok:#2ecf89; --ok-d:#1a8b5c;
    --no:#ff9a4d; --no-d:#c96a24;
    --acc:#f2588f; --acc-d:#a72e60;
    --acc2:#a884f7; --acc2-d:#6d45c4;
    --i1:#5c8ff5; --i1-d:#3563c9;
    --i2:#ff8f4d; --i2-d:#c25f14;
    --tla:#1a1220; --o1:#3b1c31; --o2:#241f47; --o3:#3a2a1a;
    --risba:#ff9dc4; --risba-p:.075;
    --mozg:#a45f85; --mozg-d:#ffd0e3; --koza:#fff4f9; --ocala:#ffd0e3; --zenica:#2b1b2c;
  }
}
html,body{height:100%}
body{
  margin:0;
  font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--tla);
  background-image:
    radial-gradient(1100px 700px at 8% -10%, var(--o1) 0%, transparent 60%),
    radial-gradient(900px 620px at 100% 0%, var(--o2) 0%, transparent 55%),
    radial-gradient(900px 700px at 50% 115%, var(--o3) 0%, transparent 60%);
  background-attachment:fixed;
  min-height:100dvh;
  overflow-x:hidden;
}
/* bledo ilustrirano ozadje: žarnice in vprašaji */
.ozadje{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  color:var(--risba);opacity:var(--risba-p)}
.wrap{max-width:800px;margin:0 auto;position:relative;z-index:2;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px))
          calc(34px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--card);border-radius:18px;padding:14px 20px;font-weight:900;font-size:19px;line-height:1;
  min-height:48px;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d)}
.btn-acc:active{box-shadow:0 1px 0 var(--acc-d)}
.btn-ghost{background:var(--card);box-shadow:0 5px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn-ghost:active{box-shadow:0 1px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}

/* ---------- glava z maskoto ---------- */
.top{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;
  padding:9px 15px;font-weight:900;box-shadow:0 4px 0 var(--line);font-size:17px;white-space:nowrap}
.pill.gold{color:var(--gold)}
.icon-btn{width:46px;height:46px;border-radius:999px;background:var(--card);box-shadow:0 4px 0 var(--line);
  display:grid;place-items:center;font-size:21px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

.masko{width:52px;height:52px;flex:none;overflow:visible}
.masko .zib{transform-origin:60px 104px;animation:zib 4.4s ease-in-out infinite}
@keyframes zib{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.masko .oko1{transform-origin:44px 66px}
.masko .oko2{transform-origin:78px 66px}
.masko .oko1,.masko .oko2{animation:mezik 5.4s infinite}
@keyframes mezik{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.masko .usta{display:none}
.masko[data-nastr="pozdrav"] .u-pozdrav,
.masko[data-nastr="veselo"] .u-veselo,
.masko[data-nastr="zamisljeno"] .u-zamisljeno,
.masko[data-nastr="zalostno"] .u-zalostno{display:block}
.masko .obrv{transition:transform .2s}
.masko[data-nastr="zamisljeno"] .obrv1{transform:translateY(-5px) rotate(-10deg)}
.masko[data-nastr="zalostno"] .obrv1{transform:translate(2px,3px) rotate(14deg)}
.masko[data-nastr="zalostno"] .obrv2{transform:translate(-2px,3px) rotate(-14deg)}
.masko[data-nastr="veselo"] .zib{animation:zib 1s ease-in-out infinite}

/* maskota z govornim oblačkom: oblaček ima repek proti maskoti */
.uvod{display:flex;align-items:flex-start;gap:12px;margin:0 0 14px}
.uvod .masko{width:82px;height:82px}
.uvod-igra{margin:0 0 16px}
.uvod-igra .masko{width:58px;height:58px}
.oblacek{position:relative;flex:1;min-width:0;margin:10px 0 0;
  background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:11px 14px;
  font-weight:800;font-size:15.5px;line-height:1.4;color:var(--ink);
  animation:oblacekPride .25s ease-out backwards}
.uvod-igra .oblacek{margin-top:6px;font-size:14.5px;padding:9px 13px}
.oblacek::before,.oblacek::after{content:"";position:absolute;top:16px;width:0;height:0;
  border:9px solid transparent;border-left:0}
.oblacek::before{left:-11px;border-right-color:var(--line)}
.oblacek::after{left:-8px;border-right-color:var(--card2)}
.oblacek[hidden]{display:none}
@keyframes oblacekPride{from{opacity:0;transform:translateX(-8px) scale(.97)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(43,27,44,.10)}
h2.section{font-size:19px;margin:22px 4px 10px;font-weight:900;color:var(--ink-soft)}
.lead{margin:0 0 12px;font-weight:700;color:var(--ink-soft);font-size:15.5px;line-height:1.5}
.mini{font-size:13.5px;font-weight:700;color:var(--ink-soft);line-height:1.5;margin:0}

/* prehod med zasloni – zgolj vizualen, hidden se preklopi takoj */
.vstop{animation:vstop .18s ease-out}
@keyframes vstop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* načini igre */
.nacini{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.nacin{position:relative;text-align:left;background:var(--card);border-radius:20px;padding:15px 16px;
  box-shadow:0 6px 0 var(--line);transition:transform .1s;overflow:hidden;isolation:isolate}
.nacin::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.14;
  background:linear-gradient(155deg,var(--c,var(--acc)),transparent 68%)}
.nacin:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.nacin .emo{position:relative;width:54px;height:54px;border-radius:999px;display:grid;place-items:center;
  font-size:29px;line-height:1;background:var(--card2);margin:2px 0 9px;
  box-shadow:0 4px 12px rgba(43,27,44,.16),inset 0 0 0 2px var(--line)}
.nacin .emo::before{content:"";position:absolute;inset:-5px;border-radius:999px;
  border:4px solid transparent;border-top-color:var(--c,var(--acc));transform:rotate(38deg)}
.nacin .nm{font-weight:900;font-size:18px;display:block}
.nacin .sub{font-size:13px;color:var(--ink-soft);font-weight:700;display:block;margin-top:3px;line-height:1.35}
.nacin .rek{font-size:12.5px;font-weight:900;color:var(--c,var(--acc));display:block;margin-top:6px}
.nacin::after{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c,var(--acc))}

/* področja */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:7px;
  background:var(--card);border:2px solid var(--c,var(--line));min-height:46px;
  border-radius:999px;padding:10px 15px;font-weight:900;font-size:15.5px;box-shadow:0 4px 0 var(--line)}
.chip::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.16;
  background:linear-gradient(150deg,var(--c,var(--acc)),transparent 72%)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip .del{font-size:12.5px;font-weight:900;color:var(--ink-soft)}
.chip.vse{background:var(--acc);color:#fff;border-color:var(--acc-d);box-shadow:0 4px 0 var(--acc-d)}
.chip.vse::before{opacity:0}

/* igra */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:999px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}.dot.now{background:var(--acc);transform:scale(1.25)}
.cas{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 12px}
.cas i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));transition:width .25s linear}
.cas.malo i{background:var(--no)}
.q{font-size:clamp(19px,4.4vw,25px);font-weight:900;line-height:1.32;margin:2px 0 14px;text-wrap:balance}
.q .kat{display:block;font-size:13.5px;font-weight:900;color:var(--c,var(--acc));margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.dva{grid-template-columns:repeat(2,1fr)}
.opt{background:var(--card2);border:2px solid var(--line);border-radius:18px;padding:15px 16px;font-weight:800;
  font-size:17.5px;box-shadow:0 5px 0 var(--line);transition:transform .08s;text-align:left;line-height:1.3;
  min-height:48px;display:flex;align-items:center;gap:11px;
  animation:vstopOpt .22s ease-out backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes vstopOpt{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.opt .crka{flex:none;width:30px;height:30px;border-radius:999px;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:16px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok-d);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.opt.no{background:var(--no);border-color:var(--no-d);color:#fff;box-shadow:0 5px 0 var(--no-d)}
.opt.ok .crka,.opt.no .crka{background:rgba(255,255,255,.3)}
.opt.skrit{opacity:.25;pointer-events:none}
.opt[disabled]{pointer-events:none}
.odziv{margin-top:14px;font-weight:900;font-size:17px;min-height:26px;line-height:1.45}
.odziv .zakaj{display:block;font-weight:800;font-size:14.5px;color:var(--ink-soft);margin-top:5px}

/* odziv na pravilen in napačen odgovor */
.blisk{animation:blisk .55s ease-out}
@keyframes blisk{0%{box-shadow:0 0 0 0 rgba(30,184,114,.55),0 8px 24px rgba(43,27,44,.10)}
  100%{box-shadow:0 0 0 24px rgba(30,184,114,0),0 8px 24px rgba(43,27,44,.10)}}
.trese{animation:trese .38s}
@keyframes trese{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* pomoč pri lestvici */
.pomoci{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.pomoc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:900;font-size:14.5px;
  min-height:44px;box-shadow:0 4px 0 var(--line)}
.pomoc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pomoc[disabled]{opacity:.4;pointer-events:none;text-decoration:line-through}
.lestev{display:flex;gap:4px;margin:0 0 6px}
.lestev + .mini{margin:0 0 12px 2px}
.stopnicka{flex:1;min-width:20px;text-align:center;font-weight:900;font-size:12.5px;color:var(--ink-soft);
  background:var(--card);border-radius:9px;padding:7px 2px;box-shadow:0 3px 0 var(--line)}
.stopnicka.zdaj{background:var(--acc);color:#fff}
.stopnicka.mimo{background:rgba(30,184,114,.2);color:var(--ok-d)}
.stopnicka.varna{outline:2px dashed var(--gold)}

/* dvoboj – vsak igralec ima svojo barvo in svojo polovico */
.igralca{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.igralec{position:relative;isolation:isolate;overflow:hidden;background:var(--card);border-radius:16px;
  padding:10px 12px;text-align:center;font-weight:900;box-shadow:0 4px 0 var(--line)}
.igralec::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ig);opacity:.13}
.igralec b{display:block;font-size:26px;color:var(--ig)}
.igralec.naVrsti{background:var(--ig);color:#fff;box-shadow:0 4px 0 var(--ig-d)}
.igralec.naVrsti::before{opacity:0}
.igralec.naVrsti b{color:#fff}
.igralec .naznak{display:block;font-size:11.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;
  min-height:15px;opacity:.85}
.dvobojCrta{height:6px;border-radius:999px;margin:0 0 12px;background:var(--ig)}

/* zaključni zaslon */
.konec{text-align:center}
.konec .uvod{justify-content:center}
.konec .oblacek{flex:0 1 auto;max-width:420px;text-align:left}
.konec h3{font-size:26px;margin:8px 0 6px;font-weight:900}
.obroc{position:relative;width:138px;height:138px;margin:2px auto 4px}
.obroc svg{width:100%;height:100%;transform:rotate(-90deg)}
.obroc .sled{fill:none;stroke:var(--line);stroke-width:13}
.obroc .del{fill:none;stroke:var(--acc);stroke-width:13;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.3,1)}
.obroc .odst{position:absolute;inset:0;display:grid;place-items:center;font-size:31px;font-weight:900}
.zvezdice{display:flex;justify-content:center;gap:9px;font-size:34px;line-height:1;margin:2px 0 4px}
.zvezdice span{animation:zvezdaPride .5s ease-out backwards}
.zvezdice span.prazna{opacity:.22;filter:grayscale(1)}
@keyframes zvezdaPride{from{opacity:0;transform:translateY(-28px) scale(.4) rotate(-40deg)}to{opacity:1;transform:none}}
.rezultat{font-size:46px;font-weight:900;line-height:1.05;margin:4px 0 2px}
.rezultat .a{color:var(--i1)}.rezultat .b{color:var(--i2)}
.seznam{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;text-align:left}
.seznam li{background:var(--card2);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;line-height:1.4}
.seznam li b{color:var(--acc-d)}
.znanje{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vrstica{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:14.5px;border-radius:12px;padding:6px 9px}
.vrstica::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.13;
  background:linear-gradient(90deg,var(--c,var(--acc)),transparent 78%)}
.vrstica .im{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrstica .bar{width:110px;height:9px;background:var(--line);border-radius:999px;overflow:hidden;flex:none}
.vrstica .bar i{display:block;height:100%;background:var(--c,var(--acc))}
.vrstica .st{width:52px;text-align:right;color:var(--ink-soft);font-size:13px;flex:none}

.modal{position:fixed;inset:0;background:rgba(20,10,22,.55);display:grid;place-items:center;padding:18px;z-index:30}
.modal[hidden]{display:none}
.modal .box{background:var(--card);border-radius:22px;padding:20px;max-width:520px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.4);max-height:86dvh;overflow:auto}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.level{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;font-weight:900;
  min-height:48px;box-shadow:0 5px 0 var(--line)}
.level small{display:block;font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:3px}
.level[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d)}
.level[aria-pressed="true"] small{color:#ffe1ec}

.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:76px;pointer-events:none;
  animation:pop .85s ease-out forwards;z-index:40}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

/* konfeti ob odličnem rezultatu */
.konfeti{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.konfeti i{position:absolute;top:-18px;width:9px;height:15px;border-radius:2px;animation:pada linear forwards}
@keyframes pada{to{transform:translateY(106vh) rotate(760deg);opacity:.1}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  .konfeti{display:none}}
@media (max-width:430px){ .opt{font-size:16px;padding:13px 13px} .opts.dva{grid-template-columns:1fr}
  .masko{width:44px;height:44px} .uvod .masko{width:70px;height:70px}
  .uvod-igra .masko{width:52px;height:52px} .brand{font-size:23px}
  .vrstica .bar{width:66px} .vrstica .st{width:44px} .vrstica{font-size:13.5px} }
</style>
</head>
<body>

<!-- bledi motivi v ozadju: žarnice in vprašaji; le okras, brez pomena za bralnike -->
<svg class="ozadje" aria-hidden="true" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <g id="zarnica">
      <path d="M12 1a8.6 8.6 0 0 0-5.4 15.3c.9.8 1.4 1.8 1.6 2.9h7.6c.2-1.1.7-2.1 1.6-2.9A8.6 8.6 0 0 0 12 1Z"
            fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="8.2" y="21.4" width="7.6" height="2.6" rx="1.3" fill="currentColor"/>
      <rect x="9" y="26" width="6" height="2.6" rx="1.3" fill="currentColor"/>
      <path d="M12 6v7M9 10h6" stroke="currentColor" stroke-width="1.6" fill="none"/>
    </g>
  </defs>
  <g fill="currentColor" font-family="Nunito, Trebuchet MS, sans-serif" font-weight="900">
    <text x="34" y="90" font-size="72">?</text>
    <text x="318" y="176" font-size="52">?</text>
    <text x="126" y="268" font-size="40">?</text>
    <text x="262" y="392" font-size="86">?</text>
    <text x="46" y="470" font-size="46">?</text>
    <text x="336" y="596" font-size="62">?</text>

/* ======================= POMOŽNO ========================================= */
const R = n => Math.floor(Math.random() * n);
const ena = a => a[R(a.length)];
function premesaj(a, rnd){ a = a.slice(); const r = rnd || Math.random;
  for (let i = a.length-1; i > 0; i--){ const j = Math.floor(r() * (i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* ponovljivo naključje – za izziv dneva, ki mora biti za vse enak */
function seme(niz){ let h = 2166136261; for (let i = 0; i < niz.length; i++){ h ^= niz.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function nakljucnik(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function danes(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }

/* ======================= STANJE ========================================== */
const LS = 'vseved_kviz_v1';
const SVEZE = { zvezde:0, zvok:true, tezavnost:'auto', st:{}, gor:{}, dol:{}, stat:{}, slabo:{}, rek:{}, iger:0, izziv:{} };
let STANJE = nalozi();
function nalozi(){
  try{
    const raw = localStorage.getItem(LS);
    if (!raw) return Object.assign({}, SVEZE);
    const s = Object.assign({}, SVEZE, JSON.parse(raw));
    for (const k of ['st','gor','dol','stat','slabo','rek','izziv']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
    return s;
  } catch(e){ return Object.assign({}, SVEZE); }
}
function shrani(){ try{ localStorage.setItem(LS, JSON.stringify(STANJE)); } catch(e){} }

function stopnjaPodrocja(kat){
  if (STANJE.tezavnost !== 'auto') return { lahko:1, srednje:2, tezko:3 }[STANJE.tezavnost] || 2;
  return Math.min(3, Math.max(1, STANJE.st[kat] || 1));
}
function prilagodi(kat, prav){
  if (STANJE.tezavnost !== 'auto') return 0;
  const zdaj = stopnjaPodrocja(kat);
  if (prav){
    STANJE.gor[kat] = (STANJE.gor[kat] || 0) + 1; STANJE.dol[kat] = 0;
    if (STANJE.gor[kat] >= 4 && zdaj < 3){ STANJE.st[kat] = zdaj + 1; STANJE.gor[kat] = 0; return 1; }
  } else {
    STANJE.dol[kat] = (STANJE.dol[kat] || 0) + 1; STANJE.gor[kat] = 0;
    if (STANJE.dol[kat] >= 2 && zdaj > 1){ STANJE.st[kat] = zdaj - 1; STANJE.dol[kat] = 0; return -1; }
  }
  return 0;
}
function zabelezi(q, prav){
  const s = STANJE.stat[q.k] || (STANJE.stat[q.k] = { p:0, v:0 });
  s.v++; if (prav) s.p++;
  if (prav){ if (STANJE.slabo[q.v]){ STANJE.slabo[q.v]--; if (STANJE.slabo[q.v] <= 0) delete STANJE.slabo[q.v]; } }
  else STANJE.slabo[q.v] = Math.min(3, (STANJE.slabo[q.v] || 0) + 2);
}

/* ======================= IZBIRA VPRAŠANJ ================================= */
/* kat = id področja ali null za pomešano; stopnja določa, katere zahtevnosti pridejo v poštev */
function zaloga(kat, stopnja){
  let z = VPRASANJA.filter(q => (!kat || q.k === kat));
  const dovoljene = stopnja >= 3 ? [2, 3] : stopnja === 2 ? [1, 2, 3] : [1, 2];
  let ozji = z.filter(q => dovoljene.indexOf(q.t) >= 0);
  return ozji.length >= 4 ? ozji : z;
}
function izberiVprasanje(kat, stopnja, videni, rnd){
  const z = zaloga(kat, stopnja);
  const r = rnd || Math.random;
  const svezi = z.filter(q => !videni[q.v]);
  const izbira = svezi.length ? svezi : z;
  /* Tisto, kar je otroku že delalo težave, pride nekoliko pogosteje nazaj – razen pri
     izzivu dneva (rnd je podan), ki mora biti za vse igralce enak. */
  const slabi = rnd ? [] : izbira.filter(q => STANJE.slabo[q.v]);
  const vir = (slabi.length && r() < 0.3) ? slabi : izbira;
  return vir[Math.floor(r() * vir.length)];
}
function sestavi(q, stMoznosti, rnd){
  const napacni = premesaj(q.n, rnd).slice(0, Math.max(1, stMoznosti - 1));
  const opts = premesaj([q.o].concat(napacni), rnd);
  return { q, opts, a: opts.indexOf(q.o) };
}

/* ======================= ZVOK ============================================ */
let AC = null;
function ac(){ if (!AC && (window.AudioContext || window.webkitAudioContext)) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function pisk(fs, dolzina, vrsta){
  if (!STANJE.zvok) return;
  let c; try{ c = ac(); } catch(e){ return; }
  if (!c) return;
  try{
    if (c.state === 'suspended'){ const r = c.resume(); if (r && r.catch) r.catch(() => {}); }
    fs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = vrsta || 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(c.destination);
      const t = c.currentTime + i * (dolzina * 0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dolzina);
      o.start(t); o.stop(t + dolzina + 0.02);
    });
  } catch(e){}
}
const zvOk = () => pisk([660, 880], 0.16);
const zvNe = () => pisk([300, 220], 0.2, 'triangle');
const zvVrh = () => pisk([523, 659, 784, 1047], 0.16);
const zvKonec = () => pisk([784, 587, 392], 0.22, 'triangle');

/* ======================= IZRIS =========================================== */
const $ = id => document.getElementById(id);
const scrDomov = $('scrDomov'), scrPodrocja = $('scrPodrocja'), scrIgra = $('scrIgra');
/* Zaslon se preklopi takoj (hidden je resnica v istem trenutku), prehod je le vizualen. */
function pokaziZaslon(el){
  [scrDomov, scrPodrocja, scrIgra].forEach(s => { s.hidden = (s !== el); s.classList.remove('vstop'); });
  void el.offsetWidth;
  el.classList.add('vstop');
  window.scrollTo(0, 0);
}
function narisiZvezde(){ $('zvezde').textContent = STANJE.zvezde; }
function narisiZvok(){
  const g = $('gumbZvok');
  if (!g) return;
  g.textContent = STANJE.zvok ? '\ud83d\udd0a' : '\ud83d\udd07';
  g.setAttribute('aria-pressed', STANJE.zvok ? 'true' : 'false');
}
/* Maskota: ista risba iz predloge se pojavi v glavi in ob oblačku na zaslonih. */
const MASKOTA_SVG = $('maskotaVzorec').innerHTML;
function maskotaSvg(dodatek){
  return MASKOTA_SVG.replace('class="masko"', 'class="masko ' + (dodatek || '') + '"');
}
/* Blok »maskota + oblaček z repkom proti njej«. */
function maskotaZOblackom(dodatek){
  return '<div class="uvod ' + (dodatek || '') + '">' + maskotaSvg('') + '<p class="oblacek"></p></div>';
}
/* Razpoloženje (pozdrav, veselo, zamisljeno, zalostno) in kratek stavek v oblačku. */
let NASTROJ = 'pozdrav', STAVEK = '';
function osveziMaskote(){
  document.querySelectorAll('.masko').forEach(m => { m.dataset.nastr = NASTROJ; });
  document.querySelectorAll('.oblacek').forEach(o => {
    if (o.textContent !== STAVEK){
      o.textContent = STAVEK;
      o.style.animation = 'none'; void o.offsetWidth; o.style.animation = '';
    }
    o.hidden = !STAVEK;
  });
}
function povej(nastr, besedilo){
  NASTROJ = nastr || 'pozdrav';
  STAVEK = besedilo || '';
  osveziMaskote();
}
function zaigraj(el, razred){
  if (!el) return;
  el.classList.remove('blisk', 'trese'); void el.offsetWidth; el.classList.add(razred);
}
function konfeti(stKoscev){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const barve = ['#c2255c', '#6d28d9', '#1eb872', '#ffb703', '#f2762e', '#2563eb'];
  const d = document.createElement('div');
  d.className = 'konfeti'; d.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < stKoscev; i++){
    const k = document.createElement('i');
    k.style.left = R(100) + '%';
    k.style.background = ena(barve);
    k.style.animationDuration = (1.6 + Math.random() * 1.4).toFixed(2) + 's';
    k.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
    d.appendChild(k);
  }
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3800);
}
function poskoci(emo){
  const d = document.createElement('div');
  d.className = 'pop'; d.textContent = emo; document.body.appendChild(d);
  setTimeout(() => d.remove(), 850);
}
function naziv(n){
  const t = [[0,'Radovednež 🐣'],[40,'Poznavalec 🔎'],[120,'Vseznalec 📚'],[250,'Mojster kviza 🏅'],[450,'Vseved 👑']];
  let out = t[0][1];
  for (const [n2, nm] of t) if (n >= n2) out = nm;
  return out;
}
function rekord(nacin){
  const r = STANJE.rek[nacin];
  if (r === undefined) return '';
  if (nacin === 'lestvica') return 'najvišja stopnička: ' + r;
  if (nacin === 'hitri') return 'rekord: ' + r + ' v minuti';
  if (nacin === 'izziv') return 'zadnji izziv: ' + r + '/10';
  if (nacin === 'dvoboj') return 'odigranih dvobojev: ' + r;
  return 'najboljše: ' + r + '/' + (NACINI[nacin].st || 10);
}

function narisiDomov(){
  const skupaj = Object.keys(STANJE.stat).reduce((a, k) => a + STANJE.stat[k].v, 0);
  const znanje = PODROCJA.map(p => {
    const s = STANJE.stat[p.id] || { p:0, v:0 };
    const del = s.v ? Math.round(s.p / s.v * 100) : 0;
    return '<div class="vrstica" style="--c:' + p.c + '"><span class="im">' + p.emo + ' ' + esc(p.nm) + '</span>' +
      '<span class="bar"><i style="width:' + del + '%"></i></span>' +
      '<span class="st">' + (s.v ? del + ' %' : '–') + '</span></div>';
  }).join('');
  scrDomov.innerHTML =
    '<div class="card">' +
      maskotaZOblackom('') +
      '<p class="lead">V zbirki imam <b>' + VPRASANJA.length + ' vprašanj</b> ' +
      'iz štirinajstih področij – od živali in vesolja do športa, računalništva, vremena in Slovenije. Izberi način igre.</p>' +
      '<div class="nacini">' +
      Object.keys(NACINI).map(id => {
        const n = NACINI[id];
        return '<button class="nacin" data-nacin="' + id + '" style="--c:' + n.c + '">' +
          '<span class="emo">' + n.emo + '</span><span class="nm">' + esc(n.nm) + '</span>' +
          '<span class="sub">' + esc(n.sub) + '</span>' +
          (rekord(id) ? '<span class="rek">' + esc(rekord(id)) + '</span>' : '') +
        '</button>';
      }).join('') +
      '</div>' +
    '</div>' +
    '<h2 class="section">Kako ti gre po področjih</h2>' +
    '<div class="card"><div class="znanje">' + znanje + '</div>' +
      '<p class="mini" style="margin-top:14px">Naziv: <b>' + naziv(STANJE.zvezde) + '</b> · odgovorjenih vprašanj: <b>' +
      skupaj + '</b> · odigranih iger: <b>' + STANJE.iger + '</b></p></div>';
  povej('pozdrav', STANJE.iger === 0
    ? 'Pozdravljen! Jaz sem Vseved. Izberi način igre in začniva.'
    : ena(['Kaj se danes učiva?', 'Pripravljen na nova vprašanja?',
           'Vsak odgovor prinese zvezdico.', 'Izberi način in gremo!']));
  pokaziZaslon(scrDomov);
}

function narisiPodrocja(nacinId){
  const n = NACINI[nacinId];
  const chips = PODROCJA.map(p => {
    const s = STANJE.stat[p.id] || { p:0, v:0 };
    return '<button class="chip" data-kat="' + p.id + '" style="--c:' + p.c + '">' +
      p.emo + ' ' + esc(p.nm) + (s.v ? '<span class="del">' + Math.round(s.p / s.v * 100) + ' %</span>' : '') + '</button>';
  }).join('');
  scrPodrocja.innerHTML =
    '<div class="row" style="margin:0 0 12px"><button class="btn btn-ghost" id="nazajDomov">⬅️ Nazaj</button>' +
      '<div class="pill">' + n.emo + ' ' + esc(n.nm) + '</div></div>' +
    '<div class="card">' + maskotaZOblackom('') +
      '<p class="lead">' + esc(n.sub) + '</p>' +
      '<h2 class="section" style="margin-top:0">Izberi področje</h2>' +
      '<div class="chips"><button class="chip vse" data-kat="">🎲 Vse pomešano</button>' + chips + '</div>' +
      (nacinId === 'dvoboj' ? '<p class="mini" style="margin-top:14px">Igralca se izmenjujeta: naprava potuje od enega do drugega. Vprašanja so za oba enako težka.</p>' : '') +
    '</div>';
  povej('zamisljeno', 'Izberi področje ali pusti, da vprašanja pomešam.');
  pokaziZaslon(scrPodrocja);
}

/* ======================= KROG ============================================ */
let tek = null, ura = null;

function zacni(nacinId, kat){
  const n = NACINI[nacinId];
  let rnd = null;
  if (n.dnevni) rnd = nakljucnik(seme(danes()));
  tek = {
    nacin: nacinId, n, kat: kat || null, i:0, ok:0, znaki:[], videni:{}, sest:null,
    odgovorjeno:false, rnd, konec:false, igralec:0, rezultat:[0, 0],
    pomoc:{ pol:true, namig:true, zamenjaj:true }, namigVid:false, skriti:[],
    doKonca: n.cas || 0, zacetek: Date.now(), napake:[]
  };
  if (ura){ clearInterval(ura); ura = null; }
  if (n.cas){
    ura = setInterval(() => {
      if (!tek || tek.konec){ clearInterval(ura); ura = null; return; }
      const ostalo = Math.max(0, n.cas - Math.floor((Date.now() - tek.zacetek) / 1000));
      tek.doKonca = ostalo;
      const el = document.getElementById('casBar');
      if (el){
        el.style.width = (ostalo / n.cas * 100) + '%';
        el.parentNode.classList.toggle('malo', ostalo <= 10);
      }
      if (ostalo <= 0) konecKroga();
    }, 250);
  }
  naslednje();
}

function stopnjaZaVprasanje(){
  const n = tek.n;
  if (n.dnevni) return 2;                    /* izziv dneva je za vse enak, ne glede na napredek */
  if (n.varne){                              /* lestvica: iz stopničke sledi zahtevnost */
    return tek.i < 4 ? 1 : tek.i < 8 ? 2 : 3;
  }
  if (n.hitro) return Math.min(2, stopnjaPodrocja(tek.kat || 'mesano'));
  if (tek.kat) return stopnjaPodrocja(tek.kat);
  return stopnjaPodrocja('mesano');
}

function naslednje(){
  const n = tek.n;
  if (!n.cas && tek.i >= n.st) return konecKroga();
  const q = izberiVprasanje(tek.kat, stopnjaZaVprasanje(), tek.videni, tek.rnd);
  tek.videni[q.v] = 1;
  const stMoz = (n.tip === 'drzi') ? 2 : (STANJE.tezavnost === 'lahko' ? 3 : 4);
  if (n.tip === 'drzi'){
    const r = tek.rnd || Math.random;
    const drzi = r() < 0.5;
    const ponujen = drzi ? q.o : ena(q.n);
    tek.sest = { q, drzi, ponujen, opts:[{ txt:'Drži ✅' }, { txt:'Ne drži ❌' }], a: drzi ? 0 : 1 };
  } else {
    const s = sestavi(q, stMoz, tek.rnd);
    tek.sest = { q, opts: s.opts.map(x => ({ txt:x })), a: s.a };
  }
  tek.odgovorjeno = false; tek.namigVid = false; tek.skriti = [];
  narisiVprasanje();
}

function pikice(){
  const n = tek.n;
  if (n.cas) return '<div class="pill">✅ <b>' + tek.ok + '</b></div>';
  let s = '';
  for (let i = 0; i < n.st; i++){
    const z = tek.znaki[i];
    s += '<span class="dot ' + (z === 1 ? 'ok' : z === 0 ? 'no' : (i === tek.i ? 'now' : '')) + '"></span>';
  }
  return '<div class="dots">' + s + '</div>';
}

function lestev(){
  let s = '<div class="lestev">';
  for (let i = 0; i < tek.n.st; i++){
    const varna = tek.n.varne.indexOf(i + 1) >= 0;
    s += '<div class="stopnicka' + (i === tek.i ? ' zdaj' : (i < tek.i ? ' mimo' : '')) + (varna ? ' varna' : '') + '">' +
      (varna ? '🔒' : (i + 1)) + '</div>';
  }
  const teza = tek.i < 4 ? 'lahko' : tek.i < 8 ? 'srednje' : 'težko';
  return s + '</div><p class="mini">' + (tek.i + 1) + '. stopnička · ' + teza +
    ' · pri 🔒 se rezultat shrani, tudi če pozneje zgrešiš</p>';
}

function narisiVprasanje(){
  const n = tek.n, s = tek.sest, q = s.q, pod = PO_PODROCJU[q.k];
  const crke = ['A', 'B', 'C', 'D'];
  const vprasanje = (n.tip === 'drzi')
    ? esc(q.v) + '<br><span style="color:var(--acc)">' + esc(s.ponujen) + '</span>'
    : esc(q.v);
  scrIgra.innerHTML =
    '<div class="hud"><button class="btn btn-ghost" id="nazajIgre">⬅️</button>' + pikice() +
      '<span class="spacer"></span><span class="pill">' + n.emo + ' ' + esc(n.nm) + '</span></div>' +
    maskotaZOblackom('uvod-igra') +
    (n.cas ? '<div class="cas"><i id="casBar" style="width:' + (tek.doKonca / n.cas * 100) + '%"></i></div>' : '') +
    (n.dvoboj ? '<div class="igralca">' +
        '<div class="igralec' + (tek.igralec === 0 ? ' naVrsti' : '') + '" style="--ig:var(--i1);--ig-d:var(--i1-d)">' +
          '<span class="naznak">' + (tek.igralec === 0 ? 'na vrsti' : '') + '</span>1. igralec<b>' + tek.rezultat[0] + '</b></div>' +
        '<div class="igralec' + (tek.igralec === 1 ? ' naVrsti' : '') + '" style="--ig:var(--i2);--ig-d:var(--i2-d)">' +
          '<span class="naznak">' + (tek.igralec === 1 ? 'na vrsti' : '') + '</span>2. igralec<b>' + tek.rezultat[1] + '</b></div>' +
      '</div><div class="dvobojCrta" style="--ig:var(--i' + (tek.igralec + 1) + ')"></div>' : '') +
    (n.varne ? lestev() : '') +
    '<div class="card">' +
      (n.pomoc ? '<div class="pomoci">' +
        '<button class="pomoc" data-pomoc="pol"' + (tek.pomoc.pol ? '' : ' disabled') + '>50 : 50</button>' +
        '<button class="pomoc" data-pomoc="namig"' + (tek.pomoc.namig ? '' : ' disabled') + '>💡 namig</button>' +
        '<button class="pomoc" data-pomoc="zamenjaj"' + (tek.pomoc.zamenjaj ? '' : ' disabled') + '>🔄 zamenjaj</button>' +
      '</div>' : '') +
      '<p class="q" style="--c:' + pod.c + '"><span class="kat">' + pod.emo + ' ' + esc(pod.nm) +
        (n.tip === 'drzi' ? ' · drži ali ne drži?' : '') + '</span>' + vprasanje + '</p>' +
      '<div class="opts' + (s.opts.length === 2 ? ' dva' : '') + '" id="opts">' +
        s.opts.map((o, i) => '<button class="opt" data-i="' + i + '" style="--i:' + i + '">' +
          (s.opts.length > 2 ? '<span class="crka">' + crke[i] + '</span>' : '') +
          '<span>' + esc(o.txt) + '</span></button>').join('') +
      '</div>' +
      '<div class="odziv" id="odziv"></div>' +
    '</div>';
  povej('zamisljeno', ena(['Premisli v miru.', 'Preberi vse možnosti.', 'Kaj praviš?',
    'Če ne veš, ugibaj pametno.', 'Za vsak odgovor sledi razlaga.']));
  pokaziZaslon(scrIgra);
}

function odgovori(izbran){
  if (tek.odgovorjeno || tek.konec) return;
  const n = tek.n, s = tek.sest, q = s.q;
  const prav = (izbran === s.a);
  tek.odgovorjeno = true;
  tek.znaki[tek.i] = prav ? 1 : 0;
  if (prav){ tek.ok++; STANJE.zvezde++; zvOk(); } else { tek.napake.push(s); zvNe(); }
  if (n.dvoboj && prav) tek.rezultat[tek.igralec]++;
  zabelezi(q, prav);
  if (!n.dnevni && !n.dvoboj) prilagodi(tek.kat || 'mesano', prav);
  shrani(); narisiZvezde();

  zaigraj($('opts').closest('.card'), prav ? 'blisk' : 'trese');
  povej(prav ? 'veselo' : 'zalostno', prav
    ? ena(['Točno tako!', 'Odlično!', 'Bravo, tako je!', 'Kar tako naprej!'])
    : ena(['Nič hudega, poglejva razlago.', 'Tega si zdaj zapomniva.', 'Naslednjič bo šlo.']));

  const gumbi = $('opts').querySelectorAll('.opt');
  gumbi.forEach((b, i) => {
    b.disabled = true;
    if (i === s.a) b.classList.add('ok');
    else if (i === izbran) b.classList.add('no');
  });

  if (n.hitro){                     /* pri hitrem ognju ne ustavljamo – takoj naprej */
    /* Skok velja samo za ta krog: če igralec vmes začne drugega, se zaostali časovnik
       ne sme dotakniti novega – sicer bi mu preskočil prvo vprašanje. */
    const mojKrog = tek;
    setTimeout(() => { if (tek === mojKrog && !tek.konec){ tek.i++; naslednje(); } }, prav ? 350 : 800);
    if (!prav) $('odziv').innerHTML = '<span style="color:var(--no-d)">Pravilno: ' + esc(q.o) + '</span>';
    return;
  }

  const razlaga = (n.tip === 'drzi')
    ? 'Pravilen odgovor je: <b>' + esc(q.o) + '</b>.' + (q.zn ? ' ' + esc(q.zn) : '')
    : (q.zn ? esc(q.zn) : '');
  const zadnje = !n.cas && (tek.i + 1 >= n.st);
  const konecZaradiNapake = (n.konec === 'takoj' && !prav);
  $('odziv').innerHTML =
    (prav ? '<span style="color:var(--ok-d)">Točno! 🎉</span>' : '<span style="color:var(--no-d)">Ni pravilno.</span>') +
    (razlaga ? '<span class="zakaj">' + razlaga + '</span>' : '') +
    '<div style="margin-top:12px"><button class="btn btn-acc" id="naprej">' +
      (konecZaradiNapake || zadnje ? 'Zaključi ✅' : 'Naprej ➡️') + '</button></div>';
  if (prav && STANJE.zvezde % 10 === 0){ poskoci('⭐'); }
  if (n.varne && prav && n.varne.indexOf(tek.i + 1) >= 0){ poskoci('🔒'); zvVrh(); }
}

function naprej(){
  const n = tek.n;
  if (n.konec === 'takoj' && tek.znaki[tek.i] === 0) return konecKroga();
  tek.i++;
  if (n.dvoboj) tek.igralec = tek.i % 2;
  if (!n.cas && tek.i >= n.st) return konecKroga();
  naslednje();
}

function uporabiPomoc(kaj){
  if (!tek || tek.odgovorjeno || !tek.pomoc[kaj]) return;
  const s = tek.sest;
  if (kaj === 'pol'){
    const napacni = s.opts.map((o, i) => i).filter(i => i !== s.a);
    const skrij = premesaj(napacni).slice(0, Math.max(1, s.opts.length - 2));
    skrij.forEach(i => $('opts').querySelector('.opt[data-i="' + i + '"]').classList.add('skrit'));
  } else if (kaj === 'namig'){
    const q = s.q;
    const besedilo = q.zn ? q.zn : 'Pravilni odgovor se začne na črko »' + q.o.charAt(0).toUpperCase() + '«.';
    $('odziv').innerHTML = '<span class="zakaj">💡 ' + esc(besedilo) + '</span>';
  } else if (kaj === 'zamenjaj'){
    tek.pomoc.zamenjaj = false;
    naslednje();
    return;
  }
  tek.pomoc[kaj] = false;
  const g = document.querySelector('[data-pomoc="' + kaj + '"]');
  if (g) g.disabled = true;
}

function konecKroga(){
  if (tek.konec) return;
  tek.konec = true;
  if (ura){ clearInterval(ura); ura = null; }
  const n = tek.n;
  STANJE.iger++;
  zvKonec();

  let naslov = '', emo = '🎉', podnaslov = '', del = 0;
  if (n.dvoboj){
    const [a, b] = tek.rezultat;
    naslov = a + ' : ' + b;
    emo = a === b ? '🤝' : '🏆';
    podnaslov = a === b ? 'Neodločeno!' : (a > b ? 'Zmagal je 1. igralec!' : 'Zmagal je 2. igralec!');
    STANJE.rek.dvoboj = (STANJE.rek.dvoboj || 0) + 1;
  } else if (n.varne){
    const dosezena = tek.i;   /* stopnička, do katere je igralec prišel */
    let varna = 0;
    for (const v of n.varne) if (dosezena >= v) varna = v;
    naslov = dosezena + '. stopnička';
    emo = dosezena >= n.st ? '👑' : dosezena >= 8 ? '🏆' : dosezena >= 4 ? '🎉' : '💪';
    podnaslov = dosezena >= n.st ? 'Prišel si čisto na vrh!' :
      (varna ? 'Zadnja varna stopnička: ' + varna + '.' : 'Naslednjič dlje!');
    if ((STANJE.rek.lestvica || 0) < dosezena) STANJE.rek.lestvica = dosezena;
    del = dosezena / n.st;
  } else if (n.cas){
    naslov = tek.ok + ' pravilnih';
    emo = tek.ok >= 15 ? '🔥' : tek.ok >= 8 ? '🎉' : '💪';
    podnaslov = 'v eni minuti';
    if ((STANJE.rek.hitri || 0) < tek.ok){ STANJE.rek.hitri = tek.ok; podnaslov += ' – nov rekord! 🏅'; }
    del = Math.min(1, tek.ok / 20);
  } else {
    naslov = tek.ok + ' od ' + n.st;
    del = tek.ok / n.st;
    emo = del === 1 ? '🏆' : del >= 0.8 ? '🎉' : del >= 0.5 ? '👍' : '💪';
    if (n.dnevni){
      STANJE.rek.izziv = tek.ok;
      const prej = STANJE.izziv[danes()] || 0;
      if (tek.ok > prej) STANJE.izziv[danes()] = tek.ok;
      podnaslov = 'Današnji izziv · najboljši rezultat danes: ' + STANJE.izziv[danes()] + '/10';
    } else if ((STANJE.rek[tek.nacin] || 0) < tek.ok) STANJE.rek[tek.nacin] = tek.ok;
  }
  shrani();

  const napake = tek.napake.length
    ? '<h2 class="section">Kar si se naučil</h2><ul class="seznam">' +
      tek.napake.slice(0, 6).map(s => '<li>' + esc(s.q.v) + ' <b>' + esc(s.q.o) + '</b></li>').join('') + '</ul>'
    : '<p class="mini" style="margin-top:12px">Brez napake – odlično! 🌟</p>';

  const zvezd = del >= 0.9 ? 3 : del >= 0.65 ? 2 : del >= 0.35 ? 1 : 0;
  const obseg = 2 * Math.PI * 52;
  const glava = n.dvoboj
    ? '<div class="rezultat"><span class="a">' + tek.rezultat[0] + '</span> : ' +
      '<span class="b">' + tek.rezultat[1] + '</span></div>'
    : '<div class="obroc"><svg viewBox="0 0 120 120" aria-hidden="true">' +
        '<circle class="sled" cx="60" cy="60" r="52"></circle>' +
        '<circle class="del" id="obrocDel" cx="60" cy="60" r="52" stroke-dasharray="' + obseg.toFixed(1) +
          '" stroke-dashoffset="' + obseg.toFixed(1) + '"></circle>' +
      '</svg><span class="odst">' + Math.round(del * 100) + '\u00a0%</span></div>' +
      '<div class="zvezdice" aria-label="' + zvezd + ' od 3 zvezdic">' +
        [0, 1, 2].map(i => '<span class="' + (i < zvezd ? '' : 'prazna') +
          '" style="animation-delay:' + (0.35 + i * 0.3).toFixed(2) + 's">\u2b50</span>').join('') +
      '</div>';

  scrIgra.innerHTML =
    '<div class="card konec">' +
      maskotaZOblackom('') +
      glava +
      '<h3>' + emo + ' ' + esc(naslov) + '</h3>' +
      (podnaslov ? '<p class="mini">' + esc(podnaslov) + '</p>' : '') +
      napake +
      '<div class="row" style="justify-content:center;margin-top:16px">' +
        '<button class="btn btn-acc" id="spet">Še enkrat 🔁</button>' +
        '<button class="btn btn-ghost" id="domov">Domov</button>' +
      '</div>' +
    '</div>';
  pokaziZaslon(scrIgra);
  /* obroč zraste šele po izrisu, da se prehod res vidi */
  setTimeout(() => { const o = $('obrocDel'); if (o) o.style.strokeDashoffset = (obseg * (1 - del)).toFixed(1); }, 80);
  const odlicno = zvezd === 3 || (n.dvoboj && tek.rezultat[0] + tek.rezultat[1] > 0);
  if (odlicno) konfeti(n.dvoboj ? 40 : 70);
  povej(zvezd >= 2 || n.dvoboj ? 'veselo' : zvezd === 1 ? 'pozdrav' : 'zamisljeno',
    n.dvoboj ? podnaslov
      : zvezd === 3 ? 'Čudovito, tri zvezdice!' :
        zvezd === 2 ? 'Lepo si se odrezal!' :
        zvezd === 1 ? 'Dobro, pa še vadiva.' : 'Nič hudega – vaja dela mojstra.');
}

/* ======================= NASTAVITVE ====================================== */
function odpriNastavitve(){
  $('modalBox').innerHTML =
    '<h3 style="margin:0 0 6px;font-size:22px">Kotiček za starše ⚙️</h3>' +
    '<p class="mini" style="margin-bottom:14px">Vse ostane na tej napravi. Nič se ne pošilja na internet.</p>' +
    '<h2 class="section" style="margin-top:0">Težavnost</h2>' +
    '<div class="levels">' +
      [['auto','Samodejno','prilagaja se odgovorom'],
       ['lahko','Lahko','lažja vprašanja, tri možnosti'],
       ['srednje','Srednje','mešano'],
       ['tezko','Težko','samo najtežja vprašanja']].map(([id, nm, op]) =>
        '<button class="level" data-tez="' + id + '" aria-pressed="' + (STANJE.tezavnost === id) + '">' +
        nm + '<small>' + op + '</small></button>').join('') +
    '</div>' +
    '<h2 class="section">Drugo</h2>' +
    '<div class="levels"><button class="level" data-stikalo="zvok" aria-pressed="' + (STANJE.zvok ? 'true' : 'false') +
      '" style="grid-column:1/-1;text-align:left">Zvok<small>piski ob pravilnem in napačnem odgovoru</small></button></div>' +
    '<div class="row" style="margin-top:16px;justify-content:space-between">' +
      '<button class="btn btn-ghost" id="pobrisi">Ponastavi napredek</button>' +
      '<button class="btn btn-acc" id="zapri">Zapri</button>' +
    '</div>';
  $('modal').hidden = false;
}

/* ======================= DOGODKI ========================================= */
let izbraniNacin = null;
document.addEventListener('click', e => {
  const n = e.target.closest('[data-nacin]');
  if (n){ izbraniNacin = n.dataset.nacin;
    if (NACINI[izbraniNacin].dnevni) zacni(izbraniNacin, null); else narisiPodrocja(izbraniNacin);
    return; }
  const k = e.target.closest('[data-kat]');
  if (k){ zacni(izbraniNacin, k.dataset.kat || null); return; }
  if (e.target.closest('#nazajDomov') || e.target.closest('#domov')){ if (ura){ clearInterval(ura); ura = null; } if (tek) tek.konec = true; narisiDomov(); return; }
  if (e.target.closest('#nazajIgre')){ if (ura){ clearInterval(ura); ura = null; } tek.konec = true;
    if (izbraniNacin && !NACINI[izbraniNacin].dnevni) narisiPodrocja(izbraniNacin); else narisiDomov(); return; }
  if (e.target.closest('#spet')){ zacni(tek.nacin, tek.kat); return; }
  if (e.target.closest('#naprej')){ naprej(); return; }
  const p = e.target.closest('[data-pomoc]');
  if (p){ uporabiPomoc(p.dataset.pomoc); return; }
  const o = e.target.closest('#opts .opt');
  if (o && tek && !tek.odgovorjeno){ odgovori(+o.dataset.i); return; }
  if (e.target.closest('#gumbZvok')){ STANJE.zvok = !STANJE.zvok; shrani(); narisiZvok(); return; }
  if (e.target.closest('#gumbNast')){ odpriNastavitve(); return; }
  const t = e.target.closest('[data-tez]');
  if (t){ STANJE.tezavnost = t.dataset.tez; shrani(); odpriNastavitve(); return; }
  const s = e.target.closest('[data-stikalo]');
  if (s){ STANJE[s.dataset.stikalo] = !STANJE[s.dataset.stikalo]; shrani(); narisiZvok(); odpriNastavitve(); return; }
  if (e.target.closest('#pobrisi')){
    if (confirm('Res izbrišem ves napredek in zvezdice?')){
      STANJE = Object.assign({}, SVEZE, { st:{}, gor:{}, dol:{}, stat:{}, slabo:{}, rek:{}, izziv:{} });
      shrani(); narisiZvezde(); narisiZvok(); $('modal').hidden = true; narisiDomov();
    }
    return;
  }
  if (e.target.closest('#zapri') || e.target === $('modal')){ $('modal').hidden = true; return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').hidden){ $('modal').hidden = true; return; }
  if (!tek || tek.konec || scrIgra.hidden) return;
  if (tek.odgovorjeno && (e.key === 'Enter' || e.key === ' ')){ const g = $('naprej'); if (g){ e.preventDefault(); naprej(); } return; }
  const i = ['1','2','3','4'].indexOf(e.key);
  if (i >= 0 && !tek.odgovorjeno && tek.sest && i < tek.sest.opts.length) odgovori(i);
});

$('maskoGlava').innerHTML = maskotaSvg('mini');
narisiZvezde();
narisiZvok();
narisiDomov();

</script>
</body>
</html>

<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vseved – kviz za vso družino</title>
<meta name="description" content="Kviz v slovenščini za otroke in odrasle: dvanajst področij, več kot 300 vprašanj z razlago, lestvica do vrha, hitri ogenj, dvoboj za dva in izziv dneva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- pisava se naloži ob strani: če je omrežje počasno ali ga ni, se stran izriše
     takoj s sistemsko pisavo in ne čaka -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      media="print" onload="this.media='all'">
<meta name="theme-color" content="#c2255c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2b1b2c; --ink-soft:#6d5a70;
  --card:#ffffff;
  --line:#f0e2ea;
  --ok:#1eb872; --ok-d:#159a5e;
  --no:#f2762e; --no-d:#d55f1c;
  --acc:#c2255c; --acc-d:#9c1c49;
  --acc2:#6d28d9; --acc2-d:#5620ac;
  --gold:#ffb703;
  --r:22px;
}
html,body{height:100%}
body{
  margin:0;
  font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:#fdf1f6;
  background-image:
    radial-gradient(1100px 700px at 8% -10%, #ffdfec 0%, transparent 60%),
    radial-gradient(900px 620px at 100% 0%, #e6e0ff 0%, transparent 55%),
    radial-gradient(900px 700px at 50% 115%, #fff0d8 0%, transparent 60%);
  background-attachment:fixed;
  min-height:100dvh;
  overflow-x:hidden;
}
.wrap{max-width:800px;margin:0 auto;position:relative;z-index:2;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px))
          calc(34px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--card);border-radius:18px;padding:14px 20px;font-weight:900;font-size:19px;line-height:1;
  box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d)}
.btn-acc:active{box-shadow:0 1px 0 var(--acc-d)}
.btn-ghost{background:rgba(255,255,255,.82)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.top{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900}
.brand .glava{font-size:34px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:999px;
  padding:9px 15px;font-weight:900;box-shadow:0 4px 0 var(--line);font-size:17px;white-space:nowrap}
.pill.gold{color:#a86b00}
.icon-btn{width:46px;height:46px;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);
  display:grid;place-items:center;font-size:21px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(43,27,44,.10)}
h2.section{font-size:19px;margin:22px 4px 10px;font-weight:900;color:var(--ink-soft)}
.lead{margin:0 0 12px;font-weight:700;color:var(--ink-soft);font-size:15.5px;line-height:1.5}
.mini{font-size:13.5px;font-weight:700;color:var(--ink-soft);line-height:1.5;margin:0}

/* načini igre */
.nacini{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.nacin{position:relative;text-align:left;background:#fff;border-radius:20px;padding:15px 16px;
  box-shadow:0 6px 0 var(--line);transition:transform .1s;overflow:hidden}
.nacin:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.nacin .emo{font-size:32px;display:block;margin-bottom:4px}
.nacin .nm{font-weight:900;font-size:18px;display:block}
.nacin .sub{font-size:13px;color:var(--ink-soft);font-weight:700;display:block;margin-top:3px;line-height:1.35}
.nacin .rek{font-size:12.5px;font-weight:900;color:var(--c,var(--acc));display:block;margin-top:6px}
.nacin::after{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c,var(--acc))}

/* področja */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:10px 15px;font-weight:900;font-size:15.5px;box-shadow:0 4px 0 var(--line)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip .del{font-size:12.5px;font-weight:900;color:var(--ink-soft)}
.chip.vse{background:var(--acc);color:#fff;border-color:var(--acc-d);box-shadow:0 4px 0 var(--acc-d)}

/* igra */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:999px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}.dot.now{background:var(--acc);transform:scale(1.25)}
.cas{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 12px}
.cas i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));transition:width .25s linear}
.cas.malo i{background:var(--no)}
.q{font-size:clamp(19px,4.4vw,25px);font-weight:900;line-height:1.32;margin:2px 0 14px;text-wrap:balance}
.q .kat{display:block;font-size:13.5px;font-weight:900;color:var(--c,var(--acc));margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.dva{grid-template-columns:repeat(2,1fr)}
.opt{background:#fdf7fa;border:2px solid var(--line);border-radius:18px;padding:15px 16px;font-weight:800;
  font-size:17.5px;box-shadow:0 5px 0 var(--line);transition:transform .08s;text-align:left;line-height:1.3;
  display:flex;align-items:center;gap:11px}
.opt .crka{flex:none;width:30px;height:30px;border-radius:999px;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:16px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok-d);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.opt.no{background:var(--no);border-color:var(--no-d);color:#fff;box-shadow:0 5px 0 var(--no-d)}
.opt.ok .crka,.opt.no .crka{background:rgba(255,255,255,.3)}
.opt.skrit{opacity:.25;pointer-events:none}
.opt[disabled]{pointer-events:none}
.odziv{margin-top:14px;font-weight:900;font-size:17px;min-height:26px;line-height:1.45}
.odziv .zakaj{display:block;font-weight:800;font-size:14.5px;color:var(--ink-soft);margin-top:5px}

/* pomoč pri lestvici */
.pomoci{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.pomoc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 13px;font-weight:900;font-size:14.5px;
  box-shadow:0 4px 0 var(--line)}
.pomoc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pomoc[disabled]{opacity:.4;pointer-events:none;text-decoration:line-through}
.lestev{display:flex;gap:4px;margin:0 0 6px}
.lestev + .mini{margin:0 0 12px 2px}
.stopnicka{flex:1;min-width:20px;text-align:center;font-weight:900;font-size:12.5px;color:var(--ink-soft);
  background:#fff;border-radius:9px;padding:7px 2px;box-shadow:0 3px 0 var(--line)}
.stopnicka.zdaj{background:var(--acc);color:#fff}
.stopnicka.mimo{background:#eafaf1;color:var(--ok-d)}
.stopnicka.varna{outline:2px dashed var(--gold)}

/* dvoboj */
.igralca{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.igralec{background:#fff;border-radius:16px;padding:10px 12px;text-align:center;font-weight:900;
  box-shadow:0 4px 0 var(--line)}
.igralec b{display:block;font-size:26px;color:var(--acc)}
.igralec.naVrsti{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-d)}
.igralec.naVrsti b{color:#fff}

.konec{text-align:center}
.konec .big{font-size:56px;line-height:1;margin-bottom:8px}
.konec h3{font-size:26px;margin:0 0 6px;font-weight:900}
.seznam{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;text-align:left}
.seznam li{background:#fdf3f7;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14.5px;line-height:1.4}
.seznam li b{color:var(--acc-d)}
.znanje{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vrstica{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px}
.vrstica .im{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrstica .bar{width:120px;height:9px;background:var(--line);border-radius:999px;overflow:hidden;flex:none}
.vrstica .bar i{display:block;height:100%;background:var(--c,var(--acc))}
.vrstica .st{width:52px;text-align:right;color:var(--ink-soft);font-size:13px;flex:none}

.modal{position:fixed;inset:0;background:rgba(43,27,44,.45);display:grid;place-items:center;padding:18px;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:22px;padding:20px;max-width:520px;width:100%;
  box-shadow:0 18px 50px rgba(43,27,44,.35);max-height:86dvh;overflow:auto}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.level{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;font-weight:900;
  box-shadow:0 5px 0 var(--line)}
.level small{display:block;font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:3px}
.level[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d)}
.level[aria-pressed="true"] small{color:#ffe1ec}

.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:76px;pointer-events:none;
  animation:pop .85s ease-out forwards;z-index:30}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:430px){ .opt{font-size:16px;padding:13px 13px} .opts.dva{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="glava">🧠</span><span>Vseved</span></div>
    <span class="spacer"></span>
    <span class="pill gold" title="zbrane zvezdice">⭐ <b id="zvezde">0</b></span>
    <button class="icon-btn" id="gumbNast" title="Nastavitve" aria-label="Nastavitve">⚙️</button>
  </div>

  <main id="scrDomov"></main>
  <main id="scrPodrocja" hidden></main>
  <main id="scrIgra" hidden></main>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>

<script>

/* ======================= ZBIRKA VPRAŠANJ ==================================
   k  = področje, t = zahtevnost (1 lahko, 2 srednje, 3 težko)
   v  = vprašanje, o = pravilen odgovor, n = trije napačni, zn = razlaga    */
const VPRASANJA = [];
function q(k, t, v, o, n, zn){ VPRASANJA.push({ k, t, v, o, n, zn: zn || '' }); }

/* ---------------------- NARAVA IN ŽIVALI -------------------------------- */
q('narava',1,'Koliko nog ima pajek?','osem',['šest','deset','štiri'],'Žuželke imajo šest nog, pajki pa osem – zato pajek ni žuželka.');
q('narava',1,'Koliko nog ima žuželka?','šest',['osem','štiri','deset'],'Mravlja, čebela in hrošč imajo vsi po šest nog.');
q('narava',1,'Katera je največja žival na svetu?','modri kit',['afriški slon','beli morski pes','žirafa'],'Modri kit zraste do 30 metrov – dlje kot dva avtobusa.');
q('narava',1,'Katera je največja kopenska žival?','afriški slon',['nosorog','povodni konj','žirafa'],'Tehta lahko več kot šest ton.');
q('narava',1,'Katera žival ima najdaljši vrat?','žirafa',['kamela','noj','lama'],'Kljub dolžini ima žirafa v vratu enako število vretenc kot človek – sedem.');
q('narava',1,'Katera je najhitrejša kopenska žival?','gepard',['lev','konj','antilopa'],'Na kratke razdalje teče več kot 100 km na uro.');
q('narava',1,'Katera ptica ne more leteti?','noj',['sokol','lastovka','galeb'],'Noj namesto tega zelo hitro teče.');
q('narava',1,'Kaj jedo pande?','bambus',['ribe','meso','žita'],'Panda poje tudi po 12 ur na dan.');
q('narava',1,'Katera žival nosi mladiča v vreči?','kenguru',['koala','opica','medved'],'Mladič ostane v vreči več mesecev.');
q('narava',1,'Kateri sesalec zna leteti?','netopir',['veverica','podlasica','miš'],'Netopir se v temi znajde z odbojem zvoka.');
q('narava',1,'Kaj naredijo čebele iz cvetnega nektarja?','med',['vosek','smolo','mleko'],'Za kilogram medu obletijo na milijone cvetov.');
q('narava',1,'Kaj postane gosenica?','metulj',['čebela','kobilica','pajek'],'Vmes se zapre v bubo.');
q('narava',1,'S čim dihajo ribe?','s škrgami',['s pljuči','s kožo','z usti'],'Škrge iz vode jemljejo raztopljen kisik.');
q('narava',1,'Katera žival se seli in se spomladi vrne v Slovenijo?','lastovka',['vrabec','sinica','vrana'],'Prezimi v Afriki.');
q('narava',2,'Koliko src ima hobotnica?','tri',['eno','dve','osem'],'Dve poganjata kri skozi škrge, eno po telesu.');
q('narava',2,'Kaj je delfin?','sesalec',['riba','dvoživka','plazilec'],'Diha z pljuči in mladiče doji.');
q('narava',2,'Katera žival gradi jezove na potokih?','bober',['vidra','pižmovka','jazbec'],'Z jezom si naredi globoko vodo pred vhodom v brlog.');
q('narava',2,'Katera žival lahko spremeni barvo kože?','kameleon',['gekon','krokodil','želva'],'Barvo spremeni tudi zaradi razpoloženja in temperature, ne le zaradi okolice.');
q('narava',2,'Kje živijo pingvini?','na južni polobli',['na Arktiki','v Sredozemlju','v Sibiriji'],'Severni medved in pingvin se v naravi nikoli ne srečata.');
q('narava',2,'Kje živi severni medved?','na Arktiki',['na Antarktiki','v Alpah','v Avstraliji'],'Njegova koža pod belim kožuhom je črna.');
q('narava',2,'Kateri medved živi v Sloveniji?','rjavi medved',['severni medved','panda','črni medved'],'Največ jih je v kočevskih gozdovih.');
q('narava',2,'Katera žival v puščavi najdlje zdrži brez vode?','kamela',['konj','osel','antilopa'],'V grbi ima maščobo, ne vode.');
q('narava',2,'Katero drevo je znano kot slovensko narodno drevo?','lipa',['hrast','smreka','bukev'],'Lipov list je pogost slovenski znak.');
q('narava',2,'Katero drevo zraste najvišje na svetu?','sekvoja',['hrast','bor','evkaliptus'],'Zraste več kot 100 metrov.');
q('narava',2,'Kaj je fotosinteza?','ko rastlina iz svetlobe, vode in zraka naredi hrano',['ko rastlina pije vodo iz tal','ko rastlina odvrže liste','ko rastlina zraste ponoči'],'Pri tem se sprošča kisik, ki ga dihamo.');
q('narava',2,'Kaj rastline sproščajo pri fotosintezi?','kisik',['ogljikov dioksid','dušik','vodik'],'Zato pravimo, da so gozdovi pljuča planeta.');
q('narava',2,'Katera ptica ponoči lovi miši?','sova',['golob','kos','škorec'],'Ima izjemno mehko perje, zato leti skoraj neslišno.');
q('narava',2,'Katera ptica kljuva v deblo?','detel',['vrabec','lastovka','labod'],'Z močnim kljunom pod lubjem išče žuželke.');
q('narava',2,'Katera žival je znana po črnobelih progah?','zebra',['tiger','panda','gepard'],'Vsaka zebra ima svoj vzorec prog, tako kot mi prstne odtise.');
q('narava',3,'Katera je največja riba na svetu?','morski pes kitovec',['beli morski pes','tun','som'],'Zraste do 12 metrov, hrani pa se z drobnim planktonom.');
q('narava',3,'Kaj je človeška ribica?','dvoživka, ki živi v jamah',['riba iz Jadrana','vrsta polža','jamski pajek'],'V Postojnski jami lahko brez hrane preživi več let.');
q('narava',3,'Koliko let lahko živi želva?','več kot sto',['okoli deset','okoli dvajset','okoli petdeset'],'Nekatere kopenske želve so dočakale več kot 150 let.');
q('narava',3,'Katera slovenska čebela je znana po vsem svetu?','kranjska sivka',['štajerska zlatica','primorska temnica','gorenjska rjavka'],'Je druga najbolj razširjena čebelja pasma na svetu.');
q('narava',3,'Kaj je koralni greben?','skupnost drobnih živali, ki gradijo apnenčasto ogrodje',['podvodna gora iz kamna','vrsta morske trave','pas peska ob obali'],'Največji je Veliki koralni greben ob Avstraliji.');
q('narava',3,'Katera žival ima najmočnejši ugriz?','krokodil',['lev','morski pes','medved'],'Čeljusti odpira zelo šibko – z eno roko jih je mogoče zadržati zaprte.');
q('narava',3,'Zakaj imajo listi jeseni rumeno in rdečo barvo?','ker drevo razgradi zeleno barvilo',['ker liste pobarva mraz','ker se listi posušijo od sonca','ker jih pobarva dež'],'Zeleni klorofil razpade, ostanejo pa rumena in rdeča barvila.');
q('narava',3,'Kaj je opraševanje?','prenos cvetnega prahu s cveta na cvet',['zalivanje rastlin','obrezovanje vej','sajenje semen'],'Brez čebel in drugih opraševalcev bi ostali brez večine sadja.');
q('narava',3,'Kateri je največji ptičji jajček na svetu?','nojevo jajce',['labodje jajce','pingvinovo jajce','orlovo jajce'],'Tehta okoli 1,5 kilograma.');

/* ---------------------- ČLOVEŠKO TELO ----------------------------------- */
q('telo',1,'Kateri organ poganja kri po telesu?','srce',['pljuča','jetra','ledvice'],'Srce v enem dnevu udari približno 100 000-krat.');
q('telo',1,'S čim dihamo?','s pljuči',['z jetri','s srcem','z želodcem'],'V pljučih kri prevzame kisik in odda ogljikov dioksid.');
q('telo',1,'Koliko čutov ima človek?','pet',['tri','sedem','deset'],'Vid, sluh, voh, okus in tip.');
q('telo',1,'Kateri organ nadzoruje vse telo?','možgani',['srce','želodec','koža'],'Do telesa pošiljajo ukaze po živcih.');
q('telo',1,'Kateri je največji človeški organ?','koža',['jetra','pljuča','možgani'],'Odraslega človeka pokriva približno dva kvadratna metra kože.');
q('telo',1,'Kaj varuje možgane?','lobanja',['rebra','hrbtenica','medenica'],'Rebra varujejo srce in pljuča.');
q('telo',1,'Koliko prstov ima človek na obeh rokah skupaj?','deset',['osem','dvanajst','pet'],'');
q('telo',2,'Koliko kosti ima odrasel človek?','206',['112','305','420'],'Dojenček jih ima okoli 300, nekatere se med rastjo zrastejo skupaj.');
q('telo',2,'Koliko zob ima odrasel človek?','32',['20','28','36'],'Otrok ima 20 mlečnih zob.');
q('telo',2,'Kateri organ čisti kri?','ledvici',['pljuča','srce','želodec'],'Kar nastane pri čiščenju, telo izloči z vodo.');

/* ======================= POMOŽNO ========================================= */
const R = n => Math.floor(Math.random() * n);
const ena = a => a[R(a.length)];
function premesaj(a, rnd){ a = a.slice(); const r = rnd || Math.random;
  for (let i = a.length-1; i > 0; i--){ const j = Math.floor(r() * (i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* ponovljivo naključje – za izziv dneva, ki mora biti za vse enak */
function seme(niz){ let h = 2166136261; for (let i = 0; i < niz.length; i++){ h ^= niz.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function nakljucnik(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function danes(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }

/* ======================= STANJE ========================================== */
const LS = 'vseved_kviz_v1';
const SVEZE = { zvezde:0, zvok:true, tezavnost:'auto', st:{}, gor:{}, dol:{}, stat:{}, slabo:{}, rek:{}, iger:0, izziv:{} };
let STANJE = nalozi();
function nalozi(){
  try{
    const raw = localStorage.getItem(LS);
    if (!raw) return Object.assign({}, SVEZE);
    const s = Object.assign({}, SVEZE, JSON.parse(raw));
    for (const k of ['st','gor','dol','stat','slabo','rek','izziv']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
    return s;
  } catch(e){ return Object.assign({}, SVEZE); }
}
function shrani(){ try{ localStorage.setItem(LS, JSON.stringify(STANJE)); } catch(e){} }

function stopnjaPodrocja(kat){
  if (STANJE.tezavnost !== 'auto') return { lahko:1, srednje:2, tezko:3 }[STANJE.tezavnost] || 2;
  return Math.min(3, Math.max(1, STANJE.st[kat] || 1));
}
function prilagodi(kat, prav){
  if (STANJE.tezavnost !== 'auto') return 0;
  const zdaj = stopnjaPodrocja(kat);
  if (prav){
    STANJE.gor[kat] = (STANJE.gor[kat] || 0) + 1; STANJE.dol[kat] = 0;
    if (STANJE.gor[kat] >= 4 && zdaj < 3){ STANJE.st[kat] = zdaj + 1; STANJE.gor[kat] = 0; return 1; }
  } else {
    STANJE.dol[kat] = (STANJE.dol[kat] || 0) + 1; STANJE.gor[kat] = 0;
    if (STANJE.dol[kat] >= 2 && zdaj > 1){ STANJE.st[kat] = zdaj - 1; STANJE.dol[kat] = 0; return -1; }
  }
  return 0;
}
function zabelezi(q, prav){
  const s = STANJE.stat[q.k] || (STANJE.stat[q.k] = { p:0, v:0 });
  s.v++; if (prav) s.p++;
  if (prav){ if (STANJE.slabo[q.v]){ STANJE.slabo[q.v]--; if (STANJE.slabo[q.v] <= 0) delete STANJE.slabo[q.v]; } }
  else STANJE.slabo[q.v] = Math.min(3, (STANJE.slabo[q.v] || 0) + 2);
}

/* ======================= IZBIRA VPRAŠANJ ================================= */
/* kat = id področja ali null za pomešano; stopnja določa, katere zahtevnosti pridejo v poštev */
function zaloga(kat, stopnja){
  let z = VPRASANJA.filter(q => (!kat || q.k === kat));
  const dovoljene = stopnja >= 3 ? [2, 3] : stopnja === 2 ? [1, 2, 3] : [1, 2];
  let ozji = z.filter(q => dovoljene.indexOf(q.t) >= 0);
  return ozji.length >= 4 ? ozji : z;
}
function izberiVprasanje(kat, stopnja, videni, rnd){
  const z = zaloga(kat, stopnja);
  const r = rnd || Math.random;
  const svezi = z.filter(q => !videni[q.v]);
  const izbira = svezi.length ? svezi : z;
  /* Tisto, kar je otroku že delalo težave, pride nekoliko pogosteje nazaj – razen pri
     izzivu dneva (rnd je podan), ki mora biti za vse igralce enak. */
  const slabi = rnd ? [] : izbira.filter(q => STANJE.slabo[q.v]);
  const vir = (slabi.length && r() < 0.3) ? slabi : izbira;
  return vir[Math.floor(r() * vir.length)];
}
function sestavi(q, stMoznosti, rnd){
  const napacni = premesaj(q.n, rnd).slice(0, Math.max(1, stMoznosti - 1));
  const opts = premesaj([q.o].concat(napacni), rnd);
  return { q, opts, a: opts.indexOf(q.o) };
}

let AC = null;
function ac(){ if (!AC && (window.AudioContext || window.webkitAudioContext)) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function pisk(fs, dolzina, vrsta){
  if (!STANJE.zvok) return;
  let c; try{ c = ac(); } catch(e){ return; }
  if (!c) return;
  try{
    if (c.state === 'suspended'){ const r = c.resume(); if (r && r.catch) r.catch(() => {}); }
    fs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = vrsta || 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(c.destination);
      const t = c.currentTime + i * (dolzina * 0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dolzina);
      o.start(t); o.stop(t + dolzina + 0.02);
    });
  } catch(e){}
}

/* ======================= KROG ============================================ */
let tek = null, ura = null;

function zacni(nacinId, kat){
  const n = NACINI[nacinId];
  let rnd = null;
  if (n.dnevni) rnd = nakljucnik(seme(danes()));
  tek = {
    nacin: nacinId, n, kat: kat || null, i:0, ok:0, znaki:[], videni:{}, sest:null,
    odgovorjeno:false, rnd, konec:false, igralec:0, rezultat:[0, 0],
    pomoc:{ pol:true, namig:true, zamenjaj:true }, namigVid:false, skriti:[],
    doKonca: n.cas || 0, zacetek: Date.now(), napake:[]
  };
  if (ura){ clearInterval(ura); ura = null; }
  if (n.cas){
    ura = setInterval(() => {
      if (!tek || tek.konec){ clearInterval(ura); ura = null; return; }
      const ostalo = Math.max(0, n.cas - Math.floor((Date.now() - tek.zacetek) / 1000));
      tek.doKonca = ostalo;
      const el = document.getElementById('casBar');
      if (el){
        el.style.width = (ostalo / n.cas * 100) + '%';
        el.parentNode.classList.toggle('malo', ostalo <= 10);
      }
      if (ostalo <= 0) konecKroga();
    }, 250);
  }
  naslednje();
}

function stopnjaZaVprasanje(){
  const n = tek.n;
  if (n.dnevni) return 2;                    /* izziv dneva je za vse enak, ne glede na napredek */
  if (n.varne){                              /* lestvica: iz stopničke sledi zahtevnost */
    return tek.i < 4 ? 1 : tek.i < 8 ? 2 : 3;
  }
  if (n.hitro) return Math.min(2, stopnjaPodrocja(tek.kat || 'mešano'));
  if (tek.kat) return stopnjaPodrocja(tek.kat);
  return stopnjaPodrocja('mesano');
}

function naslednje(){
  const n = tek.n;
  if (!n.cas && tek.i >= n.st) return konecKroga();
  const q = izberiVprasanje(tek.kat, stopnjaZaVprasanje(), tek.videni, tek.rnd);
  tek.videni[q.v] = 1;
  const stMoz = (n.tip === 'drzi') ? 2 : (STANJE.tezavnost === 'lahko' ? 3 : 4);
  if (n.tip === 'drzi'){
    const r = tek.rnd || Math.random;
    const drzi = r() < 0.5;
    const ponujen = drzi ? q.o : ena(q.n);
    tek.sest = { q, drzi, ponujen, opts:[{ txt:'Drži ✅' }, { txt:'Ne drži ❌' }], a: drzi ? 0 : 1 };
  } else {
    const s = sestavi(q, stMoz, tek.rnd);
    tek.sest = { q, opts: s.opts.map(x => ({ txt:x })), a: s.a };
  }
  tek.odgovorjeno = false; tek.namigVid = false; tek.skriti = [];
  narisiVprasanje();
}

function pikice(){
  const n = tek.n;
  if (n.cas) return '<div class="pill">✅ <b>' + tek.ok + '</b></div>';
  let s = '';
  for (let i = 0; i < n.st; i++){
    const z = tek.znaki[i];
    s += '<span class="dot ' + (z === 1 ? 'ok' : z === 0 ? 'no' : (i === tek.i ? 'now' : '')) + '"></span>';
  }
  return '<div class="dots">' + s + '</div>';
}

function lestev(){
  let s = '<div class="lestev">';
  for (let i = 0; i < tek.n.st; i++){
    const varna = tek.n.varne.indexOf(i + 1) >= 0;
    s += '<div class="stopnicka' + (i === tek.i ? ' zdaj' : (i < tek.i ? ' mimo' : '')) + (varna ? ' varna' : '') + '">' +
      (varna ? '🔒' : (i + 1)) + '</div>';
  }
  const teza = tek.i < 4 ? 'lahko' : tek.i < 8 ? 'srednje' : 'težko';
  return s + '</div><p class="mini">' + (tek.i + 1) + '. stopnička · ' + teza +
    ' · pri 🔒 se rezultat shrani, tudi če pozneje zgrešiš</p>';
}

function narisiVprasanje(){
  const n = tek.n, s = tek.sest, q = s.q, pod = PO_PODROCJU[q.k];
  const crke = ['A', 'B', 'C', 'D'];
  const vprasanje = (n.tip === 'drzi')
    ? esc(q.v) + '<br><span style="color:var(--acc)">' + esc(s.ponujen) + '</span>'
    : esc(q.v);
  scrIgra.innerHTML =
    '<div class="hud"><button class="btn btn-ghost" id="nazajIgre">⬅️</button>' + pikice() +
      '<span class="spacer"></span><span class="pill">' + n.emo + ' ' + esc(n.nm) + '</span></div>' +
    (n.cas ? '<div class="cas"><i id="casBar" style="width:' + (tek.doKonca / n.cas * 100) + '%"></i></div>' : '') +
    (n.dvoboj ? '<div class="igralca">' +
        '<div class="igralec' + (tek.igralec === 0 ? ' naVrsti' : '') + '">1. igralec<b>' + tek.rezultat[0] + '</b></div>' +
        '<div class="igralec' + (tek.igralec === 1 ? ' naVrsti' : '') + '">2. igralec<b>' + tek.rezultat[1] + '</b></div>' +
      '</div>' : '') +
    (n.varne ? lestev() : '') +
    '<div class="card">' +
      (n.pomoc ? '<div class="pomoci">' +
        '<button class="pomoc" data-pomoc="pol"' + (tek.pomoc.pol ? '' : ' disabled') + '>50 : 50</button>' +
        '<button class="pomoc" data-pomoc="namig"' + (tek.pomoc.namig ? '' : ' disabled') + '>💡 namig</button>' +
        '<button class="pomoc" data-pomoc="zamenjaj"' + (tek.pomoc.zamenjaj ? '' : ' disabled') + '>🔄 zamenjaj</button>' +
      '</div>' : '') +
      '<p class="q" style="--c:' + pod.c + '"><span class="kat">' + pod.emo + ' ' + esc(pod.nm) +
        (n.tip === 'drzi' ? ' · drži ali ne drži?' : '') + '</span>' + vprasanje + '</p>' +
      '<div class="opts' + (s.opts.length === 2 ? ' dva' : '') + '" id="opts">' +
        s.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' +
          (s.opts.length > 2 ? '<span class="crka">' + crke[i] + '</span>' : '') +
          '<span>' + esc(o.txt) + '</span></button>').join('') +
      '</div>' +
      '<div class="odziv" id="odziv"></div>' +
    '</div>';
  pokaziZaslon(scrIgra);
}

function odgovori(izbran){
  if (tek.odgovorjeno || tek.konec) return;
  const n = tek.n, s = tek.sest, q = s.q;
  const prav = (izbran === s.a);
  tek.odgovorjeno = true;
  tek.znaki[tek.i] = prav ? 1 : 0;
  if (prav){ tek.ok++; STANJE.zvezde++; zvOk(); } else { tek.napake.push(s); zvNe(); }
  if (n.dvoboj && prav) tek.rezultat[tek.igralec]++;
  zabelezi(q, prav);
  if (!n.dnevni && !n.dvoboj) prilagodi(tek.kat || 'mesano', prav);
  shrani(); narisiZvezde();

  const gumbi = $('opts').querySelectorAll('.opt');
  gumbi.forEach((b, i) => {
    b.disabled = true;
    if (i === s.a) b.classList.add('ok');
    else if (i === izbran) b.classList.add('no');
  });

  if (n.hitro){                     /* pri hitrem ognju ne ustavljamo – takoj naprej */
    setTimeout(() => { if (tek && !tek.konec){ tek.i++; naslednje(); } }, prav ? 350 : 800);
    if (!prav) $('odziv').innerHTML = '<span style="color:var(--no-d)">Pravilno: ' + esc(q.o) + '</span>';
    return;
  }

  const razlaga = (n.tip === 'drzi')
    ? 'Pravilen odgovor je: <b>' + esc(q.o) + '</b>.' + (q.zn ? ' ' + esc(q.zn) : '')
    : (q.zn ? esc(q.zn) : '');
  const zadnje = !n.cas && (tek.i + 1 >= n.st);
  const konecZaradiNapake = (n.konec === 'takoj' && !prav);
  $('odziv').innerHTML =
    (prav ? '<span style="color:var(--ok-d)">Točno! 🎉</span>' : '<span style="color:var(--no-d)">Ni pravilno.</span>') +
    (razlaga ? '<span class="zakaj">' + razlaga + '</span>' : '') +
    '<div style="margin-top:12px"><button class="btn btn-acc" id="naprej">' +
      (konecZaradiNapake || zadnje ? 'Zaključi ✅' : 'Naprej ➡️') + '</button></div>';
  if (prav && STANJE.zvezde % 10 === 0){ poskoci('⭐'); }
  if (n.varne && prav && n.varne.indexOf(tek.i + 1) >= 0){ poskoci('🔒'); zvVrh(); }
}

function naprej(){
  const n = tek.n;
  if (n.konec === 'takoj' && tek.znaki[tek.i] === 0) return konecKroga();
  tek.i++;
  if (n.dvoboj) tek.igralec = tek.i % 2;
  if (!n.cas && tek.i >= n.st) return konecKroga();
  naslednje();
}

function uporabiPomoc(kaj){
  if (!tek || tek.odgovorjeno || !tek.pomoc[kaj]) return;
  const s = tek.sest;
  if (kaj === 'pol'){
    const napacni = s.opts.map((o, i) => i).filter(i => i !== s.a);
    const skrij = premesaj(napacni).slice(0, Math.max(1, s.opts.length - 2));
    skrij.forEach(i => $('opts').querySelector('.opt[data-i="' + i + '"]').classList.add('skrit'));
  } else if (kaj === 'namig'){
    const q = s.q;
    const besedilo = q.zn ? q.zn : 'Pravilni odgovor se začne na črko »' + q.o.charAt(0).toUpperCase() + '«.';
    $('odziv').innerHTML = '<span class="zakaj">💡 ' + esc(besedilo) + '</span>';
  } else if (kaj === 'zamenjaj'){
    tek.pomoc.zamenjaj = false;
    naslednje();
    return;
  }
  tek.pomoc[kaj] = false;
  const g = document.querySelector('[data-pomoc="' + kaj + '"]');
  if (g) g.disabled = true;
}

function konecKroga(){
  if (tek.konec) return;
  tek.konec = true;
  if (ura){ clearInterval(ura); ura = null; }
  const n = tek.n;
  STANJE.iger++;
  zvKonec();

  let naslov = '', emo = '🎉', podnaslov = '';
  if (n.dvoboj){
    const [a, b] = tek.rezultat;
    naslov = a + ' : ' + b;
    emo = a === b ? '🤝' : '🏆';
    podnaslov = a === b ? 'Neodločeno!' : (a > b ? 'Zmagal je 1. igralec!' : 'Zmagal je 2. igralec!');
    STANJE.rek.dvoboj = (STANJE.rek.dvoboj || 0) + 1;
  } else if (n.varne){
    const dosezena = tek.znaki[tek.i] === 0 ? tek.i : tek.i;
    let varna = 0;
    for (const v of n.varne) if (dosezena >= v) varna = v;
    naslov = dosezena + '. stopnička';
    emo = dosezena >= n.st ? '👑' : dosezena >= 8 ? '🏆' : dosezena >= 4 ? '🎉' : '💪';
    podnaslov = dosezena >= n.st ? 'Prišel si čisto na vrh!' :
      (varna ? 'Zadnja varna stopnička: ' + varna + '.' : 'Naslednjič dlje!');
    if ((STANJE.rek.lestvica || 0) < dosezena) STANJE.rek.lestvica = dosezena;
  } else if (n.cas){
    naslov = tek.ok + ' pravilnih';
    emo = tek.ok >= 15 ? '🔥' : tek.ok >= 8 ? '🎉' : '💪';
    podnaslov = 'v eni minuti';
    if ((STANJE.rek.hitri || 0) < tek.ok){ STANJE.rek.hitri = tek.ok; podnaslov += ' – nov rekord! 🏅'; }
  } else {
    naslov = tek.ok + ' od ' + n.st;
    const del = tek.ok / n.st;
    emo = del === 1 ? '🏆' : del >= 0.8 ? '🎉' : del >= 0.5 ? '👍' : '💪';
    if (n.dnevni){
      STANJE.rek.izziv = tek.ok;
      const prej = STANJE.izziv[danes()] || 0;
      if (tek.ok > prej) STANJE.izziv[danes()] = tek.ok;
      podnaslov = 'Današnji izziv · najboljši rezultat danes: ' + STANJE.izziv[danes()] + '/10';
    } else if ((STANJE.rek[tek.nacin] || 0) < tek.ok) STANJE.rek[tek.nacin] = tek.ok;
  }
  shrani();

  const napake = tek.napake.length
    ? '<h2 class="section">Kar si se naučil</h2><ul class="seznam">' +
      tek.napake.slice(0, 6).map(s => '<li>' + esc(s.q.v) + ' <b>' + esc(s.q.o) + '</b></li>').join('') + '</ul>'
    : '<p class="mini" style="margin-top:12px">Brez napake – odlično! 🌟</p>';

  scrIgra.innerHTML =
    '<div class="card konec">' +
      '<div class="big">' + emo + '</div><h3>' + esc(naslov) + '</h3>' +
      (podnaslov ? '<p class="mini">' + esc(podnaslov) + '</p>' : '') +
      napake +
      '<div class="row" style="justify-content:center;margin-top:16px">' +
        '<button class="btn btn-acc" id="spet">Še enkrat 🔁</button>' +
        '<button class="btn btn-ghost" id="domov">Domov</button>' +
      '</div>' +
    '</div>';
  pokaziZaslon(scrIgra);
}

/* ======================= NASTAVITVE ====================================== */
function odpriNastavitve(){
  $('modalBox').innerHTML =
    '<h3 style="margin:0 0 6px;font-size:22px">Kotiček za starše ⚙️</h3>' +
    '<p class="mini" style="margin-bottom:14px">Vse ostane na tej napravi. Nič se ne pošilja na internet.</p>' +
    '<h2 class="section" style="margin-top:0">Težavnost</h2>' +
    '<div class="levels">' +
      [['auto','Samodejno','prilagaja se odgovorom'],
       ['lahko','Lahko','lažja vprašanja, tri možnosti'],
       ['srednje','Srednje','mešano'],
       ['tezko','Težko','samo najtežja vprašanja']].map(([id, nm, op]) =>
        '<button class="level" data-tez="' + id + '" aria-pressed="' + (STANJE.tezavnost === id) + '">' +
        nm + '<small>' + op + '</small></button>').join('') +
    '</div>' +
    '<h2 class="section">Drugo</h2>' +
    '<div class="levels"><button class="level" data-stikalo="zvok" aria-pressed="' + (STANJE.zvok ? 'true' : 'false') +
      '" style="grid-column:1/-1;text-align:left">Zvok<small>piski ob pravilnem in napačnem odgovoru</small></button></div>' +
    '<div class="row" style="margin-top:16px;justify-content:space-between">' +
      '<button class="btn btn-ghost" id="pobrisi">Ponastavi napredek</button>' +
      '<button class="btn btn-acc" id="zapri">Zapri</button>' +
    '</div>';
  $('modal').hidden = false;
}

/* ======================= DOGODKI ========================================= */
let izbraniNacin = null;
document.addEventListener('click', e => {
  const n = e.target.closest('[data-nacin]');
  if (n){ izbraniNacin = n.dataset.nacin;
    if (NACINI[izbraniNacin].dnevni) zacni(izbraniNacin, null); else narisiPodrocja(izbraniNacin);
    return; }
  const k = e.target.closest('[data-kat]');
  if (k){ zacni(izbraniNacin, k.dataset.kat || null); return; }
  if (e.target.closest('#nazajDomov') || e.target.closest('#domov')){ if (ura){ clearInterval(ura); ura = null; } if (tek) tek.konec = true; narisiDomov(); return; }
  if (e.target.closest('#nazajIgre')){ if (ura){ clearInterval(ura); ura = null; } tek.konec = true;
    if (izbraniNacin && !NACINI[izbraniNacin].dnevni) narisiPodrocja(izbraniNacin); else narisiDomov(); return; }
  if (e.target.closest('#spet')){ zacni(tek.nacin, tek.kat); return; }
  if (e.target.closest('#naprej')){ naprej(); return; }
  const p = e.target.closest('[data-pomoc]');
  if (p){ uporabiPomoc(p.dataset.pomoc); return; }
  const o = e.target.closest('#opts .opt');
  if (o && tek && !tek.odgovorjeno){ odgovori(+o.dataset.i); return; }
  if (e.target.closest('#gumbNast')){ odpriNastavitve(); return; }
  const t = e.target.closest('[data-tez]');
  if (t){ STANJE.tezavnost = t.dataset.tez; shrani(); odpriNastavitve(); return; }
  const s = e.target.closest('[data-stikalo]');
  if (s){ STANJE[s.dataset.stikalo] = !STANJE[s.dataset.stikalo]; shrani(); odpriNastavitve(); return; }
  if (e.target.closest('#pobrisi')){
    if (confirm('Res izbrišem ves napredek in zvezdice?')){
      STANJE = Object.assign({}, SVEZE, { st:{}, gor:{}, dol:{}, stat:{}, slabo:{}, rek:{}, izziv:{} });
      shrani(); narisiZvezde(); $('modal').hidden = true; narisiDomov();
    }
    return;
  }
  if (e.target.closest('#zapri') || e.target === $('modal')){ $('modal').hidden = true; return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').hidden){ $('modal').hidden = true; return; }
  if (!tek || tek.konec || scrIgra.hidden) return;
  if (tek.odgovorjeno && (e.key === 'Enter' || e.key === ' ')){ const g = $('naprej'); if (g){ e.preventDefault(); naprej(); } return; }
  const i = ['1','2','3','4'].indexOf(e.key);
  if (i >= 0 && !tek.odgovorjeno && tek.sest && i < tek.sest.opts.length) odgovori(i);
});

narisiZvezde();
narisiDomov();

</script>
</body>
</html>
